version: v2beta1

images:
  simple-agent:
    image: simple-agent
    dockerfile: Dockerfile
    context: .

pipelines:
  deploy: |-
    build_images --all
    create_deployments --all
  dev: |-
    build_images --all
    create_deployments --all
    start_dev --all

deployments:
  simple-agent:
    kubectl:
      manifests:
        - manifests.yaml

dev:
  simple-agent:
    imageSelector: simple-agent
    devImage: python:3.12-slim
    command:
      - sh
      - -c
      - "pip install uv && uv sync && uv run python -m simple_a2a_server --host 0.0.0.0"
    logs:
      lastLines: 50
    sync:
      - path: .:/app
        startContainer: true
        disableDownload: true
        uploadExcludeFile: .dockerignore
