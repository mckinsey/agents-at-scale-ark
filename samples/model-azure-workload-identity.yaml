apiVersion: ark.mckinsey.com/v1alpha1
kind: Model
metadata:
  name: azure-gpt4-workload-identity
  namespace: default
spec:
  provider: azure
  model:
    value: gpt-4
  config:
    azure:
      baseUrl:
        value: https://your-resource.openai.azure.com
      apiVersion:
        value: "2024-02-15-preview"
      auth:
        # Workload identity (works on any K8s cluster with OIDC)
        workloadIdentity:
          clientId:
            valueFrom:
              secretKeyRef:
                name: azure-workload-identity
                key: client-id
          tenantId:
            valueFrom:
              secretKeyRef:
                name: azure-workload-identity
                key: tenant-id
---
# Example secret (create this with your actual values)
apiVersion: v1
kind: Secret
metadata:
  name: azure-workload-identity
  namespace: default
type: Opaque
stringData:
  client-id: "your-azure-app-client-id"
  tenant-id: "your-azure-tenant-id"
