# Grant marketplace-source edit access to a user or group in a single namespace.
#
# The marketplace-source-editor ClusterRole (shipped with the dashboard chart)
# grants get/update/patch on the `marketplace-sources` ConfigMap. It is bound to
# no one by default. Apply a RoleBinding like this per namespace to let specific
# users or groups manage that namespace's marketplace catalogue:
#
#   kubectl apply -f marketplace-source-editor-binding.yaml
#
# Edit `namespace` and the subject(s) to suit. Read access for the catalogue is
# already granted to dashboard users by their tenant role; this binding only adds
# write access.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: marketplace-source-editor
  namespace: team-a
subjects:
  - kind: User
    name: alice@example.com
    apiGroup: rbac.authorization.k8s.io
  # - kind: Group
  #   name: platform-admins
  #   apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: marketplace-source-editor
  apiGroup: rbac.authorization.k8s.io
