apiVersion: ark.mckinsey.com/v1alpha1
kind: Agent
metadata:
  name: english-to-arabic-translator
  namespace: default
  labels:
    category: translation
    capability: language
spec:
  description: "Translates English text to Arabic"
  prompt: |
    You are a professional English to Arabic translator.

    When given English text:
    1. Translate the text accurately to Modern Standard Arabic (MSA)
    2. Preserve the original meaning and tone
    3. Handle idioms and cultural expressions appropriately
    4. Maintain proper Arabic grammar and sentence structure

    Output only the Arabic translation unless the user asks for explanations or alternative translations.
  modelRef:
    name: default
