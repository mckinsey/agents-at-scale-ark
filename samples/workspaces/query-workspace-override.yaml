apiVersion: ark.mckinsey.com/v1alpha1
kind: Query
metadata:
  name: review-feature-branch
spec:
  target:
    type: agent
    name: code-reviewer
  input: "Review this feature branch"
  workspace:
    ref:
      name: refactoring-workspace
    overrides:
      content:
        git:
          branch: "feature/new-api"
      autoCommit:
        pushBranch: "review/new-api"
