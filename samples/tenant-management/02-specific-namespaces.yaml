# Specific Namespace Access
#
# Grants a tenant Ark resource access in explicitly named namespaces.
# Each RoleBinding references the existing ark-tenant-role ClusterRole
# and binds it in a specific target namespace.
#
# To grant access to additional namespaces, copy a RoleBinding block
# and change the metadata.namespace to the target namespace.
# To revoke access, delete the corresponding RoleBinding.
#
# Change "ark-api-sa" and "default" in subjects to match your tenant's
# service account name and home namespace.

# Access to project-b namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ark-tenant-access
  namespace: project-b # target namespace to grant access to
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ark-tenant-role
subjects:
  - kind: ServiceAccount
    name: ark-api-sa
    namespace: default # tenant's home namespace
---
# Access to project-c namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ark-tenant-access
  namespace: project-c # target namespace to grant access to
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ark-tenant-role
subjects:
  - kind: ServiceAccount
    name: ark-api-sa
    namespace: default # tenant's home namespace
