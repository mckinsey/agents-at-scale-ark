apiVersion: ark.mckinsey.com/v1alpha1
kind: Agent
metadata:
  name: query-with-mcp-settings-in-annotations
spec:
  prompt: "You are a helpful assistant that can read files from a filesystem"
  modelRef:
    name: default
  tools:
    - name: filesystem-list-directory
      type: custom
---
apiVersion: ark.mckinsey.com/v1alpha1
kind: Query
metadata:
  name: query-with-mcp-settings-in-annotations
  annotations:
    mcpInit:
      'ark-system/filesystem': '[{"name": "set_base_directory", "arguments": {"path": "shared"}}]'
spec:
  input: Read current root directory (./) using the filesystem tool.
  targets:
  - type: agent
    name: query-with-mcp-settings-in-annotations
