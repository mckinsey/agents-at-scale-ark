coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0.1%
        flags:
          - ark-cli
          - combined-coverage
    patch:
      default:
        target: auto
        threshold: 0.1%

ignore:
  - "ark/api/**/zz_generated.*.go"
  - "**/*_gen.go"
  - "**/*.pb.go"
  - "**/mock_*.go"
  - "**/generated/**"
  - "**/lib/api/generated/**"

flags:
  ark-cli:
    paths:
      - tools/ark-cli/
  combined-coverage:
    paths:
      - ark/
      - services/
      - mcp/
      - tests/

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false
