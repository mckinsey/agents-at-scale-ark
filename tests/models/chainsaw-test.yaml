apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: models
spec:
  steps:
    - try:
      - script:
          content: |
            helm install mock-llm oci://ghcr.io/dwmkerr/charts/mock-llm \
              --version 0.1.25 \
              --namespace $NAMESPACE \
              --values mock-llm-values.yaml \
              --wait --timeout=120s
          env:
          - name: NAMESPACE
            value: ($namespace)
      - apply:
          file: "manifests/*.yaml"
      - assert:
          resource:
            apiVersion: ark.mckinsey.com/v1alpha1
            kind: Model
            metadata:
              name: default
            status:
              conditions:
              - type: ModelAvailable
                status: "True"
