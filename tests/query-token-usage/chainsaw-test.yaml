apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: query-token-usage
spec:
  description: Test query token usage tracking and validation
  steps:
  - name: setup-resources
    try:
    # Install mock-llm with token usage support
    - script:
        content: |
          helm install mock-llm oci://ghcr.io/dwmkerr/charts/mock-llm \
            --version 0.1.28 \
            --namespace $NAMESPACE \
            --values mock-llm-values.yaml
        env:
        - name: NAMESPACE
          value: ($namespace)
    # Install ark-tenant for RBAC
    - script:
        content: |
          helm install ark-tenant ../../charts/ark-tenant --namespace $NAMESPACE --create-namespace --wait
        env:
        - name: NAMESPACE
          value: ($namespace)
    # Wait for Model to be available before creating agents/queries
    - wait:
        apiVersion: ark.mckinsey.com/v1alpha1
        kind: Model
        name: test-model
        timeout: 3m
        for:
          condition:
            name: ModelAvailable
            value: 'True' 
    # Apply agent and query
    - apply:
        file: manifests/*.yaml
    - assert:
        resource:
          apiVersion: ark.mckinsey.com/v1alpha1
          kind: Agent
          metadata:
            name: token-test-agent

  # Wait fort the query to complete (error or success).
  - name: wait-for-query-completion
    try:
    - wait:
        apiVersion: ark.mckinsey.com/v1alpha1
        kind: Query
        name: token-usage-query
        for:
          condition:
            name: Completed
            value: 'True'
  - name: validate-response
    try:
    - assert:
        # Fast check - the resource won't change since the query is complete.
        timeout: 1s
        resource:
          apiVersion: ark.mckinsey.com/v1alpha1
          kind: Query
          metadata:
            name: token-usage-query
          status:
            phase: done
            (response != null): true
            (response.target.name): 'token-test-agent'
            (contains(response.content, 'distributed computing')): true
            (tokenUsage.promptTokens > `0`): true
            (tokenUsage.completionTokens > `0`): true
            (tokenUsage.totalTokens > `0`): true
    catch:
      # In the case of any errors, show the full query for troubleshooting.
      - describe:
          apiVersion: ark.mckinsey.com/v1alpha1
          kind: Query
          name: token-usage-query
      - events: {}

    cleanup:
    - script:
        content: |
          helm uninstall mock-llm --namespace $NAMESPACE --wait --timeout=180s || true
          helm uninstall ark-tenant --namespace $NAMESPACE --wait --timeout=180s || true
        env:
        - name: NAMESPACE
          value: ($namespace)
