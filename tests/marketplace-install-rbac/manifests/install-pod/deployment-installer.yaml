apiVersion: apps/v1
kind: Deployment
metadata: {name: probe-installer}
spec:
  replicas: 0
  selector: {matchLabels: {app: probe-installer}}
  template:
    metadata: {labels: {app: probe-installer}}
    spec:
      serviceAccountName: ark-marketplace-installer
      containers:
      - name: c
        image: curlimages/curl:8.11.1
        command: ["sleep", "3600"]
