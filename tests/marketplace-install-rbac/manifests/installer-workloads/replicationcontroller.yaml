apiVersion: v1
kind: ReplicationController
metadata: {name: uses-installer}
spec:
  replicas: 0
  selector: {app: uses-installer-rc}
  template:
    metadata: {labels: {app: uses-installer-rc}}
    spec:
      serviceAccountName: ark-marketplace-installer
      containers:
      - name: c
        image: curlimages/curl:8.11.1
        command: ["sleep", "3600"]
