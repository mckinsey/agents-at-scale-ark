
ark:
  model:
    enabled: false

config:
  rules:
    # Fails any request for 'gpt-fail' model
    - path: "/v1/chat/completions"
      match: "body.model == 'gpt-fail'"
      response:
        status: 401
        content: '{"error": {"message": "Invalid authentication", "type": "invalid_request_error", "code": "invalid_api_key"}}'
    
    # Default success for others
    - path: "/v1/chat/completions"
      match: "@"
      response:
        status: 200
        content: '{"choices":[{"message":{"role":"assistant","content":"Success"},"finish_reason":"stop"}]}'
