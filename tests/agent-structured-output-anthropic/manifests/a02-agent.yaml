apiVersion: ark.mckinsey.com/v1alpha1
kind: Agent
metadata:
  name: schema-agent
spec:
  prompt: Extract structured information from the input text.
  modelRef:
    name: test-model-anthropic
  outputSchema:
    type: object
    properties:
      summary:
        type: string
      sentiment:
        type: string
        enum: ["positive", "negative", "neutral"]
    required: ["summary", "sentiment"]
    additionalProperties: false
