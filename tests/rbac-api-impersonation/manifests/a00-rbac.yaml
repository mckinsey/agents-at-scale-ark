# RBAC configuration for API impersonation testing
# Creates RoleBindings for test groups (ark-admin and ark-viewers)
# Uses the ClusterRoles shipped with Ark for viewer/editor/admin access

---
# Admin role binding for agents
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ark-admin-agents
  namespace: ($namespace)
subjects:
  - kind: Group
    name: ark-admin
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: agent-editor-role
  apiGroup: rbac.authorization.k8s.io
---
# Admin role binding for models
apiVersion: rbac.authorization.k8s.io/v1
