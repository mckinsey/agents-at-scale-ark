# Test 1: Direct evaluation with short timeout (30 seconds)
apiVersion: ark.mckinsey.com/v1alpha1
kind: Evaluation
metadata:
  name: test-short-timeout-evaluation
spec:
  type: direct
  timeout: "30s"
  evaluator:
    name: test-timeout-evaluator
    parameters:
    - name: criteria
      value: "accuracy"
  config:
    input: "What is 2+2?"
    output: "The answer is 4"
---
# Test 3: Direct evaluation without timeout (should use default 5m)
apiVersion: ark.mckinsey.com/v1alpha1
kind: Evaluation
metadata:
  name: test-default-timeout-evaluation
spec:
  type: direct
  # No timeout specified - should use default 5m
  evaluator:
    name: test-timeout-evaluator
    parameters:
    - name: criteria
      value: "completeness"
  config:
    input: "Explain photosynthesis"
    output: "Photosynthesis is the process by which plants convert light energy into chemical energy"