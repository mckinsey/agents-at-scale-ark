apiVersion: ark.mckinsey.com/v1alpha1
kind: Model
metadata:
  name: model-token-test
spec:
  type: completions
  provider: azure
  model:
    value: ($azure.model)
  config:
    azure:
      baseUrl:
        value: ($azure.url)
      apiKey:
        valueFrom:
          secretKeyRef:
            name: model-test-token
            key: token
      apiVersion:
        value: "2024-12-01-preview"