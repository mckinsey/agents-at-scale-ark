apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: events-api-migration
spec:
  description: >
    The controller emits Kubernetes events through the events.k8s.io/v1 API
    (migrated from the deprecated core/v1 recorder). A Team's first reconcile
    emits a Normal "TeamCreated" event. Assert it is readable through the core/v1
    view — both by a plain list (dual-serving) and by the involvedObject field
    selector that fark, ark-cli and ark-api rely on — so the migration cannot
    silently break event consumers.
  steps:
  - name: create-team
    try:
    - apply:
        resource:
          apiVersion: ark.mckinsey.com/v1alpha1
          kind: Team
          metadata:
            name: events-migration-team
          spec:
            strategy: sequential
            members:
            - name: events-migration-agent
              type: agent

  - name: assert-team-created-event-via-core-v1
    try:
    - assert:
        resource:
          apiVersion: v1
          kind: Event
          type: Normal
          reason: TeamCreated
          involvedObject:
            kind: Team
            name: events-migration-team

  - name: assert-readable-by-involvedobject-field-selector
    try:
    - script:
        content: |
          set -e
          OUT=$(kubectl get events -n "$NAMESPACE" \
            --field-selector involvedObject.name=events-migration-team,reason=TeamCreated \
            -o json)
          COUNT=$(echo "$OUT" | jq '.items | length')
          if [ "$COUNT" -lt 1 ]; then
            echo "FAIL: TeamCreated event not returned via core/v1 involvedObject field selector"
            kubectl get events -n "$NAMESPACE" -o wide || true
            exit 1
          fi
          echo "PASS: TeamCreated event readable via involvedObject field selector"
        env:
        - name: NAMESPACE
          value: ($namespace)
