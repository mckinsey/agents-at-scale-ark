# Mock LLM configuration for the engine-backed and mixed team tests.
# The echo A2A agent stands in for an execution engine: it accepts A2A
# message/send and returns the text, which is all this test needs at the
# transport level. Chat completions are only used by the mixed team's local
# member, which runs the built-in completions loop against this mock.
terminationGracePeriodSeconds: 3
ark:
  a2a:
    enabled: true
    pollInterval: "3s"

config:
  rules:
  - path: "/v1/models"
    method: "GET"
    response:
      status: 200
      content: |
        {
          "object": "list",
          "data": [
            {
              "id": "gpt-4.1-mini",
              "object": "model",
              "owned_by": "openai"
            }
          ]
        }

  # Catch-all - matches everything but gets overridden by more specific rules.
  # This catches model probes which don't match the agent-specific rule below.
  - path: "/v1/chat/completions"
    response:
      status: 200
      content: '{"choices":[{"message":{"role":"assistant","content":"OK"},"finish_reason":"stop"}]}'

  # Local Reviewer Agent - the built-in member of the mixed team. This rule is
  # the failure case: the member ran, but its request carried no turn attributed
  # to the engine member. Overridden by the rule below when the turn is present.
  - path: "/v1/chat/completions"
    match: "contains(body.messages[0].content || '', 'Local Reviewer Agent')"
    response:
      status: 200
      content: '{"choices":[{"message":{"role":"assistant","content":"REVIEW-FAILED: no engine member turn in transcript"},"finish_reason":"stop"}],"usage":{"prompt_tokens":10,"completion_tokens":5,"total_tokens":15}}'

  # Same member, but the request also carries an assistant message attributed to
  # engine-member-a. addAgentNameToMessages stamps that name onto the engine
  # member's reply before it is appended to the shared transcript, so matching on
  # it proves the engine member's turn reached the local member. The query input
  # cannot satisfy this match - only a propagated turn carries the name.
  - path: "/v1/chat/completions"
    match: "contains(body.messages[0].content || '', 'Local Reviewer Agent') && contains(body.messages[*].name, 'engine-member-a')"
    response:
      status: 200
      content: '{"choices":[{"message":{"role":"assistant","content":"REVIEW: transcript contained the engine member turn"},"finish_reason":"stop"}],"usage":{"prompt_tokens":10,"completion_tokens":5,"total_tokens":15}}'
