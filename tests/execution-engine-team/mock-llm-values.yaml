# Mock LLM configuration for the engine-backed and mixed team tests.
# The echo A2A agent stands in for an execution engine: it accepts A2A
# message/send and returns the text, which is all this test needs at the
# transport level. Chat completions are only used by the mixed team's local
# member, which runs the built-in completions loop against this mock.
terminationGracePeriodSeconds: 3
ark:
  a2a:
    enabled: true
    pollInterval: "3s"

config:
  rules:
  - path: "/v1/models"
    method: "GET"
    response:
      status: 200
      content: |
        {
          "object": "list",
          "data": [
            {
              "id": "gpt-4.1-mini",
              "object": "model",
              "owned_by": "openai"
            }
          ]
        }

  # Catch-all - matches everything but gets overridden by more specific rules.
  # This catches model probes which don't match the agent-specific rule below.
  - path: "/v1/chat/completions"
    response:
      status: 200
      content: '{"choices":[{"message":{"role":"assistant","content":"OK"},"finish_reason":"stop"}]}'

  # Local Reviewer Agent - the built-in member of the mixed team.
  - path: "/v1/chat/completions"
    match: "contains(body.messages[0].content || '', 'Local Reviewer Agent')"
    response:
      status: 200
      content: '{"choices":[{"message":{"role":"assistant","content":"REVIEW: the engine member reply was received."},"finish_reason":"stop"}],"usage":{"prompt_tokens":10,"completion_tokens":5,"total_tokens":15}}'
