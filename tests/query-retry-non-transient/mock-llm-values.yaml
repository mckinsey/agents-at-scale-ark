# Mock LLM configuration for non-transient error testing
# Returns 400 Bad Request to verify no retry is attempted
terminationGracePeriodSeconds: 3
ark:
  model:
    enabled: true
    name: test-model
    type: openai
    model: gpt-4.1-mini
    pollInterval: 3s
    apiKey: mock-api-key

config:
  rules:
  # Fallback: handles probes and non-matching requests
  - path: "/v1/chat/completions"
    response:
      status: 200
      content: |
        {
          "id": "mock-probe",
          "object": "chat.completion",
          "model": "gpt-4.1-mini",
          "choices": [{"message": {"role": "assistant", "content": "ok"}, "finish_reason": "stop"}]
        }

  # 400 Bad Request - non-transient error, should not retry
  - path: "/v1/chat/completions"
    match: "contains(body.messages[-1].content || '', 'non-transient')"
    response:
      status: 400
      content: |
        {
          "error": {
            "message": "Bad Request - invalid input format",
            "type": "invalid_request_error",
            "code": "bad_request"
          }
        }
