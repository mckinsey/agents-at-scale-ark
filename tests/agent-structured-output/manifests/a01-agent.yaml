apiVersion: ark.mckinsey.com/v1alpha1
kind: Agent
metadata:
  name: schema-agent
spec:
  description: Agent that returns structured output
  prompt: Extract structured information from the input text.
  modelRef:
    name: test-model-mock
  outputSchema:
    type: object
    properties:
      summary:
        type: string
        description: A brief summary of the input text
      sentiment:
        type: string
        enum: ["positive", "negative", "neutral"]
        description: Overall sentiment of the input text
      confidence:
        type: number
        minimum: 0
        maximum: 1
        description: Confidence score for the analysis
    required: ["summary", "sentiment", "confidence"]
    additionalProperties: false
