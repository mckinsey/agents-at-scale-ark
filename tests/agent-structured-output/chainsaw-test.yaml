apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: agent-structured-output
spec:
  description: Test agent structured output with JSON schema
  timeouts:
    apply: 30s
    # Extended timeout as model probes can take time to validate availability
    assert: 120s
    cleanup: 30s
  steps:
  - name: deploy-resources
    try:
    - script:
        content: |
          helm install mock-llm oci://ghcr.io/dwmkerr/charts/mock-llm \
            --version 0.1.25 \
            --namespace $NAMESPACE \
            --values mock-llm-values.yaml \
            --wait --timeout=120s
        env:
        - name: NAMESPACE
          value: ($namespace)
    - script:
        content: |
          helm install ark-tenant ../../charts/ark-tenant --namespace $NAMESPACE --create-namespace --wait
        env:
        - name: NAMESPACE
          value: ($namespace)
    - apply:
        file: manifests/*.yaml

  - name: verify-model-ready
    try:
    - assert:
        resource:
          apiVersion: ark.mckinsey.com/v1alpha1
          kind: Model
          metadata:
            name: structured-output-test-model
            namespace: ($namespace)
          status:
            conditions:
            - type: ModelAvailable
              status: "True"
    
  - name: verify-agent-created
    try:
    - assert:
        resource:
          apiVersion: ark.mckinsey.com/v1alpha1
          kind: Agent
          metadata:
            name: structured-output-test-agent
            namespace: ($namespace)
    
  - name: verify-query-completion
    try:
    - assert:
        resource:
          apiVersion: ark.mckinsey.com/v1alpha1
          kind: Query
          metadata:
            name: structured-output-test-query
            namespace: ($namespace)
          status:
            (conditions[?type == 'Completed']):
            - status: 'True'
    catch:
    - events: {}
    - describe:
        apiVersion: ark.mckinsey.com/v1alpha1
        kind: Query
        name: structured-output-test-query
        namespace: ($namespace)

  - name: validate-response-structure
    try:
    - assert:
        resource:
          apiVersion: ark.mckinsey.com/v1alpha1
          kind: Query
          metadata:
            name: structured-output-test-query
            namespace: ($namespace)
          status:
            (conditions[?type == 'Completed']):
            - status: 'True'
            (contains(['positive', 'negative', 'neutral'], json_parse(responses[0].content).sentiment)): true
            (json_parse(responses[0].content).confidence >= `0`): true
            (json_parse(responses[0].content).confidence <= `1`): true
            (length(json_parse(responses[0].content).entities) >= `0`): true
    catch:
    - events: {}
    - describe:
        apiVersion: ark.mckinsey.com/v1alpha1
        kind: Query
        name: structured-output-test-query
        namespace: ($namespace)
