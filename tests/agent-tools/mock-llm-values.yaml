terminationGracePeriodSeconds: 3
ark:
  model:
    enabled: true
    name: test-model
    type: openai
    model: gpt-4
    apiKey: mock-api-key

config:
  rules:
    # Sequences 0-3: tool call response (extra buffer for health probes)
    - path: "/v1/chat/completions"
      sequence: 0
      response:
        status: 200
        content: |
          {
            "id": "mock-{{timestamp}}",
            "object": "chat.completion",
            "model": "{{jmes request body.model}}",
            "choices": [{
              "message": {
                "role": "assistant",
                "tool_calls": [{
                  "id": "call_weather",
                  "type": "function",
                  "function": {
                    "name": "weather-tool",
                    "arguments": "{\"latitude\": 40.7128, \"longitude\": -74.006, \"current_weather\": true}"
                  }
                }]
              },
              "finish_reason": "tool_calls"
            }]
          }

    - path: "/v1/chat/completions"
      sequence: 1
      response:
        status: 200
        content: |
          {
            "id": "mock-{{timestamp}}",
            "object": "chat.completion",
            "model": "{{jmes request body.model}}",
            "choices": [{
              "message": {
                "role": "assistant",
                "tool_calls": [{
                  "id": "call_weather",
                  "type": "function",
                  "function": {
                    "name": "weather-tool",
                    "arguments": "{\"latitude\": 40.7128, \"longitude\": -74.006, \"current_weather\": true}"
                  }
                }]
              },
              "finish_reason": "tool_calls"
            }]
          }

    # Sequences 2-5: final answer (extra buffer)
    - path: "/v1/chat/completions"
      sequence: 2
      response:
        status: 200
        content: |
          {
            "id": "mock-{{timestamp}}",
            "object": "chat.completion",
            "model": "{{jmes request body.model}}",
            "choices": [{
              "message": {
                "role": "assistant",
                "content": "The current weather in New York City is 68°F (20°C) with partly cloudy skies and winds from the west at 12 mph."
              },
              "finish_reason": "stop"
            }]
          }

    - path: "/v1/chat/completions"
      sequence: 3
      response:
        status: 200
        content: |
          {
            "id": "mock-{{timestamp}}",
            "object": "chat.completion",
            "model": "{{jmes request body.model}}",
            "choices": [{
              "message": {
                "role": "assistant",
                "content": "The current weather in New York City is 68°F (20°C) with partly cloudy skies and winds from the west at 12 mph."
              },
              "finish_reason": "stop"
            }]
          }

    - path: "/v1/chat/completions"
      sequence: 4
      response:
        status: 200
        content: |
          {
            "id": "mock-{{timestamp}}",
            "object": "chat.completion",
            "model": "{{jmes request body.model}}",
            "choices": [{
              "message": {
                "role": "assistant",
                "content": "The current weather in New York City is 68°F (20°C) with partly cloudy skies and winds from the west at 12 mph."
              },
              "finish_reason": "stop"
            }]
          }

    - path: "/v1/chat/completions"
      sequence: 5
      response:
        status: 200
        content: |
          {
            "id": "mock-{{timestamp}}",
            "object": "chat.completion",
            "model": "{{jmes request body.model}}",
            "choices": [{
              "message": {
                "role": "assistant",
                "content": "The current weather in New York City is 68°F (20°C) with partly cloudy skies and winds from the west at 12 mph."
              },
              "finish_reason": "stop"
            }]
          }

    # Fallback for model probes - MUST BE LAST
    - path: "/v1/chat/completions"
      match: "contains(body.messages[0].content, 'Hello')"
      response:
        status: 200
        content: |
          {
            "id": "mock-probe",
            "object": "chat.completion",
            "model": "gpt-4",
            "choices": [{"message": {"role": "assistant", "content": "OK"}, "finish_reason": "stop"}]
          }
