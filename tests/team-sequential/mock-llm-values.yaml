terminationGracePeriodSeconds: 3
ark:
  model:
    enabled: true
    name: test-model
    type: openai
    model: gpt-4
    apiKey: mock-api-key

config:
  rules:
    # All sequences return SUMMARY to handle any health probe consumption
    - path: "/v1/chat/completions"
      sequence: 0
      response:
        status: 200
        content: |
          {
            "id": "mock-{{timestamp}}",
            "object": "chat.completion",
            "model": "{{jmes request body.model}}",
            "choices": [{
              "message": {
                "role": "assistant",
                "content": "SUMMARY: AI is reshaping business with 77% adoption."
              },
              "finish_reason": "stop"
            }]
          }

    - path: "/v1/chat/completions"
