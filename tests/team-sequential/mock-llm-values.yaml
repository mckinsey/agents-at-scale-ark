terminationGracePeriodSeconds: 3
ark:
  model:
    enabled: true
    name: test-model
    type: openai
    model: gpt-4.1-mini
    apiKey: mock-api-key

config:
  rules:
    # Catch-all rule that returns a response containing SUMMARY
    # This handles both health probes and actual queries
    - path: "/v1/chat/completions"
      match: "@"
      response:
        status: 200
        content: |
          {
            "id": "mock-{{timestamp}}",
            "object": "chat.completion",
            "model": "{{jmes request body.model}}",
            "choices": [{
              "message": {
                "role": "assistant",
                "content": "SUMMARY: Artificial intelligence is fundamentally reshaping modern business operations. AI adoption has grown 270% with 77% of companies engaged. Organizations gain competitive advantages through better decision-making and task automation."
              },
              "finish_reason": "stop"
            }]
          }
