terminationGracePeriodSeconds: 3
ark:
  model:
    enabled: true
    name: test-model
    type: openai
    model: gpt-4.1-mini
    apiKey: mock-api-key

config:
  rules:
    # Single catch-all rule that returns SUMMARY for all requests
    # This handles health probes, all agent calls, and any other requests
    - path: "/v1/chat/completions"
      response:
        status: 200
        content: |
          {
            "id": "mock-{{timestamp}}",
            "object": "chat.completion",
            "model": "{{jmes request body.model}}",
            "choices": [{
              "message": {
                "role": "assistant",
                "content": "SUMMARY: AI is reshaping business with 77% adoption."
              },
              "finish_reason": "stop"
            }]
          }
