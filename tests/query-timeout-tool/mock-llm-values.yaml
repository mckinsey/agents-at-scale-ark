terminationGracePeriodSeconds: 3
ark:
  model:
    enabled: true
    name: test-model
    type: completions
    provider: openai
    model: gpt-4
    apiKey: mock-api-key

config:
  rules:
  - path: "^/v1/models$"
    method: "GET"
    response:
      status: 200
      content: |
        {
          "object": "list",
          "data": [{"id": "gpt-4", "object": "model", "created": 1687882411, "owned_by": "openai"}]
        }

  - path: "/v1/chat/completions"
    response:
      status: 200
      content: '{"choices":[{"message":{"role":"assistant","content":"OK"},"finish_reason":"stop"}]}'

  - path: "/v1/chat/completions"
    match: "contains(body.messages[0].content || '', 'testing assistant')"
    response:
      status: 200
      content: |
        {
          "choices": [{
            "message": {
              "role": "assistant",
              "tool_calls": [{
                "id": "call_slow",
                "type": "function",
                "function": {
                  "name": "slow-tool",
                  "arguments": "{\"seconds\": 5}"
                }
              }]
            },
            "finish_reason": "tool_calls"
          }]
        }

  - path: "/v1/chat/completions"
    match: "body.messages[?role=='tool']"
    response:
      status: 200
      content: '{"choices":[{"message":{"role":"assistant","content":"Done waiting 5 seconds as requested."},"finish_reason":"stop"}]}'
