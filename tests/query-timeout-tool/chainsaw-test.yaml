apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: query-timeout-tool
spec:
  description: Test that query timeout propagates to A2A client, allowing slow tool calls to complete
  timeouts:
    apply: 30s
    assert: 60s
  steps:
  - name: setup-slow-tool
    try:
    - apply:
        file: slow-tool.yaml
    - assert:
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: slow-tool
          status:
            readyReplicas: 1
    - script:
        content: |
          kubectl run test-slow-tool-ready --image=curlimages/curl --rm -i --restart=Never -n $NAMESPACE -- \
            curl -f -s --retry 5 --retry-connrefused --retry-delay 1 -X POST \
            -H "Content-Type: application/json" \
            -d '{"seconds": 1}' \
            "http://slow-tool-svc.$NAMESPACE.svc.cluster.local:8080/"
        env:
        - name: NAMESPACE
          value: ($namespace)
        timeout: 30s
    catch:
    - events: {}

  - name: setup-mock-llm
    try:
    - script:
        content: |
          helm install mock-llm oci://ghcr.io/dwmkerr/charts/mock-llm \
            --version 0.1.28 \
            --namespace $NAMESPACE \
            --values mock-llm-values.yaml \
            --wait --timeout=120s
        env:
        - name: NAMESPACE
          value: ($namespace)
    - script:
        content: |
          helm install ark-tenant ../../charts/ark-tenant --namespace $NAMESPACE --create-namespace --wait
        env:
        - name: NAMESPACE
          value: ($namespace)
    catch:
    - events: {}

  - name: wait-for-model
    try:
    - wait:
        apiVersion: ark.mckinsey.com/v1alpha1
        kind: Model
        name: test-model
        timeout: 3m
        for:
          condition:
            name: ModelAvailable
            value: 'True'
    catch:
    - script:
        content: |
          kubectl get model -n $NAMESPACE -o yaml 2>/dev/null || true
        env:
        - name: NAMESPACE
          value: ($namespace)

  - name: deploy-resources
    try:
    - apply:
        file: manifests/a00-rbac.yaml
    - apply:
        file: manifests/a01-slow-tool.yaml
    - apply:
        file: manifests/a02-agent.yaml
    - apply:
        file: manifests/a03-query.yaml
    catch:
    - events: {}

  - name: verify-query-completes
    try:
    - assert:
        resource:
          apiVersion: ark.mckinsey.com/v1alpha1
          kind: Query
          metadata:
            name: slow-tool-query
          status:
            phase: done
    - assert:
        resource:
          apiVersion: ark.mckinsey.com/v1alpha1
          kind: Query
          metadata:
            name: slow-tool-query
          status:
            (response != null): true
            (response.target.name): 'slow-agent'
            (length(response.content) > `10`): true
    catch:
    - events: {}
    - describe:
        apiVersion: ark.mckinsey.com/v1alpha1
        kind: Query
        name: slow-tool-query

    cleanup:
    - script:
        content: |
          helm uninstall mock-llm --namespace $NAMESPACE --wait --timeout=180s || true
          helm uninstall ark-tenant --namespace $NAMESPACE --wait --timeout=180s || true
        env:
        - name: NAMESPACE
          value: ($namespace)
