apiVersion: v1
kind: ConfigMap
metadata:
  name: slow-tool-script
data:
  server.py: |
    import json
    import time
    from http.server import HTTPServer, BaseHTTPRequestHandler

    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            content_length = int(self.headers.get("Content-Length", 0))
            body = json.loads(self.rfile.read(content_length)) if content_length else {}
            seconds = body.get("seconds", 30)
            seconds = max(1, min(seconds, 600))
            print(f"Sleeping for {seconds}s...", flush=True)
            time.sleep(seconds)
            result = json.dumps({"slept_seconds": seconds, "status": "done"})
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.end_headers()
            self.wfile.write(result.encode())

        def log_message(self, format, *args):
            print(f"{args[0]} {args[1]}", flush=True)

    if __name__ == "__main__":
        server = HTTPServer(("0.0.0.0", 8080), Handler)
        print("Slow tool service listening on :8080", flush=True)
        server.serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slow-tool
spec:
  replicas: 1
  selector:
    matchLabels:
      app: slow-tool
  template:
    metadata:
      labels:
        app: slow-tool
    spec:
      terminationGracePeriodSeconds: 3
      containers:
      - name: slow-tool
        image: python:3.12-slim
        command: ["python", "/app/server.py"]
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: script
          mountPath: /app
      volumes:
      - name: script
        configMap:
          name: slow-tool-script
---
apiVersion: v1
kind: Service
metadata:
  name: slow-tool-svc
spec:
  selector:
    app: slow-tool
  ports:
  - port: 8080
    targetPort: 8080
