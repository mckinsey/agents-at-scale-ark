terminationGracePeriodSeconds: 3
ark:
  a2a:
    enabled: true
  model:
    enabled: true
    name: test-model
    type: completions
    provider: openai
    model: gpt-4
    apiKey: mock-api-key

config:
  rules:
  - path: "/v1/models"
    method: "GET"
    response:
      status: 200
      content: |
        {
          "object": "list",
          "data": [
            {
              "id": "gpt-4",
              "object": "model",
              "created": 1687882411,
              "owned_by": "openai"
            }
          ]
        }

  # Catch-all for model probes
  - path: "/v1/chat/completions"
    response:
      status: 200
      content: '{"choices":[{"message":{"role":"assistant","content":"OK"},"finish_reason":"stop"}]}'

  # Coordinator agent - first call: delegate to specialist via tool call with A2A message format
  - path: "/v1/chat/completions"
    match: "contains(body.messages[0].content || '', 'A2A-native Coordinator')"
    response:
      status: 200
      content: |
        {
          "choices": [{
            "message": {
              "role": "assistant",
              "tool_calls": [{
                "id": "call_delegate_a2a",
                "type": "function",
                "function": {
                  "name": "call-specialist-a2a",
                  "arguments": "{\"message\":{\"role\":\"user\",\"parts\":[{\"kind\":\"text\",\"text\":\"Process this request with A2A message\"}]},\"contextId\":\"test-context-123\"}"
                }
              }]
            },
            "finish_reason": "tool_calls"
          }]
        }

  # Coordinator agent - second call (has tool result): return final answer
  - path: "/v1/chat/completions"
    match: "body.messages[?role=='tool']"
    response:
      status: 200
      content: '{"choices":[{"message":{"role":"assistant","content":"Delegation complete. The specialist processed the A2A message successfully."},"finish_reason":"stop"}]}'

  # Specialist agent: echo back confirmation
  - path: "/v1/chat/completions"
    match: "contains(body.messages[0].content || '', 'A2A-enabled Specialist')"
    response:
      status: 200
      content: '{"choices":[{"message":{"role":"assistant","content":"Specialist received A2A message. Processing request with context."},"finish_reason":"stop"}]}'
