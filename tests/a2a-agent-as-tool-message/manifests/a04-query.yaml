# Test Query - triggers coordinator to delegate with A2A message
apiVersion: ark.mckinsey.com/v1alpha1
kind: Query
metadata:
  name: a2a-delegation-test
  annotations:
    ark.mckinsey.com/a2a-experimental-enabled: "true"
spec:
  input: "Process this request using A2A delegation"
  target:
    type: agent
    name: coordinator-agent-a2a
