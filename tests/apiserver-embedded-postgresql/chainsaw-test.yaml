apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: apiserver-embedded-postgresql
  labels:
    requires-images: "true"
    storage-backend: "postgresql"
    isolated-cluster: "true"
spec:
  timeouts:
    apply: 60s
    assert: 120s
    exec: 300s
  description: |
    Test embedded apiserver with PostgreSQL storage backend.
    REQUIRES: Fresh cluster without existing Ark installation (uses cluster-scoped APIService).
  steps:
  - name: check-prerequisites
    try:
    - script:
        content: |
          echo "Checking for existing Ark installation..."
          if kubectl get deployment -n default ark-controller 2>/dev/null; then
            echo "ERROR: Existing Ark controller found in default namespace."
            echo "This test requires a fresh cluster without Ark installed."
            echo "The embedded apiserver uses cluster-scoped APIService which conflicts with existing installations."
            exit 1
          fi
          if kubectl get clusterrolebinding ark-apiserver:system:auth-delegator 2>/dev/null; then
            echo "ERROR: Existing Ark apiserver RBAC found."
            echo "Please uninstall Ark before running this test."
            exit 1
          fi
          echo "Prerequisites check passed - no conflicting Ark installation found"

  - name: deploy-postgresql
    try:
    - script:
        content: |
          helm install postgresql oci://registry-1.docker.io/bitnamicharts/postgresql \
            --namespace $NAMESPACE \
            --set auth.postgresPassword=arktest123 \
            --set auth.database=ark \
            --set primary.persistence.enabled=false \
            --wait --timeout=120s
        env:
        - name: NAMESPACE
          value: ($namespace)
    - assert:
        timeout: 2m
        resource:
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: postgresql
          status:
            readyReplicas: 1
    cleanup:
    - script:
        content: |
          helm uninstall postgresql --namespace $NAMESPACE --wait --timeout=60s || true
        env:
        - name: NAMESPACE
          value: ($namespace)

  - name: create-postgres-secret
    try:
    - apply:
        resource:
          apiVersion: v1
          kind: Secret
          metadata:
            name: ark-postgres-password
          type: Opaque
          stringData:
            password: arktest123

  - name: deploy-ark-with-postgresql
    try:
    - script:
        content: |
          helm install ark-controller ../../ark/dist/chart \
            --namespace $NAMESPACE \
            --set storage.backend=postgresql \
            --set storage.postgresql.host=postgresql.$NAMESPACE.svc.cluster.local \
            --set storage.postgresql.port=5432 \
            --set storage.postgresql.database=ark \
            --set storage.postgresql.user=postgres \
            --set storage.postgresql.passwordSecretName=ark-postgres-password \
            --set storage.postgresql.passwordSecretKey=password \
            --set storage.postgresql.sslMode=disable \
            --set storage.apiserver.port=6443 \
            --set webhook.enable=false \
            --set certmanager.enable=false \
            --set crd.enable=false \
            --wait --timeout=180s
        env:
        - name: NAMESPACE
          value: ($namespace)
    cleanup:
    - script:
        content: |
          helm uninstall ark-controller --namespace $NAMESPACE --wait --timeout=60s || true
        env:
        - name: NAMESPACE
          value: ($namespace)

  - name: wait-for-apiserver
    try:
    - assert:
        timeout: 3m
        resource:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: ark-controller
          status:
            readyReplicas: 1
    - script:
        timeout: 60s
        content: |
          echo "Waiting for APIService to be available..."
          for i in $(seq 1 30); do
            if kubectl get apiservice v1alpha1.ark.mckinsey.com -o jsonpath='{.status.conditions[?(@.type=="Available")].status}' 2>/dev/null | grep -q "True"; then
              echo "APIService is available"
              exit 0
            fi
            echo "Attempt $i: APIService not ready yet..."
            sleep 2
          done
          echo "APIService did not become available"
          kubectl get apiservice v1alpha1.ark.mckinsey.com -o yaml
          exit 1

  - name: test-crud-create
    try:
    - apply:
        resource:
          apiVersion: ark.mckinsey.com/v1alpha1
          kind: Model
          metadata:
            name: test-model-crud
          spec:
            provider: openai
            model:
              value: gpt-4o-mini
            config:
              openai:
                baseUrl:
                  value: https://api.openai.com/v1
                apiKey:
                  value: test-key-not-real
    - assert:
        resource:
          apiVersion: ark.mckinsey.com/v1alpha1
          kind: Model
          metadata:
            name: test-model-crud
          spec:
            provider: openai

  - name: test-crud-read
    try:
    - script:
        content: |
          MODEL=$(kubectl get model test-model-crud -n $NAMESPACE -o jsonpath='{.spec.provider}')
          if [ "$MODEL" != "openai" ]; then
            echo "Expected provider 'openai', got '$MODEL'"
            exit 1
          fi
          echo "Read test passed: provider=$MODEL"
        env:
        - name: NAMESPACE
          value: ($namespace)

  - name: test-crud-update
    try:
    - script:
        content: |
          kubectl patch model test-model-crud -n $NAMESPACE --type=merge \
            -p '{"spec":{"model":{"value":"gpt-4o"}}}'
        env:
        - name: NAMESPACE
          value: ($namespace)
    - assert:
        resource:
          apiVersion: ark.mckinsey.com/v1alpha1
          kind: Model
          metadata:
            name: test-model-crud
          spec:
            model:
              value: gpt-4o

  - name: test-status-subresource
    try:
    - script:
        content: |
          kubectl patch model test-model-crud -n $NAMESPACE --type=merge --subresource=status \
            -p '{"status":{"conditions":[{"type":"ModelAvailable","status":"True","reason":"TestReason","message":"Test message"}]}}'
        env:
        - name: NAMESPACE
          value: ($namespace)
    - assert:
        resource:
          apiVersion: ark.mckinsey.com/v1alpha1
          kind: Model
          metadata:
            name: test-model-crud
          status:
            conditions:
            - type: ModelAvailable
              status: "True"

  - name: test-data-persistence
    try:
    - script:
        content: |
          echo "Recording model UID before restart..."
          ORIGINAL_UID=$(kubectl get model test-model-crud -n $NAMESPACE -o jsonpath='{.metadata.uid}')
          echo "Original UID: $ORIGINAL_UID"

          echo "Restarting ark-controller..."
          kubectl rollout restart deployment/ark-controller -n $NAMESPACE
          kubectl rollout status deployment/ark-controller -n $NAMESPACE --timeout=120s

          echo "Waiting for APIService to recover..."
          sleep 10
          for i in $(seq 1 30); do
            if kubectl get apiservice v1alpha1.ark.mckinsey.com -o jsonpath='{.status.conditions[?(@.type=="Available")].status}' 2>/dev/null | grep -q "True"; then
              break
            fi
            sleep 2
          done

          echo "Verifying data persisted..."
          NEW_UID=$(kubectl get model test-model-crud -n $NAMESPACE -o jsonpath='{.metadata.uid}')
          echo "New UID: $NEW_UID"

          if [ "$ORIGINAL_UID" != "$NEW_UID" ]; then
            echo "ERROR: UID changed after restart - data was not persisted!"
            exit 1
          fi

          MODEL_VALUE=$(kubectl get model test-model-crud -n $NAMESPACE -o jsonpath='{.spec.model.value}')
          if [ "$MODEL_VALUE" != "gpt-4o" ]; then
            echo "ERROR: Model value changed after restart - expected 'gpt-4o', got '$MODEL_VALUE'"
            exit 1
          fi

          echo "Data persistence test PASSED"
        env:
        - name: NAMESPACE
          value: ($namespace)
        timeout: 180s

  - name: test-crud-delete
    try:
    - script:
        content: |
          kubectl delete model test-model-crud -n $NAMESPACE
        env:
        - name: NAMESPACE
          value: ($namespace)
    - script:
        content: |
          sleep 2
          if kubectl get model test-model-crud -n $NAMESPACE 2>/dev/null; then
            echo "ERROR: Model still exists after delete"
            exit 1
          fi
          echo "Delete test passed"
        env:
        - name: NAMESPACE
          value: ($namespace)

  catch:
  - events: {}
  - describe:
      apiVersion: apps/v1
      kind: Deployment
      name: ark-controller
  - describe:
      apiVersion: apps/v1
      kind: StatefulSet
      name: postgresql
  - script:
      content: |
        echo "=== PostgreSQL Logs ==="
        kubectl logs -n $NAMESPACE statefulset/postgresql --tail=50 || true
        echo "=== Ark Controller Logs ==="
        kubectl logs -n $NAMESPACE deployment/ark-controller --tail=100 || true
        echo "=== APIService Status ==="
        kubectl get apiservice v1alpha1.ark.mckinsey.com -o yaml || true
      env:
      - name: NAMESPACE
        value: ($namespace)
