apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: agent-parameters
spec:
  steps:
    - try:
      - script:
          content: |
            helm install mock-llm oci://ghcr.io/dwmkerr/charts/mock-llm \
              --version 0.1.25 \
              --namespace $NAMESPACE \
              --values mock-llm-values.yaml \
              --wait --timeout=120s
          env:
          - name: NAMESPACE
            value: ($namespace)
      - apply:
          file: "manifests/*.yaml"
      - assert:
          resource:
            apiVersion: v1
            kind: ConfigMap
            metadata:
              name: agent-config
      - assert:
          resource:
            apiVersion: v1
            kind: Secret
            metadata:
              name: agent-secrets
      - assert:
          resource:
            apiVersion: ark.mckinsey.com/v1alpha1
            kind: Model
            metadata:
              name: test-model
            status:
              conditions:
                - type: ModelAvailable
                  status: "True"
      - assert:
          resource:
            apiVersion: ark.mckinsey.com/v1alpha1
            kind: Agent
            metadata:
              name: test-agent-with-params