apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: export-import-argo
spec:
  description: >-
    End-to-end migration test for `ark export` / `ark import` with Argo workflow
    resources. Creates a mix of Ark-native resources (Model, Agent, Team) and
    Argo resources (ClusterWorkflowTemplate, WorkflowTemplate, CronWorkflow),
    exports them, deletes the originals, and re-imports, asserting every kind is
    captured in dependency order and lands back on the cluster.
  concurrent: false
  timeouts:
    apply: 60s
    assert: 120s
    exec: 300s
  steps:
  - name: install-argo
    try:
    - script:
        timeout: 300s
        content: |
          helm dependency update ../../services/argo-workflows/chart >/dev/null
          helm install argo ../../services/argo-workflows/chart \
            --namespace "$NAMESPACE" \
            --set argo-workflows.singleNamespace=true \
            --set httpRoute.argo.enabled=false \
            --set minio.enabled=false \
            --wait --timeout=300s
        env:
        - name: NAMESPACE
          value: ($namespace)
    - assert:
        resource:
          apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          metadata:
            name: clusterworkflowtemplates.argoproj.io
    cleanup:
    - script:
        content: |
          kubectl delete clusterworkflowtemplate "migration-cwf-$NAMESPACE" --ignore-not-found
          rm -f "/tmp/ark-export-$NAMESPACE.yaml"
          helm uninstall argo --namespace "$NAMESPACE" --wait --timeout=180s || true
        env:
        - name: NAMESPACE
          value: ($namespace)

  - name: build-ark-cli
    try:
    - script:
        timeout: 300s
        content: |
          # Build from source and invoke via `node dist/index.js` in later steps.
          # Avoids relying on a global npm prefix (not configured in every CI job)
          # and on PATH persisting across chainsaw's per-step shells.
          (cd ../../tools/ark-cli && npm ci && npm run build)
          node ../../tools/ark-cli/dist/index.js --version

  - name: create-source-resources
    try:
    - script:
        content: |
          kubectl apply -f - <<EOF
          apiVersion: ark.mckinsey.com/v1alpha1
          kind: Model
          metadata:
            name: migration-model
            namespace: $NAMESPACE
            labels:
              migration-test: "$NAMESPACE"
          spec:
            type: completions
            provider: azure
            model:
              value: gpt-4.1-mini
            config:
              azure:
                baseUrl:
                  value: https://example.openai.azure.com/
                apiKey:
                  value: fake-key
                apiVersion:
                  value: "2024-12-01-preview"
          ---
          apiVersion: ark.mckinsey.com/v1alpha1
          kind: Agent
          metadata:
            name: migration-agent
            namespace: $NAMESPACE
            labels:
              migration-test: "$NAMESPACE"
          spec:
            prompt: "You are a migration test agent."
            modelRef:
              name: migration-model
          ---
          apiVersion: ark.mckinsey.com/v1alpha1
          kind: Team
          metadata:
            name: migration-team
            namespace: $NAMESPACE
            labels:
              migration-test: "$NAMESPACE"
          spec:
            strategy: sequential
            members:
              - type: agent
                name: migration-agent
          ---
          apiVersion: argoproj.io/v1alpha1
          kind: WorkflowTemplate
          metadata:
            name: migration-wf
            namespace: $NAMESPACE
            labels:
              migration-test: "$NAMESPACE"
          spec:
            entrypoint: main
            templates:
              - name: main
                container:
                  image: alpine:3
                  command: [echo]
                  args: ["hello from workflowtemplate"]
          ---
          apiVersion: argoproj.io/v1alpha1
          kind: CronWorkflow
          metadata:
            name: migration-cron
            namespace: $NAMESPACE
            labels:
              migration-test: "$NAMESPACE"
          spec:
            schedules:
              - "0 0 * * *"
            workflowSpec:
              entrypoint: main
              templates:
                - name: main
                  container:
                    image: alpine:3
                    command: [echo]
                    args: ["hello from cronworkflow"]
          ---
          apiVersion: argoproj.io/v1alpha1
          kind: ClusterWorkflowTemplate
          metadata:
            name: migration-cwf-$NAMESPACE
            labels:
              migration-test: "$NAMESPACE"
          spec:
            entrypoint: main
            templates:
              - name: main
                container:
                  image: alpine:3
                  command: [echo]
                  args: ["hello from clusterworkflowtemplate"]
          EOF
        env:
        - name: NAMESPACE
          value: ($namespace)
    - assert:
        resource:
          apiVersion: argoproj.io/v1alpha1
          kind: WorkflowTemplate
          metadata:
            name: migration-wf
    - assert:
        resource:
          apiVersion: argoproj.io/v1alpha1
          kind: CronWorkflow
          metadata:
            name: migration-cron

  - name: export-and-verify
    try:
    - script:
        timeout: 120s
        content: |
          set -u
          FILE="/tmp/ark-export-$NAMESPACE.yaml"

          node ../../tools/ark-cli/dist/index.js export \
            -n "$NAMESPACE" -l "migration-test=$NAMESPACE" -o "$FILE"

          failed=0
          for kind in Model Agent Team ClusterWorkflowTemplate WorkflowTemplate CronWorkflow; do
            if grep -q "kind: $kind" "$FILE"; then
              echo "  ok: $kind present"
            else
              echo "  FAIL: $kind missing from export"; failed=1
            fi
          done

          # dependency order: Ark-native before Argo; cluster templates before namespaced templates
          agent_line=$(grep -n "^kind: Agent$" "$FILE" | head -1 | cut -d: -f1)
          cwt_line=$(grep -n "^kind: ClusterWorkflowTemplate$" "$FILE" | head -1 | cut -d: -f1)
          wt_line=$(grep -n "^kind: WorkflowTemplate$" "$FILE" | head -1 | cut -d: -f1)
          echo "  order: agent=$agent_line clusterWorkflowTemplate=$cwt_line workflowTemplate=$wt_line"
          [ -n "$agent_line" ] && [ -n "$cwt_line" ] && [ "$agent_line" -lt "$cwt_line" ] \
            || { echo "  FAIL: expected Agent before ClusterWorkflowTemplate"; failed=1; }
          [ -n "$cwt_line" ] && [ -n "$wt_line" ] && [ "$cwt_line" -lt "$wt_line" ] \
            || { echo "  FAIL: expected ClusterWorkflowTemplate before WorkflowTemplate"; failed=1; }

          exit $failed
        env:
        - name: NAMESPACE
          value: ($namespace)

  - name: delete-and-reimport
    try:
    - script:
        timeout: 180s
        content: |
          set -u
          FILE="/tmp/ark-export-$NAMESPACE.yaml"

          kubectl delete workflowtemplates,cronworkflows,agents,teams,models \
            -n "$NAMESPACE" -l "migration-test=$NAMESPACE" --wait
          kubectl delete clusterworkflowtemplate "migration-cwf-$NAMESPACE" --ignore-not-found --wait

          remaining=$(kubectl get workflowtemplates,cronworkflows,agents,teams,models \
            -n "$NAMESPACE" -l "migration-test=$NAMESPACE" --no-headers 2>/dev/null | wc -l | tr -d ' ')
          cwt_remaining=$(kubectl get clusterworkflowtemplate "migration-cwf-$NAMESPACE" \
            --no-headers 2>/dev/null | wc -l | tr -d ' ')
          echo "  after delete: namespaced=$remaining clusterWorkflowTemplate=$cwt_remaining"
          [ "$remaining" = "0" ] || { echo "  FAIL: namespaced resources not deleted"; exit 1; }
          [ "$cwt_remaining" = "0" ] || { echo "  FAIL: ClusterWorkflowTemplate not deleted"; exit 1; }

          node ../../tools/ark-cli/dist/index.js import "$FILE"
        env:
        - name: NAMESPACE
          value: ($namespace)
    - assert:
        resource:
          apiVersion: ark.mckinsey.com/v1alpha1
          kind: Model
          metadata:
            name: migration-model
    - assert:
        resource:
          apiVersion: ark.mckinsey.com/v1alpha1
          kind: Agent
          metadata:
            name: migration-agent
    - assert:
        resource:
          apiVersion: ark.mckinsey.com/v1alpha1
          kind: Team
          metadata:
            name: migration-team
    - assert:
        resource:
          apiVersion: argoproj.io/v1alpha1
          kind: WorkflowTemplate
          metadata:
            name: migration-wf
    - assert:
        resource:
          apiVersion: argoproj.io/v1alpha1
          kind: CronWorkflow
          metadata:
            name: migration-cron
    - script:
        content: |
          kubectl get clusterworkflowtemplate "migration-cwf-$NAMESPACE"
        env:
        - name: NAMESPACE
          value: ($namespace)
    catch:
    - events: {}
    - script:
        content: |
          echo "=== exported file ==="
          cat "/tmp/ark-export-$NAMESPACE.yaml" || true
        env:
        - name: NAMESPACE
          value: ($namespace)
