apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: global-ttl-eval
spec:
  description: ArkConfig evaluationTTL is injected into Evaluation resources with no spec.ttl
  steps:
  - name: apply-and-assert-ttl-injected
    try:
    - apply:
        file: manifests/a00-rbac.yaml
    - apply:
        file: manifests/a01-arkconfig.yaml
    - apply:
        file: manifests/a02-evaluation.yaml
    - assert:
        resource:
          apiVersion: ark.mckinsey.com/v1alpha1
          kind: Evaluation
          metadata:
            name: test-evaluation-global-ttl
          spec:
            ttl: 3h0m0s
    catch:
    - events: {}
    - describe:
        apiVersion: ark.mckinsey.com/v1alpha1
        kind: Evaluation
        name: test-evaluation-global-ttl

    cleanup:
    - script:
        content: |
          kubectl delete arkconfig default --ignore-not-found
