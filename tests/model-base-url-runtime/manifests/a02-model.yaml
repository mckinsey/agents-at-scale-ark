apiVersion: ark.mckinsey.com/v1alpha1
kind: Model
metadata:
  name: configmap-endpoint-model
spec:
  provider: openai
  model:
    value: gpt-4.1-mini
  pollInterval: 3s
  config:
    openai:
      baseUrl:
        valueFrom:
          configMapKeyRef:
            name: model-endpoint
            key: base-url
      apiKey:
        value: mock-api-key
