terminationGracePeriodSeconds: 1
ark:
  model:
    enabled: true
    name: test-model-mock
    type: completions
    provider: openai
    model: gpt-4.1-mini
    pollInterval: 3s
    apiKey: mock-api-key
resources:
  limits:
    cpu: 50m
    memory: 64Mi
  requests:
    cpu: 10m
    memory: 32Mi
config:
  rules:
  - path: "/v1/chat/completions"
    response:
      status: 200
      content: '{"choices":[{"message":{"role":"assistant","content":"Hello! I received your message."},"finish_reason":"stop"}]}'
