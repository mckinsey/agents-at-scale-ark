terminationGracePeriodSeconds: 1
resources:
  limits:
    cpu: 50m
    memory: 64Mi
  requests:
    cpu: 10m
    memory: 32Mi
config:
  rules:
  - path: "/v1/chat/completions"
    response:
      status: 200
      content: '{"choices":[{"message":{"role":"assistant","content":"Hello! I received your message."},"finish_reason":"stop"}]}'
