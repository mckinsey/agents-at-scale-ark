[pytest]
# ../cli-tests puts the shared helpers package (helpers.k8s) on the path so
# this suite reuses it instead of re-implementing kubectl calls.
pythonpath = . ../cli-tests
markers =
    dashboard: marks tests as dashboard UI tests
    agents: marks tests as agents UI tests
    models: marks tests as models UI tests
    secrets: marks tests as secrets UI tests
    teams: marks tests as teams UI tests
    workflows: marks tests as workflow UI tests
    hitl: marks tests as human-in-the-loop approval UI tests
    llm: marks tests that need a real LLM endpoint (deselect with -m 'not llm')
    xdist_group: pytest-xdist worker grouping
# The hitl journeys need a real LLM endpoint, so they are deselected by
# default (this is what CI runs). Run them with `pytest tests/ -m llm`,
# which overrides this.
addopts = -m "not llm" --durations=10
filterwarnings =
    ignore::pytest.PytestUnknownMarkWarning
