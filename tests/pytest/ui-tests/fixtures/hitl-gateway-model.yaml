# Model backing the human-in-the-loop journeys.
#
# Unlike the rest of this suite these journeys cannot run on mock-llm: the
# approval gate only opens once an agent emits a tool call, the executor always
# streams model calls for a top-level query, and mock-llm drops tool_calls from
# a streamed response. So they need a real OpenAI-compatible endpoint.
#
# The placeholders are substituted from the environment by the test fixture,
# so no credential is stored here. Temperature is deliberately left unset:
# Ark sends 1.0 by default, and reasoning models reject anything else.
apiVersion: v1
kind: Secret
metadata:
  name: hitl-gateway-token
  namespace: default
type: Opaque
stringData:
  token: ${HITL_MODEL_API_KEY}
---
apiVersion: ark.mckinsey.com/v1alpha1
kind: Model
metadata:
  name: hitl-gateway-model
  namespace: default
spec:
  type: openai
  model:
    value: ${HITL_MODEL_NAME}
  pollInterval: 1m
  config:
    openai:
      baseUrl:
        value: ${HITL_MODEL_BASE_URL}
      apiKey:
        valueFrom:
          secretKeyRef:
            name: hitl-gateway-token
            key: token
