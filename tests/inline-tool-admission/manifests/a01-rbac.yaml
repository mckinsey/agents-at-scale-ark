apiVersion: v1
kind: ServiceAccount
metadata:
  name: inline-unauth
  namespace: default
---
# Can author Tools generally, but is not granted "use inlinetools", so inline
# authoring must still be denied.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tools-author-no-inline
  namespace: default
rules:
- apiGroups: ["ark.mckinsey.com"]
  resources: ["tools"]
  verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: inline-unauth-tools
  namespace: default
subjects:
- kind: ServiceAccount
  name: inline-unauth
  namespace: default
roleRef:
  kind: Role
  name: tools-author-no-inline
  apiGroup: rbac.authorization.k8s.io
