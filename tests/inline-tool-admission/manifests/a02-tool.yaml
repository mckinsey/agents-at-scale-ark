apiVersion: ark.mckinsey.com/v1alpha1
kind: Tool
metadata:
  name: inline-admission-probe
  namespace: default
  annotations:
    # A requester-supplied authorship value that admission must overwrite.
    ark.mckinsey.com/inline-authored-by: attacker-supplied
spec:
  type: inline
  description: Minimal inline tool for admission checks
  inputSchema:
    type: object
    properties:
      "n":
        type: integer
        description: ignored
    required: ["n"]
    additionalProperties: false
  inline:
    language: python
    source: |
      import json
      import sys

      json.loads(sys.argv[1])
      print(json.dumps({"ok": True}))
