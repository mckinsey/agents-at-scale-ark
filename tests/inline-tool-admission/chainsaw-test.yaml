apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: inline-tool-admission
  labels:
    inline-tools: "true"
spec:
  # Admission enforcement is the same decision on both storage backends, but the
  # inline e2e job passes no storage-backend input, so this suite runs on etcd
  # and exercises the webhook path only; both-backend e2e coverage is still
  # outstanding (task 7.2). Pin to the watched default namespace.
  namespace: default
  description: >
    Inline authoring admission: an identity that can author Tools but lacks the
    inlinetools use permission is denied, an identity holding the shipped
    inline-tool-author-role is accepted, and admission stamps authorship over
    any requester-supplied value.
  steps:
    - name: rbac
      try:
        - apply:
            file: manifests/a01-rbac.yaml

    - name: deny-unauthorized-author
      try:
        # tools/create alone must not let a subject introduce executable source.
        - script:
            timeout: 60s
            content: |
              sa=system:serviceaccount:default:inline-unauth
              if out=$(kubectl apply --as="$sa" -f manifests/a02-tool.yaml 2>&1)
              then
                echo "expected denial but the apply succeeded: $out"
                exit 1
              fi
              echo "$out" | grep -q 'not permitted to author inline tools' || {
                echo "denied, but for the wrong reason: $out"
                exit 1
              }
              echo "correctly denied"
        # The denied apply created nothing.
        - error:
            resource:
              apiVersion: ark.mckinsey.com/v1alpha1
              kind: Tool
              metadata:
                name: inline-admission-probe
                namespace: default

    - name: accept-authorized-and-stamp-authorship
      try:
        # Impersonate a subject whose only inline permission is the chart's
        # inline-tool-author-role, so acceptance depends on that grant passing
        # the SubjectAccessReview and not on the suite's admin kubeconfig.
        - script:
            timeout: 60s
            content: |
              set -e
              sa=system:serviceaccount:default:inline-author
              kubectl apply --as="$sa" -f manifests/a02-tool.yaml
        # Accepted, and the requester-supplied authored-by is replaced by the
        # real authenticated identity of the impersonated author.
        - assert:
            resource:
              apiVersion: ark.mckinsey.com/v1alpha1
              kind: Tool
              metadata:
                name: inline-admission-probe
                namespace: default
                (annotations."ark.mckinsey.com/inline-authored-by"):
                  'system:serviceaccount:default:inline-author'
                (annotations."ark.mckinsey.com/inline-authored-at" != null):
                  true
      catch:
        - events: {}
        - describe:
            apiVersion: ark.mckinsey.com/v1alpha1
            kind: Tool
            name: inline-admission-probe
            namespace: default

    - name: deny-source-change-by-non-author
      try:
        # tools/create + tools/update alone must not let a subject rewrite
        # already-admitted executable source either.
        - script:
            timeout: 60s
            content: |
              set -e
              original=$(kubectl get tool inline-admission-probe -n default -o jsonpath='{.spec.inline.source}')
              if out=$(kubectl patch tool inline-admission-probe -n default \
                  --as=system:serviceaccount:default:inline-unauth --type=merge \
                  -p '{"spec":{"inline":{"source":"print(\"tampered\")\n"}}}' 2>&1)
              then
                echo "expected denial but the patch succeeded: $out"
                exit 1
              fi
              echo "$out" | grep -q 'not permitted to author inline tools' || {
                echo "denied, but for the wrong reason: $out"
                exit 1
              }
              stored=$(kubectl get tool inline-admission-probe -n default -o jsonpath='{.spec.inline.source}')
              if [ "$stored" != "$original" ]; then
                echo "source changed despite the denial"
                exit 1
              fi
              echo "correctly denied, source unchanged"

    - name: deny-authorship-spoof-via-metadata-only-update
      try:
        # A metadata-only update (spec untouched) needs no author permission,
        # so the patch itself must succeed - but admission must still treat
        # the stored authorship as authoritative over the requester's value.
        - script:
            timeout: 60s
            content: |
              set -e
              kubectl patch tool inline-admission-probe -n default \
                --as=system:serviceaccount:default:inline-unauth --type=merge \
                -p '{"metadata":{"annotations":{"ark.mckinsey.com/inline-authored-by":"attacker"}}}'
              stored=$(kubectl get tool inline-admission-probe -n default \
                -o jsonpath='{.metadata.annotations.ark\.mckinsey\.com/inline-authored-by}')
              if [ "$stored" != "system:serviceaccount:default:inline-author" ]; then
                echo "authorship was overwritten by a non-author's metadata-only update: $stored"
                exit 1
              fi
              echo "update allowed, but stored authorship is unchanged"

    - name: restamp-authorship-on-authorized-edit
      try:
        # An author's own edit to the source is a new authoring event, so the
        # stamp must move - both the identity and the timestamp.
        - script:
            timeout: 60s
            content: |
              set -e
              original_at=$(kubectl get tool inline-admission-probe -n default \
                -o jsonpath='{.metadata.annotations.ark\.mckinsey\.com/inline-authored-at}')
              sleep 1
              kubectl patch tool inline-admission-probe -n default \
                --as=system:serviceaccount:default:inline-author --type=merge \
                -p '{"spec":{"inline":{"source":"import json\nprint(json.dumps({\"ok\": True}))\n"}}}'
              new_by=$(kubectl get tool inline-admission-probe -n default \
                -o jsonpath='{.metadata.annotations.ark\.mckinsey\.com/inline-authored-by}')
              new_at=$(kubectl get tool inline-admission-probe -n default \
                -o jsonpath='{.metadata.annotations.ark\.mckinsey\.com/inline-authored-at}')
              [ "$new_by" = "system:serviceaccount:default:inline-author" ] || {
                echo "authored-by not re-stamped: $new_by"
                exit 1
              }
              [ "$new_at" != "$original_at" ] || {
                echo "authored-at not re-stamped"
                exit 1
              }
              echo "authorized edit re-stamped authorship"
      catch:
        - events: {}
        - describe:
            apiVersion: ark.mckinsey.com/v1alpha1
            kind: Tool
            name: inline-admission-probe
            namespace: default
      cleanup:
        - delete:
            ref:
              apiVersion: ark.mckinsey.com/v1alpha1
              kind: Tool
              name: inline-admission-probe
              namespace: default
