apiVersion: ark.mckinsey.com/v1alpha1
kind: Tool
metadata:
  name: run-command
spec:
  type: http
  inputSchema:
    type: object
    properties:
      command:
        type: string
        description: Shell command to execute on the host
    required: ["command"]
  description: "Runs a shell command on the host and returns its output"
  http:
    url: http://command-runner-mock/run?cmd={command}
