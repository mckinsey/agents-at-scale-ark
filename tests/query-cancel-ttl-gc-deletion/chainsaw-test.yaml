apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: query-cancel-ttl-gc-deletion
spec:
  description: spec.cancel on a running Query must transition it to canceled and, once its TTL elapses, the GC path must fully reap it (companion to query-ttl-gc-deletion, which covers the done/error terminal paths).
  timeouts:
    delete: 15s
    cleanup: 30s
  steps:
  - name: setup-mock-llm
    try:
    - script:
        timeout: 180s
        content: |
          bash ../shared/install-mock-llm.sh
        env:
        - name: NAMESPACE
          value: ($namespace)

  - name: wait-for-model-ready
    try:
    - wait:
        apiVersion: ark.mckinsey.com/v1alpha1
        kind: Model
        name: test-model-mock
        timeout: 90s
        for:
          condition:
            name: ModelAvailable
            value: 'True'

  - name: query-halts-at-input-required
    try:
    - apply:
        file: manifests/a00-rbac.yaml
    - apply:
        file: manifests/a01-tool.yaml
    - apply:
        file: manifests/a02-agent.yaml
    - apply:
        file: manifests/a03-query.yaml
    - wait:
        apiVersion: ark.mckinsey.com/v1alpha1
        kind: Query
        name: cancel-ttl-gc-deletion-query
        timeout: 90s
        for:
          jsonPath:
            path: '{.status.phase}'
            value: input-required
    - assert:
        timeout: 1s
        resource:
          apiVersion: ark.mckinsey.com/v1alpha1
          kind: Query
          metadata:
            name: cancel-ttl-gc-deletion-query
            finalizers:
            - ark.mckinsey.com/finalizer
          status:
            phase: input-required
    catch:
    - events: {}
    - describe:
        apiVersion: ark.mckinsey.com/v1alpha1
        kind: Query
        name: cancel-ttl-gc-deletion-query

  - name: cancel-the-query
    try:
    - script:
        content: |
          kubectl patch query cancel-ttl-gc-deletion-query -n "$NAMESPACE" --type=merge \
            -p '{"spec":{"cancel":true}}'
        env:
        - name: NAMESPACE
          value: ($namespace)
    - wait:
        apiVersion: ark.mckinsey.com/v1alpha1
        kind: Query
        name: cancel-ttl-gc-deletion-query
        timeout: 30s
        for:
          jsonPath:
            path: '{.status.phase}'
            value: canceled
    catch:
    - events: {}
    - describe:
        apiVersion: ark.mckinsey.com/v1alpha1
        kind: Query
        name: cancel-ttl-gc-deletion-query

  - name: wait-for-ttl-triggered-deletion
    try:
    - wait:
        apiVersion: ark.mckinsey.com/v1alpha1
        kind: Query
        name: cancel-ttl-gc-deletion-query
        timeout: 15s
        for:
          deletion: {}
    catch:
    - events: {}
    - describe:
        apiVersion: ark.mckinsey.com/v1alpha1
        kind: Query
        name: cancel-ttl-gc-deletion-query

    cleanup:
    - script:
        content: |
          helm uninstall mock-llm --namespace $NAMESPACE --wait --timeout=60s || true
        env:
        - name: NAMESPACE
          value: ($namespace)
