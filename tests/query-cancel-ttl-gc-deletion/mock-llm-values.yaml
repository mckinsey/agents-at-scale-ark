config:
  rules:
  - path: "/v1/models"
    method: "GET"
    response:
      status: 200
      content: |
        {
          "object": "list",
          "data": [{"id": "gpt-4.1-mini", "object": "model", "owned_by": "openai"}]
        }

  - path: "/v1/chat/completions"
    match: "@"
    response:
      status: 200
      content: |
        {
          "choices": [{
            "message": {
              "role": "assistant",
              "tool_calls": [{
                "id": "call_exec",
                "type": "function",
                "function": {
                  "name": "run-command",
                  "arguments": "{\"command\": \"id\"}"
                }
              }]
            },
            "finish_reason": "tool_calls"
          }]
        }
