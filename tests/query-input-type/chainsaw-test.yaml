apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: query-input-types
spec:
  description: Test query input types complete successfully
  scenarios:
  - bindings:
    - name: queryFile
      value: manifests/query-input-type-default.yaml
    - name: queryName
      value: test-query-input-default
  - bindings:
    - name: queryFile
      value: manifests/query-input-type-user.yaml
    - name: queryName
      value: test-query-input-type-user
  - bindings:
    - name: queryFile
      value: manifests/query-input-type-messages.yaml
    - name: queryName
      value: test-query-input-type-messages
  steps:
  - name: run
    try:
    - script:
        skipLogOutput: true
        content: |
          set -u
          echo "{\"token\": \"$E2E_TEST_AZURE_OPENAI_KEY\", \"url\": \"$E2E_TEST_AZURE_OPENAI_BASE_URL\"}"
        outputs:
        - name: azure
          value: (json_parse($stdout))
    - script:
        content: |
          helm template ark-tenant ../../charts/ark-tenant --namespace $NAMESPACE | kubectl apply -f -
        env:
        - name: NAMESPACE
          value: ($namespace)
    - apply:
        file: manifests/a01-secret.yaml
    - apply:
        file: manifests/a02-model.yaml
    - apply:
        file: manifests/a03-agent.yaml
    - apply:
        file: ($queryFile)
    - assert:
        resource:
          apiVersion: ark.mckinsey.com/v1alpha1
          kind: Model
          metadata:
            name: test-model
    - assert:
        resource:
          apiVersion: ark.mckinsey.com/v1alpha1
          kind: Agent
          metadata:
            name: test-agent
    - assert:
        resource:
          apiVersion: ark.mckinsey.com/v1alpha1
          kind: Query
          metadata:
            name: ($queryName)
          status:
            phase: done
    - assert:
        resource:
          apiVersion: ark.mckinsey.com/v1alpha1
          kind: Query
          metadata:
            name: ($queryName)
          status:
            (conditions[?type == 'Completed']):
            - status: 'True'
    - assert:
        resource:
          apiVersion: ark.mckinsey.com/v1alpha1
          kind: Query
          metadata:
            name: ($queryName)
          status:
            (response != null): true
            (response.target.name): 'test-agent'
            (length(response.content) > `10`): true
    catch:
    - events: {}
    - describe:
        apiVersion: ark.mckinsey.com/v1alpha1
        kind: Query
        name: ($queryName)

