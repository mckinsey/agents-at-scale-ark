    - name: queryFile
      value: manifests/query-input-type-default-invalid-input.yaml
    - name: queryName
      value: test-query-default-invalid-input
  - bindings:
    - name: queryFile
      value: manifests/query-input-type-user-invalid-input.yaml
    - name: queryName
      value: test-query-input-type-user-invalid-input
  - bindings:
    - name: queryFile
      value: manifests/query-input-type-messages-invalid-input.yaml
    - name: queryName
      value: test-query-input-type-messages-invalid-input
  steps:
  - name: run
    try:
    - script:
        skipLogOutput: true
        content: |
          set -u
          echo "{\"token\": \"$E2E_TEST_AZURE_OPENAI_KEY\", \"url\": \"$E2E_TEST_AZURE_OPENAI_BASE_URL\"}"
        outputs:
        - name: azure
          value: (json_parse($stdout))
    - script:
        content: |
          helm template ark-tenant ../../charts/ark-tenant --namespace $NAMESPACE | kubectl apply -f -
        env:
        - name: NAMESPACE
          value: ($namespace)
    - apply:
        file: manifests/a01-secret.yaml
    - apply:
        file: manifests/a02-model.yaml
    - apply:
        file: manifests/a03-agent.yaml
    - apply:
        file: ($queryFile)
    - assert:
