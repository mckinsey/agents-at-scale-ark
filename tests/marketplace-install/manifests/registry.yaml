apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
spec:
  selector:
    matchLabels: {app: registry}
  template:
    metadata:
      labels: {app: registry}
    spec:
      containers:
      - name: registry
        image: registry:2
        ports: [{containerPort: 5000}]
        readinessProbe:
          httpGet: {path: /v2/, port: 5000}
---
apiVersion: v1
kind: Service
metadata:
  name: registry
spec:
  selector: {app: registry}
  ports: [{port: 5000, targetPort: 5000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
spec:
  selector:
    matchLabels: {app: catalog}
  template:
    metadata:
      labels: {app: catalog}
    spec:
      containers:
      - name: nginx
        image: nginxinc/nginx-unprivileged:1.29-alpine
        ports: [{containerPort: 8080}]
        volumeMounts: [{name: catalog, mountPath: /usr/share/nginx/html}]
        readinessProbe:
          httpGet: {path: /marketplace.json, port: 8080}
      volumes:
      - name: catalog
        configMap: {name: catalog}
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
spec:
  selector: {app: catalog}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: v1
kind: Pod
metadata:
  name: mkt-curl
spec:
  containers:
  - name: curl
    image: curlimages/curl:8.11.1
    command: ["sleep", "1800"]
  restartPolicy: Never
  terminationGracePeriodSeconds: 0
