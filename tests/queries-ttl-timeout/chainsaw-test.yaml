apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: test-query-ttl-timeout
spec:
  steps:
    - try:
      - script:
          content: |
            helm install mock-llm oci://ghcr.io/dwmkerr/charts/mock-llm \
              --version 0.1.25 \
              --namespace $NAMESPACE \
              --values mock-llm-values.yaml \
              --wait --timeout=120s
          env:
          - name: NAMESPACE
            value: ($namespace)
      - script:
          content: |
            helm install ark-tenant ../../charts/ark-tenant --namespace $NAMESPACE --create-namespace --wait
          env:
          - name: NAMESPACE
            value: ($namespace)
      - apply:
          file: "manifests/*.yaml"
      - assert:
          resource:
            apiVersion: ark.mckinsey.com/v1alpha1
            kind: Model
            metadata:
              name: test-model-openai
            status:
              conditions:
              - type: ModelAvailable
                status: "True"
      - assert:
          resource:
            apiVersion: ark.mckinsey.com/v1alpha1
            kind: Agent
            metadata:
              name: test-math
      - assert:
          resource:
            apiVersion: ark.mckinsey.com/v1alpha1
            kind: Query
            metadata:
              name: test-query-math-timeout
            status:
              (phase == 'done' || phase == 'error'): true
      catch:
      - events: {}
      - describe:
          apiVersion: ark.mckinsey.com/v1alpha1
          kind: Query
          name: test-query-math-ttl