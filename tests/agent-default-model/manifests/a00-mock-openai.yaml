# Mock OpenAI server using mock-llm (https://github.com/dwmkerr/mock-llm)
apiVersion: v1
kind: ConfigMap
metadata:
  name: mock-openai-config
data:
  mock-llm.yaml: |
    rules:
    - method: GET
      path: /v1/models
      response:
        content: |
          {
            "object": "list",
            "data": [
              {
                "id": "gpt-4",
                "object": "model",
                "created": 1687882411,
                "owned_by": "openai"
              },
              {
                "id": "gpt-4o-mini",
                "object": "model",
                "created": 1687882411,
                "owned_by": "openai"
              },
              {
                "id": "gpt-4.1",
                "object": "model",
                "created": 1687882411,
                "owned_by": "openai"
              },
              {
                "id": "gpt-5",
                "object": "model",
                "created": 1687882411,
                "owned_by": "openai"
              }
            ]
          }
        status: 200
---
apiVersion: v1
kind: Service
metadata:
  name: mock-openai
spec:
  selector:
    app: mock-openai
  ports:
  - port: 80
    targetPort: 6556
---
apiVersion: v1
kind: Pod
metadata:
  name: mock-openai
  labels:
    app: mock-openai
spec:
  containers:
  - name: mock-llm
    image: ghcr.io/dwmkerr/mock-llm:0.1.28
    ports:
    - containerPort: 6556
    volumeMounts:
    - name: config
      mountPath: /app/mock-llm.yaml
      subPath: mock-llm.yaml
    readinessProbe:
      httpGet:
        path: /health
        port: 6556
      initialDelaySeconds: 2
      periodSeconds: 5
  volumes:
  - name: config
    configMap:
      name: mock-openai-config
