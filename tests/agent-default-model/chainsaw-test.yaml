apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: agent-default-model
spec:
  description: Test agent behavior with and without default model
  steps:
  - name: test-with-default-model
    try:
    - script:
        skipLogOutput: true
        content: |
          set -u
          echo "{\"token\": \"$E2E_TEST_AZURE_OPENAI_KEY\", \"url\": \"$E2E_TEST_AZURE_OPENAI_BASE_URL\"}"
        outputs:
        - name: azure
          value: (json_parse($stdout))
    - apply:
        file: manifests/*.yaml
    - assert:
        resource:
          apiVersion: ark.mckinsey.com/v1alpha1
          kind: Model
          metadata:
            name: default
          status:
            conditions:
            - type: ModelAvailable
              status: "True"
    - assert:
        resource:
          apiVersion: ark.mckinsey.com/v1alpha1
          kind: Agent
          metadata:
            name: agent-no-model
          spec:
            modelRef:
              name: default
    - assert:
        resource:
          apiVersion: ark.mckinsey.com/v1alpha1
          kind: Query
          metadata:
            name: default-model-query
          status:
            phase: done
    - assert:
        resource:
          apiVersion: ark.mckinsey.com/v1alpha1
          kind: Query
          metadata:
            name: default-model-query
          status:
            (length(responses)): 1
            (contains(responses[*].target.name, 'agent-no-model')): true
            (length(join('', responses[*].content)) > `10`): true
    catch:
    - events: {}
    - describe:
        apiVersion: ark.mckinsey.com/v1alpha1
        kind: Query
        name: default-model-query

  - name: test-without-default-model
    try:
    - apply:
        resource:
          apiVersion: ark.mckinsey.com/v1alpha1
          kind: Agent
          metadata:
            name: agent-no-default-model
          spec:
            prompt: |
              You are a test agent created without a default model.
    - assert:
        resource:
          apiVersion: ark.mckinsey.com/v1alpha1
          kind: Agent
          metadata:
            name: agent-no-default-model
          spec:
            modelRef:
              name: default
    - assert:
        resource:
          apiVersion: ark.mckinsey.com/v1alpha1
          kind: Agent
          metadata:
            name: agent-no-default-model
          status:
            conditions:
            - type: Available
              status: "False"
              reason: ModelNotFound
              message: (contains(@, 'default'))
    catch:
    - events: {}
    - describe:
        apiVersion: ark.mckinsey.com/v1alpha1
        kind: Agent
        name: agent-no-default-model