app:
  env:
    - name: CORS_ORIGINS
      value: "*"
    - name: AUTH_MODE
      value: "sso"
    - name: OIDC_ISSUER_URL
      value: "http://dex.__NAMESPACE__.svc.cluster.local:5556/dex"
    - name: OIDC_APPLICATION_ID
      value: "ark-dashboard"
    - name: OIDC_JWKS_URL
      value: "http://dex.__NAMESPACE__.svc.cluster.local:5556/dex/keys"
    - name: PROXY_TIMEOUT
      value: "10.0"
    - name: PROXY_MAX_UPLOAD_BYTES
      value: "1048576"
    - name: ARGO_SERVER_URL
      value: "http://argo-workflows-server:2746"
    - name: ARK_A2A_AGENT_CARD_PORT
      value: "8000"
    - name: ARK_A2A_AGENT_CARD_HOST
      value: "ark-api.127.0.0.1.nip.io"
    - name: ARK_A2A_AGENT_CARD_PROTOCOL
      value: "http"
    - name: READ_ONLY_MODE
      value: "false"
    - name: ARK_API_PUBLIC_CALLBACK_URL
      value: "http://127.0.0.1:34780/v1/mcp/auth/callback"
    - name: ARK_API_DASHBOARD_URL
      value: "http://dashboard.default.127.0.0.1.nip.io:8080"

impersonation:
  enabled: false
  fallback: false
  usernameClaim: email
  groupsClaim: groups
  prefix: ""
