apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: secret-scoping-personal
  labels:
    requires-images: "true"
spec:
  description: >
    #2559 phase 2: personal secrets through a real ark-api in AUTH_MODE=sso
    with real identities from Dex. Checks that the API rejects requests
    without a valid token, that a personal secret is stored as
    u-<sha256(username)[:16]>-<name> with the owner's scope label, that only
    its owner can list, read, change or delete it while anyone else gets the
    same 404 as a missing secret, that promoting it to shared keeps the name
    and makes it visible to everyone, that a shared secret cannot be made
    personal, and that a personal secret can only be referenced from its
    owner's Query MCP header overrides that select one server by name.
  timeouts:
    apply: 120s
    assert: 120s
    exec: 180s

  steps:
  - name: install-dex
    try:
    - script:
        timeout: 300s
        content: |
          helm upgrade --install dex ../../charts/ark-dex-dev \
            --namespace "$NAMESPACE" \
            --set issuer="http://dex.$NAMESPACE.svc.cluster.local:5556/dex" \
            --set oauth2.passwordConnector=local \
            --set rbac.create=false \
            --wait --timeout=240s
        env:
        - name: NAMESPACE
          value: ($namespace)
    catch:
    - script:
        content: |
          kubectl -n $NAMESPACE get pods -o wide
          kubectl -n $NAMESPACE logs -l app=dex --tail=100 || true
        env:
        - name: NAMESPACE
          value: ($namespace)
    cleanup:
    - script:
        content: |
          helm uninstall dex --namespace $NAMESPACE --wait --timeout=120s || true
        env:
        - name: NAMESPACE
          value: ($namespace)

  - name: install-ark-api
    try:
    - script:
        timeout: 240s
        content: |
          sed "s/__NAMESPACE__/$NAMESPACE/g" manifests/ark-api-values.yaml | \
          helm upgrade --install ark-api ../../services/ark-api/chart \
            --namespace "$NAMESPACE" \
            -f - \
            ${ARK_API_IMAGE:+--set app.image.repository=${ARK_API_IMAGE}} \
            ${ARK_API_IMAGE_TAG:+--set app.image.tag=${ARK_API_IMAGE_TAG}} \
            --wait --timeout=180s
        env:
        - name: NAMESPACE
          value: ($namespace)
    catch:
    - script:
        content: |
          kubectl -n $NAMESPACE get pods -o wide
          kubectl -n $NAMESPACE logs -l app=ark-api --tail=200 || true
        env:
        - name: NAMESPACE
          value: ($namespace)
    cleanup:
    - script:
        content: |
          helm uninstall ark-api --namespace $NAMESPACE --wait --timeout=120s || true
        env:
        - name: NAMESPACE
          value: ($namespace)

  - name: setup
    try:
    - apply:
        file: manifests/a01-shared-secret.yaml
    - apply:
        file: manifests/a02-model.yaml
    - apply:
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            name: personal-curl
          spec:
            containers:
              - name: curl
                image: curlimages/curl:8.11.1
                command: ["sleep", "900"]
            restartPolicy: Never
            terminationGracePeriodSeconds: 0
    - wait:
        apiVersion: v1
        kind: Pod
        name: personal-curl
        timeout: 120s
        for:
          condition:
            name: Ready
            value: 'True'

  - name: auth-gate
    try:
    - script:
        timeout: 90s
        content: |
          set -eu
          . ./helpers.sh
          ADMIN=$(token admin@ark.local)

          expect_status "GET without a token" "$(call "" GET "")" 401
          expect_status "GET with a forged token" "$(call "not-a-jwt" GET "")" 401
          R=$(call "$ADMIN" GET "")
          expect_status "GET as admin" "$R" 200
          [ "$(names "$R")" = '["ark-shared-token"]' ] || { echo "FAIL: unexpected list $(names "$R")"; exit 1; }
        env:
        - name: NAMESPACE
          value: ($namespace)
    catch:
    - script:
        content: |
          kubectl -n $NAMESPACE logs -l app=ark-api --tail=100 || true
        env:
        - name: NAMESPACE
          value: ($namespace)

  - name: personal-crud
    try:
    - script:
        timeout: 120s
        content: |
          set -eu
          . ./helpers.sh
          ADMIN=$(token admin@ark.local)
          VIEWER=$(token viewer@ark.local)
          HASH=$(owner_hash admin@ark.local)
          NAME="u-$HASH-github"

          R=$(call "$ADMIN" POST "" '{"name":"github","string_data":{"token":"admin-value"},"description":"GitHub token","scope":"personal"}')
          expect_status "POST personal as admin" "$R" 200
          body_of "$R" | jq -e --arg name "$NAME" '.name == $name and .display_name == "github" and .scope == "personal"' >/dev/null \
            || { echo "FAIL: unexpected create response"; body_of "$R"; exit 1; }
          kubectl get secret "$NAME" -n "$NAMESPACE" -o json \
            | jq -e --arg scope "user-$HASH" '.metadata.labels | ."ark.mckinsey.com/resource-type" == "secret" and ."ark.mckinsey.com/scope" == $scope' >/dev/null \
            || { echo "FAIL: $NAME does not carry the owner's scope label"; exit 1; }

          R=$(call "$ADMIN" GET "")
          [ "$(names "$R")" = '["ark-shared-token"]' ] || { echo "FAIL: default list is not shared only: $(names "$R")"; exit 1; }
          R=$(call "$ADMIN" GET "?scope=personal")
          [ "$(names "$R")" = "[\"$NAME\"]" ] || { echo "FAIL: admin personal list: $(names "$R")"; exit 1; }
          R=$(call "$ADMIN" GET "?scope=all")
          [ "$(names "$R")" = "[\"ark-shared-token\",\"$NAME\"]" ] || { echo "FAIL: admin all list: $(names "$R")"; exit 1; }
          expect_status "GET own personal as admin" "$(call "$ADMIN" GET "/$NAME")" 200

          R=$(call "$VIEWER" GET "?scope=all")
          [ "$(names "$R")" = '["ark-shared-token"]' ] || { echo "FAIL: viewer sees $(names "$R")"; exit 1; }
          R=$(call "$VIEWER" GET "?scope=personal")
          [ "$(names "$R")" = '[]' ] || { echo "FAIL: viewer personal list: $(names "$R")"; exit 1; }

          VIEWER_NAME="u-$(owner_hash viewer@ark.local)-github"
          [ "$VIEWER_NAME" != "$NAME" ] || { echo "FAIL: both users got the same personal name"; exit 1; }
          R=$(call "$VIEWER" POST "" '{"name":"github","string_data":{"token":"viewer-value"},"scope":"personal"}')
          expect_status "POST personal github as viewer" "$R" 200
          R=$(call "$VIEWER" GET "?scope=personal")
          [ "$(names "$R")" = "[\"$VIEWER_NAME\"]" ] || { echo "FAIL: viewer personal list: $(names "$R")"; exit 1; }
          R=$(call "$ADMIN" GET "?scope=personal")
          [ "$(names "$R")" = "[\"$NAME\"]" ] || { echo "FAIL: admin sees viewer's secret: $(names "$R")"; exit 1; }

          BEFORE=$(kubectl get secret "$NAME" -n "$NAMESPACE" -o json | jq -c '{data, labels: .metadata.labels}')
          [ -n "$BEFORE" ] || { echo "FAIL: could not read $NAME"; exit 1; }
          MISSING=$(body_of "$(call "$VIEWER" GET "/u-$HASH-missing")" | jq -r .detail | sed "s/u-$HASH-missing/NAME/")
          for METHOD in GET PUT DELETE; do
            case $METHOD in
              PUT) R=$(call "$VIEWER" PUT "/$NAME" '{"string_data":{"token":"stolen"},"scope":"shared"}') ;;
              *) R=$(call "$VIEWER" "$METHOD" "/$NAME") ;;
            esac
            expect_status "$METHOD admin's personal as viewer" "$R" 404
            DETAIL=$(body_of "$R" | jq -r .detail | sed "s/$NAME/NAME/")
            [ "$DETAIL" = "$MISSING" ] || { echo "FAIL: '$DETAIL' differs from a missing secret's '$MISSING'"; exit 1; }
          done
          AFTER=$(kubectl get secret "$NAME" -n "$NAMESPACE" -o json | jq -c '{data, labels: .metadata.labels}')
          [ "$BEFORE" = "$AFTER" ] || { echo "FAIL: viewer changed admin's personal secret"; exit 1; }
        env:
        - name: NAMESPACE
          value: ($namespace)
    catch:
    - script:
        content: |
          kubectl -n $NAMESPACE get secrets --show-labels || true
          kubectl -n $NAMESPACE logs -l app=ark-api --tail=100 || true
        env:
        - name: NAMESPACE
          value: ($namespace)

  - name: promotion
    try:
    - script:
        timeout: 120s
        content: |
          set -eu
          . ./helpers.sh
          ADMIN=$(token admin@ark.local)
          VIEWER=$(token viewer@ark.local)
          HASH=$(owner_hash admin@ark.local)
          NAME="u-$HASH-github"

          R=$(call "$ADMIN" PUT "/$NAME" '{"scope":"shared","description":"GitHub token"}')
          expect_status "PUT scope=shared as admin" "$R" 200
          body_of "$R" | jq -e --arg name "$NAME" '.name == $name and .display_name == "github" and .scope == "shared" and .description == "GitHub token"' >/dev/null \
            || { echo "FAIL: unexpected promote response"; body_of "$R"; exit 1; }
          kubectl get secret "$NAME" -n "$NAMESPACE" -o json \
            | jq -e '.metadata.labels."ark.mckinsey.com/scope" == "shared" and (.data.token | @base64d) == "admin-value"' >/dev/null \
            || { echo "FAIL: promotion did not flip the label or lost the value"; exit 1; }

          R=$(call "$VIEWER" GET "")
          [ "$(names "$R")" = "[\"ark-shared-token\",\"$NAME\"]" ] || { echo "FAIL: viewer does not see the promoted secret: $(names "$R")"; exit 1; }
          expect_status "GET promoted as viewer" "$(call "$VIEWER" GET "/$NAME")" 200

          R=$(call "$ADMIN" POST "" '{"name":"github","string_data":{"token":"again"},"scope":"personal"}')
          expect_status "POST personal github again after promotion" "$R" 409

          VIEWER_NAME="u-$(owner_hash viewer@ark.local)-github"
          expect_status "DELETE own personal as viewer" "$(call "$VIEWER" DELETE "/$VIEWER_NAME")" 200
          ! kubectl get secret "$VIEWER_NAME" -n "$NAMESPACE" 2>/dev/null || { echo "FAIL: $VIEWER_NAME was not deleted"; exit 1; }

          R=$(call "$ADMIN" PUT "/ark-shared-token" '{"scope":"personal"}')
          expect_status "PUT scope=personal on a shared secret" "$R" 422
          kubectl get secret ark-shared-token -n "$NAMESPACE" -o json \
            | jq -e '.metadata.labels."ark.mckinsey.com/scope" == "shared"' >/dev/null \
            || { echo "FAIL: ark-shared-token is no longer shared"; exit 1; }
        env:
        - name: NAMESPACE
          value: ($namespace)
    catch:
    - script:
        content: |
          kubectl -n $NAMESPACE get secrets --show-labels || true
          kubectl -n $NAMESPACE logs -l app=ark-api --tail=100 || true
        env:
        - name: NAMESPACE
          value: ($namespace)

  - name: enforcement
    try:
    - script:
        timeout: 150s
        content: |
          set -eu
          . ./helpers.sh
          ADMIN=$(token admin@ark.local)
          VIEWER=$(token viewer@ark.local)
          HASH=$(owner_hash admin@ark.local)
          MCP="u-$HASH-mcp"
          PROMOTED="u-$HASH-github"
          SELECTOR='{"matchLabels":{"ark.mckinsey.com/name":"github"}}'

          override() {
            printf '{"resourceType":"%s","labelSelector":%s,"headers":[{"name":"Authorization","value":{"valueFrom":{"secretKeyRef":{"name":"%s","key":"token"}}}}]}' "$2" "$3" "$1"
          }
          query() {
            printf '{"name":"%s","input":"hi","target":{"type":"model","name":"personal-model"},%s}' "$1" "$2"
          }
          model() {
            printf '{"name":"%s","provider":"openai","model":"gpt-4o-mini","config":{"openai":{"baseUrl":"https://model.invalid/v1","apiKey":{"valueFrom":{"secretKeyRef":{"name":"%s","key":"token"}}}}}}' "$1" "$2"
          }
          expect_rejected() {
            expect_status "$1" "$2" 422
            DETAIL=$(body_of "$2" | jq -r .detail)
            [ "$DETAIL" = "$REJECTED" ] || { echo "FAIL: '$DETAIL' differs from '$REJECTED'"; exit 1; }
            assert_absent "$3" "$4"
          }
          assert_absent() {
            kubectl get "$1" "$2" -n "$NAMESPACE" 2>&1 | grep -q NotFound || { echo "FAIL: $1/$2 exists or could not be checked"; exit 1; }
          }

          R=$(call "$ADMIN" POST "" '{"name":"mcp","string_data":{"token":"admin-mcp-value"},"scope":"personal"}')
          expect_status "POST personal mcp as admin" "$R" 200

          R=$(call_api queries "$ADMIN" POST "" "$(query q-owner "\"overrides\":[$(override "$MCP" mcpserver "$SELECTOR")]")")
          expect_status "POST query with own personal MCP override as admin" "$R" 200
          kubectl get query q-owner -n "$NAMESPACE" -o json \
            | jq -e --arg name "$MCP" '.spec.overrides[0].headers[0].value.valueFrom.secretKeyRef.name == $name' >/dev/null \
            || { echo "FAIL: q-owner does not keep the override"; exit 1; }

          R=$(call_api queries "$ADMIN" POST "" "$(query q-missing "\"overrides\":[$(override "u-$HASH-missing" mcpserver "$SELECTOR")]")")
          REJECTED=$(body_of "$R" | jq -r .detail)
          case "$REJECTED" in
            *"Personal secrets can only be referenced from MCP server header overrides"*) ;;
            *) echo "FAIL: unexpected rejection detail '$REJECTED'"; exit 1 ;;
          esac
          expect_rejected "POST query with a missing personal secret" "$R" query q-missing
          R=$(call_api queries "$VIEWER" PUT "/q-owner" '{"input":"changed by viewer"}')
          expect_status "PUT admin's query as viewer" "$R" 422
          [ "$(body_of "$R" | jq -r .detail)" = "$REJECTED" ] || { echo "FAIL: viewer PUT detail differs"; exit 1; }
          kubectl get query q-owner -n "$NAMESPACE" -o jsonpath='{.spec.input}' | grep -qx hi || { echo "FAIL: viewer changed q-owner"; exit 1; }
          expect_status "PUT own query as admin" "$(call_api queries "$ADMIN" PUT "/q-owner" '{"input":"changed by admin"}')" 200
          expect_status "DELETE q-owner" "$(call_api queries "$ADMIN" DELETE "/q-owner")" 204

          R=$(call_api queries "$VIEWER" POST "" "$(query q-viewer "\"overrides\":[$(override "$MCP" mcpserver "$SELECTOR")]")")
          expect_rejected "POST query with admin's personal secret as viewer" "$R" query q-viewer
          R=$(call_api queries "$ADMIN" POST "" "$(query q-empty "\"overrides\":[$(override "$MCP" mcpserver '{}')]")")
          expect_rejected "POST query with an empty labelSelector" "$R" query q-empty
          R=$(call_api queries "$ADMIN" POST "" "$(query q-team "\"overrides\":[$(override "$MCP" mcpserver '{"matchLabels":{"team":"a"}}')]")")
          expect_rejected "POST query selecting servers by another label" "$R" query q-team
          R=$(call_api queries "$ADMIN" POST "" "$(query q-extra "\"overrides\":[$(override "$MCP" mcpserver '{"matchLabels":{"ark.mckinsey.com/name":"github","team":"a"}}')]")")
          expect_rejected "POST query selecting by name and another label" "$R" query q-extra
          R=$(call_api queries "$ADMIN" POST "" "$(query q-expr "\"overrides\":[$(override "$MCP" mcpserver '{"matchExpressions":[{"key":"ark.mckinsey.com/name","operator":"Exists"}]}')]")")
          expect_rejected "POST query selecting with matchExpressions" "$R" query q-expr
          R=$(call_api queries "$ADMIN" POST "" "$(query q-model "\"overrides\":[$(override "$MCP" model "$SELECTOR")]")")
          expect_rejected "POST query with a model override" "$R" query q-model
          PARAMETERS=$(printf '"parameters":[{"name":"token","valueFrom":{"secretKeyRef":{"name":"%s","key":"token"}}}]' "$MCP")
          R=$(call_api queries "$ADMIN" POST "" "$(query q-param "$PARAMETERS")")
          expect_rejected "POST query with a personal secret in parameters" "$R" query q-param

          R=$(call_api models "$ADMIN" POST "" "$(model m-personal "$MCP")")
          expect_rejected "POST model with a personal secret as its owner" "$R" model m-personal
          R=$(call_api models "$VIEWER" POST "" "$(model m-promoted "$PROMOTED")")
          expect_status "POST model with the promoted secret as viewer" "$R" 200
          expect_status "DELETE m-promoted" "$(call_api models "$VIEWER" DELETE "/m-promoted")" 204
          expect_status "DELETE own personal mcp as admin" "$(call "$ADMIN" DELETE "/$MCP")" 200
        env:
        - name: NAMESPACE
          value: ($namespace)
    catch:
    - script:
        content: |
          kubectl -n $NAMESPACE get secrets --show-labels || true
          kubectl -n $NAMESPACE get queries,models || true
          kubectl -n $NAMESPACE logs -l app=ark-api --tail=100 || true
        env:
        - name: NAMESPACE
          value: ($namespace)

  - name: install-mock-llm
    try:
    - script:
        timeout: 180s
        content: |
          bash ../shared/install-mock-llm.sh
        env:
        - name: NAMESPACE
          value: ($namespace)
    - apply:
        file: manifests/a03-agent.yaml
    - wait:
        apiVersion: ark.mckinsey.com/v1alpha1
        kind: Model
        name: personal-mock-model
        timeout: 3m
        for:
          condition:
            name: ModelAvailable
            value: 'True'
    - assert:
        timeout: 2m
        resource:
          apiVersion: ark.mckinsey.com/v1alpha1
          kind: Tool
          metadata:
            name: mock-llm-mcp-echo-headers
    catch:
    - events: {}
    - script:
        content: |
          kubectl -n $NAMESPACE get models,mcpservers,tools,agents || true
        env:
        - name: NAMESPACE
          value: ($namespace)
    cleanup:
    - script:
        content: |
          helm uninstall mock-llm --namespace $NAMESPACE --wait --timeout=180s || true
        env:
        - name: NAMESPACE
          value: ($namespace)

  - name: resolution
    try:
    - script:
        timeout: 240s
        content: |
          set -eu
          . ./helpers.sh
          ADMIN=$(token admin@ark.local)
          VIEWER=$(token viewer@ark.local)
          HASH=$(owner_hash admin@ark.local)
          REBIND="u-$HASH-rebind"
          RUN="u-$HASH-mcp-run"
          MOCK="http://mock-llm.$NAMESPACE.svc.cluster.local:6556/v1"
          REFUSED="personal secrets can only be used in the headers of a Query mcpserver override"

          wait_phase() {
            kubectl wait query "$1" -n "$NAMESPACE" --for=jsonpath='{.status.phase}'="$2" --timeout=90s >/dev/null \
              || { echo "FAIL: query $1 did not reach phase $2"; kubectl get query "$1" -n "$NAMESPACE" -o yaml; exit 1; }
          }
          wait_content() {
            for _ in $(seq 1 45); do
              CONTENT=$(kubectl get query "$1" -n "$NAMESPACE" -o jsonpath='{.status.response.content}')
              [ -n "$CONTENT" ] && return 0
              sleep 2
            done
            echo "FAIL: query $1 has no response content"; kubectl get query "$1" -n "$NAMESPACE" -o yaml; exit 1
          }
          assert_no_leak() {
            for what in "query $1" "model m-rebind" "agent a-rebind" "events"; do
              # shellcheck disable=SC2086
              JSON=$(kubectl get $what -n "$NAMESPACE" -o json)
              [ -n "$JSON" ] || { echo "FAIL: could not read $what"; exit 1; }
              if printf '%s' "$JSON" | grep -q "$2"; then
                echo "FAIL: $what exposes the personal secret value"; exit 1
              fi
            done
          }

          R=$(call "$ADMIN" POST "" '{"name":"rebind","string_data":{"token":"admin-rebind-old"},"scope":"personal"}')
          expect_status "POST personal rebind as admin" "$R" 200
          expect_status "PUT rebind scope=shared as admin" "$(call "$ADMIN" PUT "/$REBIND" '{"scope":"shared"}')" 200
          MODEL=$(printf '{"name":"m-rebind","provider":"openai","model":"gpt-4.1-mini","config":{"openai":{"baseUrl":"%s","apiKey":{"valueFrom":{"secretKeyRef":{"name":"%s","key":"token"}}}}}}' "$MOCK" "$REBIND")
          expect_status "POST model with the promoted secret as viewer" "$(call_api models "$VIEWER" POST "" "$MODEL")" 200
          kubectl wait model m-rebind -n "$NAMESPACE" --for=condition=ModelAvailable --timeout=90s
          AGENT=$(printf '{"name":"a-rebind","prompt":"You are a test assistant.","modelRef":{"name":"personal-mock-model"},"tools":[{"type":"mcp","name":"mock-llm-mcp-echo-headers"}],"overrides":[{"resourceType":"mcpserver","labelSelector":{"matchLabels":{"ark.mckinsey.com/name":"mock-llm-mcp"}},"headers":[{"name":"X-Rebind-Token","value":{"valueFrom":{"secretKeyRef":{"name":"%s","key":"token"}}}}]}]}' "$REBIND")
          expect_status "POST agent with the promoted secret in an MCP override as viewer" "$(call_api agents "$VIEWER" POST "" "$AGENT")" 200

          expect_status "DELETE promoted rebind as admin" "$(call "$ADMIN" DELETE "/$REBIND")" 200
          R=$(call "$ADMIN" POST "" '{"name":"rebind","string_data":{"token":"admin-rebind-new"},"scope":"personal"}')
          expect_status "POST personal rebind again as admin" "$R" 200
          kubectl get secret "$REBIND" -n "$NAMESPACE" -o json \
            | jq -e --arg scope "user-$HASH" '.metadata.labels."ark.mckinsey.com/scope" == $scope' >/dev/null \
            || { echo "FAIL: $REBIND was not recreated as admin's personal secret"; exit 1; }

          R=$(call_api queries "$VIEWER" POST "" '{"name":"q-rebind","input":"hi","target":{"type":"model","name":"m-rebind"}}')
          expect_status "POST query against the rebound model as viewer" "$R" 200
          wait_phase q-rebind error
          kubectl get query q-rebind -n "$NAMESPACE" -o json | grep -q "$REFUSED" \
            || { echo "FAIL: q-rebind did not fail on the personal secret"; kubectl get query q-rebind -n "$NAMESPACE" -o yaml; exit 1; }
          assert_no_leak q-rebind admin-rebind-new

          R=$(call_api queries "$VIEWER" POST "" '{"name":"q-agent-rebind","input":"echo-headers","target":{"type":"agent","name":"a-rebind"}}')
          expect_status "POST query against the agent with the rebound override as viewer" "$R" 200
          wait_phase q-agent-rebind error
          kubectl get query q-agent-rebind -n "$NAMESPACE" -o json | grep -q "$REFUSED" \
            || { echo "FAIL: q-agent-rebind did not fail on the personal secret"; kubectl get query q-agent-rebind -n "$NAMESPACE" -o yaml; exit 1; }
          assert_no_leak q-agent-rebind admin-rebind-new

          R=$(call "$ADMIN" POST "" '{"name":"mcp-run","string_data":{"token":"admin-mcp-run-value"},"scope":"personal"}')
          expect_status "POST personal mcp-run as admin" "$R" 200
          QUERY=$(printf '{"name":"q-run","input":"echo-headers","target":{"type":"agent","name":"personal-agent"},"overrides":[{"resourceType":"mcpserver","labelSelector":{"matchLabels":{"ark.mckinsey.com/name":"mock-llm-mcp"}},"headers":[{"name":"X-Personal-Token","value":{"valueFrom":{"secretKeyRef":{"name":"%s","key":"token"}}}}]}]}' "$RUN")
          expect_status "POST query with own personal MCP override as admin" "$(call_api queries "$ADMIN" POST "" "$QUERY")" 200
          wait_content q-run
          printf '%s' "$CONTENT" | grep -i x-personal-token | grep -q admin-mcp-run-value \
            || { echo "FAIL: the MCP server did not receive the personal secret as X-Personal-Token"; kubectl get query q-run -n "$NAMESPACE" -o yaml; exit 1; }

          kubectl apply -n "$NAMESPACE" -f - >/dev/null <<EOF
          apiVersion: ark.mckinsey.com/v1alpha1
          kind: Query
          metadata:
            name: q-broad
          spec:
            input: echo-headers
            target:
              type: agent
              name: personal-agent
            overrides:
            - resourceType: mcpserver
              labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: mock-llm
              headers:
              - name: X-Personal-Token
                value:
                  valueFrom:
                    secretKeyRef:
                      name: $RUN
                      key: token
          EOF
          wait_phase q-broad error
          kubectl get query q-broad -n "$NAMESPACE" -o json | grep -q "personal secrets can only be sent to one MCP server" \
            || { echo "FAIL: q-broad did not fail on its selector"; kubectl get query q-broad -n "$NAMESPACE" -o yaml; exit 1; }
          assert_no_leak q-broad admin-mcp-run-value

          for q in q-rebind q-agent-rebind q-run q-broad; do
            expect_status "DELETE $q" "$(call_api queries "$ADMIN" DELETE "/$q")" 204
          done
          expect_status "DELETE m-rebind" "$(call_api models "$VIEWER" DELETE "/m-rebind")" 204
          expect_status "DELETE a-rebind" "$(call_api agents "$VIEWER" DELETE "/a-rebind")" 204
          expect_status "DELETE own personal rebind as admin" "$(call "$ADMIN" DELETE "/$REBIND")" 200
          expect_status "DELETE own personal mcp-run as admin" "$(call "$ADMIN" DELETE "/$RUN")" 200
        env:
        - name: NAMESPACE
          value: ($namespace)
    catch:
    - events: {}
    - script:
        content: |
          kubectl -n $NAMESPACE get secrets --show-labels || true
          kubectl -n $NAMESPACE get queries,models -o yaml || true
          kubectl -n $NAMESPACE logs -l app=ark-api --tail=100 || true
        env:
        - name: NAMESPACE
          value: ($namespace)

  - name: name-label
    try:
    - script:
        timeout: 240s
        content: |
          set -eu
          . ./helpers.sh
          ADMIN=$(token admin@ark.local)
          HASH=$(owner_hash admin@ark.local)
          TOKEN="u-$HASH-echo-api"
          SOURCE=$(kubectl get mcpserver mock-llm-mcp -n "$NAMESPACE" -o json)

          server() {
            printf '%s' "$SOURCE" | jq -c --arg name "$1" --arg ns "$NAMESPACE" --argjson labels "$2" \
              '{name: $name, namespace: $ns, labels: $labels, spec: {transport: .spec.transport, address: .spec.address}}'
          }
          labels_of() {
            kubectl get mcpserver "$1" -n "$NAMESPACE" -o json \
              | jq -cS '.metadata.labels // {} | with_entries(select(.key == "ark.mckinsey.com/name" or .key == "team"))'
          }
          expect_labels() {
            [ "$(labels_of "$1")" = "$2" ] || { echo "FAIL: $1 labels $(labels_of "$1"), expected $2"; exit 1; }
          }
          expect_selected() {
            SELECTED=$(kubectl get mcpservers -n "$NAMESPACE" -l "ark.mckinsey.com/name=$1" -o json | jq -c '[.items[].metadata.name] | sort')
            [ "$SELECTED" = "$2" ] || { echo "FAIL: ark.mckinsey.com/name=$1 selects $SELECTED, expected $2"; exit 1; }
          }

          expect_status "POST mcp server echo-api" "$(call_api mcp-servers "$ADMIN" POST "" "$(server echo-api '{"team":"e2e"}')")" 200
          expect_labels echo-api '{"ark.mckinsey.com/name":"echo-api","team":"e2e"}'
          expect_status "POST mcp server echo-spoof claiming mock-llm-mcp" \
            "$(call_api mcp-servers "$ADMIN" POST "" "$(server echo-spoof '{"ark.mckinsey.com/name":"mock-llm-mcp"}')")" 200
          expect_labels echo-spoof '{"ark.mckinsey.com/name":"echo-spoof"}'
          expect_selected mock-llm-mcp '["mock-llm-mcp"]'
          expect_selected echo-api '["echo-api"]'

          expect_status "PUT echo-api with labels that drop the name label" \
            "$(call_api mcp-servers "$ADMIN" PUT "/echo-api" '{"labels":{"team":"other"}}')" 200
          expect_labels echo-api '{"ark.mckinsey.com/name":"echo-api","team":"other"}'
          kubectl label mcpserver echo-api -n "$NAMESPACE" ark.mckinsey.com/name=mock-llm-mcp --overwrite >/dev/null
          expect_labels echo-api '{"ark.mckinsey.com/name":"echo-api","team":"other"}'
          expect_selected mock-llm-mcp '["mock-llm-mcp"]'
          expect_status "DELETE echo-spoof" "$(call_api mcp-servers "$ADMIN" DELETE "/echo-spoof")" 204

          printf '%s' "$SOURCE" | jq --arg ns "$NAMESPACE" \
            '{apiVersion, kind, metadata: {name: "echo-kubectl", namespace: $ns, labels: {"ark.mckinsey.com/name": "mock-llm-mcp", team: "e2e"}}, spec: {transport: .spec.transport, address: .spec.address}}' \
            | kubectl apply -f - >/dev/null
          expect_labels echo-kubectl '{"ark.mckinsey.com/name":"echo-kubectl","team":"e2e"}'
          printf '%s' "$SOURCE" | jq --arg ns "$NAMESPACE" \
            '{apiVersion, kind, metadata: {name: "echo-bare", namespace: $ns}, spec: {transport: .spec.transport, address: .spec.address}}' \
            | kubectl apply -f - >/dev/null
          expect_labels echo-bare '{"ark.mckinsey.com/name":"echo-bare"}'
          expect_selected mock-llm-mcp '["mock-llm-mcp"]'
          kubectl delete mcpserver echo-kubectl echo-bare -n "$NAMESPACE" >/dev/null

          printf '%s' "$SOURCE" | jq --arg ns "$NAMESPACE" \
            '{apiVersion, kind, metadata: {name: "echo-held", namespace: $ns, finalizers: ["e2e.ark.mckinsey.com/hold"]}, spec: {transport: .spec.transport, address: .spec.address}}' \
            | kubectl apply -f - >/dev/null
          kubectl delete mcpserver echo-held -n "$NAMESPACE" --wait=false >/dev/null
          kubectl label mcpserver echo-held -n "$NAMESPACE" ark.mckinsey.com/name=mock-llm-mcp --overwrite >/dev/null
          expect_labels echo-held '{"ark.mckinsey.com/name":"echo-held"}'
          expect_selected mock-llm-mcp '["mock-llm-mcp"]'
          kubectl patch mcpserver echo-held -n "$NAMESPACE" --type=merge -p '{"metadata":{"finalizers":null}}' >/dev/null

          for _ in $(seq 1 45); do
            kubectl get tool echo-api-echo-headers -n "$NAMESPACE" >/dev/null 2>&1 && break
            sleep 2
          done
          kubectl get tool echo-api-echo-headers -n "$NAMESPACE" >/dev/null \
            || { echo "FAIL: no tool discovered for echo-api"; kubectl get mcpserver echo-api -n "$NAMESPACE" -o yaml; exit 1; }
          AGENT='{"name":"a-echo-api","prompt":"You are a test assistant.","modelRef":{"name":"personal-mock-model"},"tools":[{"type":"mcp","name":"echo-api-echo-headers"}]}'
          expect_status "POST agent with the echo-api tool" "$(call_api agents "$ADMIN" POST "" "$AGENT")" 200

          R=$(call "$ADMIN" POST "" '{"name":"echo-api","string_data":{"token":"admin-echo-api-value"},"scope":"personal"}')
          expect_status "POST personal echo-api as admin" "$R" 200
          QUERY=$(printf '{"name":"q-echo-api","input":"echo-headers","target":{"type":"agent","name":"a-echo-api"},"overrides":[{"resourceType":"mcpserver","labelSelector":{"matchLabels":{"ark.mckinsey.com/name":"echo-api"}},"headers":[{"name":"X-Personal-Token","value":{"valueFrom":{"secretKeyRef":{"name":"%s","key":"token"}}}}]}]}' "$TOKEN")
          expect_status "POST query selecting echo-api by its name label" "$(call_api queries "$ADMIN" POST "" "$QUERY")" 200
          for _ in $(seq 1 45); do
            CONTENT=$(kubectl get query q-echo-api -n "$NAMESPACE" -o jsonpath='{.status.response.content}')
            [ -n "$CONTENT" ] && break
            [ "$(kubectl get query q-echo-api -n "$NAMESPACE" -o jsonpath='{.status.phase}')" = error ] && break
            sleep 2
          done
          printf '%s' "$CONTENT" | grep -i x-personal-token | grep -q admin-echo-api-value \
            || { echo "FAIL: echo-api did not receive the header selected by its name label"; kubectl get query q-echo-api -n "$NAMESPACE" -o yaml; exit 1; }

          expect_status "DELETE q-echo-api" "$(call_api queries "$ADMIN" DELETE "/q-echo-api")" 204
          expect_status "DELETE a-echo-api" "$(call_api agents "$ADMIN" DELETE "/a-echo-api")" 204
          expect_status "DELETE echo-api" "$(call_api mcp-servers "$ADMIN" DELETE "/echo-api")" 204
          expect_status "DELETE own personal echo-api as admin" "$(call "$ADMIN" DELETE "/$TOKEN")" 200
        env:
        - name: NAMESPACE
          value: ($namespace)
    catch:
    - events: {}
    - script:
        content: |
          kubectl -n $NAMESPACE get mcpservers,tools,agents --show-labels || true
          kubectl -n $NAMESPACE get queries -o yaml || true
          kubectl -n $NAMESPACE logs -l app=ark-api --tail=100 || true
        env:
        - name: NAMESPACE
          value: ($namespace)
    finally:
    - script:
        content: |
          kubectl -n $NAMESPACE delete query q-echo-api --ignore-not-found || true
          kubectl -n $NAMESPACE delete agent a-echo-api --ignore-not-found || true
          kubectl -n $NAMESPACE delete mcpserver echo-api echo-spoof --ignore-not-found || true
        env:
        - name: NAMESPACE
          value: ($namespace)
