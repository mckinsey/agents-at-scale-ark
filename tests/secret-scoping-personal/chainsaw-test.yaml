apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: secret-scoping-personal
  labels:
    requires-images: "true"
spec:
  description: >
    #2559 phase 2: personal secrets through a real ark-api in AUTH_MODE=sso
    with real identities from Dex. Checks that the API rejects requests
    without a valid token, that a personal secret is stored as
    u-<sha256(username)[:16]>-<name> with the owner's scope label, that only
    its owner can list, read, change or delete it while anyone else gets the
    same 404 as a missing secret, that promoting it to shared keeps the name
    and makes it visible to everyone, that a shared secret cannot be made
    personal, and that a personal secret can only be referenced from its
    owner's Query MCP header overrides with a labelSelector.
  timeouts:
    apply: 120s
    assert: 120s
    exec: 180s

  steps:
  - name: install-dex
    try:
    - script:
        timeout: 300s
        content: |
          helm upgrade --install dex ../../charts/ark-dex-dev \
            --namespace "$NAMESPACE" \
            --set issuer="http://dex.$NAMESPACE.svc.cluster.local:5556/dex" \
            --set oauth2.passwordConnector=local \
            --set rbac.create=false \
            --wait --timeout=240s
        env:
        - name: NAMESPACE
          value: ($namespace)
    catch:
    - script:
        content: |
          kubectl -n $NAMESPACE get pods -o wide
          kubectl -n $NAMESPACE logs -l app=dex --tail=100 || true
        env:
        - name: NAMESPACE
          value: ($namespace)
    cleanup:
    - script:
        content: |
          helm uninstall dex --namespace $NAMESPACE --wait --timeout=120s || true
        env:
        - name: NAMESPACE
          value: ($namespace)

  - name: install-ark-api
    try:
    - script:
        timeout: 240s
        content: |
          sed "s/__NAMESPACE__/$NAMESPACE/g" manifests/ark-api-values.yaml | \
          helm upgrade --install ark-api ../../services/ark-api/chart \
            --namespace "$NAMESPACE" \
            -f - \
            ${ARK_API_IMAGE:+--set app.image.repository=${ARK_API_IMAGE}} \
            ${ARK_API_IMAGE_TAG:+--set app.image.tag=${ARK_API_IMAGE_TAG}} \
            --wait --timeout=180s
        env:
        - name: NAMESPACE
          value: ($namespace)
    catch:
    - script:
        content: |
          kubectl -n $NAMESPACE get pods -o wide
          kubectl -n $NAMESPACE logs -l app=ark-api --tail=200 || true
        env:
        - name: NAMESPACE
          value: ($namespace)
    cleanup:
    - script:
        content: |
          helm uninstall ark-api --namespace $NAMESPACE --wait --timeout=120s || true
        env:
        - name: NAMESPACE
          value: ($namespace)

  - name: setup
    try:
    - apply:
        file: manifests/a01-shared-secret.yaml
    - apply:
        file: manifests/a02-model.yaml
    - apply:
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            name: personal-curl
          spec:
            containers:
              - name: curl
                image: curlimages/curl:8.11.1
                command: ["sleep", "900"]
            restartPolicy: Never
            terminationGracePeriodSeconds: 0
    - wait:
        apiVersion: v1
        kind: Pod
        name: personal-curl
        timeout: 120s
        for:
          condition:
            name: Ready
            value: 'True'

  - name: auth-gate
    try:
    - script:
        timeout: 90s
        content: |
          set -eu
          . ./helpers.sh
          ADMIN=$(token admin@ark.local)

          expect_status "GET without a token" "$(call "" GET "")" 401
          expect_status "GET with a forged token" "$(call "not-a-jwt" GET "")" 401
          R=$(call "$ADMIN" GET "")
          expect_status "GET as admin" "$R" 200
          [ "$(names "$R")" = '["ark-shared-token"]' ] || { echo "FAIL: unexpected list $(names "$R")"; exit 1; }
        env:
        - name: NAMESPACE
          value: ($namespace)
    catch:
    - script:
        content: |
          kubectl -n $NAMESPACE logs -l app=ark-api --tail=100 || true
        env:
        - name: NAMESPACE
          value: ($namespace)

  - name: personal-crud
    try:
    - script:
        timeout: 120s
        content: |
          set -eu
          . ./helpers.sh
          ADMIN=$(token admin@ark.local)
          VIEWER=$(token viewer@ark.local)
          HASH=$(owner_hash admin@ark.local)
          NAME="u-$HASH-github"

          R=$(call "$ADMIN" POST "" '{"name":"github","string_data":{"token":"admin-value"},"description":"GitHub token","scope":"personal"}')
          expect_status "POST personal as admin" "$R" 200
          body_of "$R" | jq -e --arg name "$NAME" '.name == $name and .display_name == "github" and .scope == "personal"' >/dev/null \
            || { echo "FAIL: unexpected create response"; body_of "$R"; exit 1; }
          kubectl get secret "$NAME" -n "$NAMESPACE" -o json \
            | jq -e --arg scope "user-$HASH" '.metadata.labels | ."ark.mckinsey.com/resource-type" == "secret" and ."ark.mckinsey.com/scope" == $scope' >/dev/null \
            || { echo "FAIL: $NAME does not carry the owner's scope label"; exit 1; }

          R=$(call "$ADMIN" GET "")
          [ "$(names "$R")" = '["ark-shared-token"]' ] || { echo "FAIL: default list is not shared only: $(names "$R")"; exit 1; }
          R=$(call "$ADMIN" GET "?scope=personal")
          [ "$(names "$R")" = "[\"$NAME\"]" ] || { echo "FAIL: admin personal list: $(names "$R")"; exit 1; }
          R=$(call "$ADMIN" GET "?scope=all")
          [ "$(names "$R")" = "[\"ark-shared-token\",\"$NAME\"]" ] || { echo "FAIL: admin all list: $(names "$R")"; exit 1; }
          expect_status "GET own personal as admin" "$(call "$ADMIN" GET "/$NAME")" 200

          R=$(call "$VIEWER" GET "?scope=all")
          [ "$(names "$R")" = '["ark-shared-token"]' ] || { echo "FAIL: viewer sees $(names "$R")"; exit 1; }
          R=$(call "$VIEWER" GET "?scope=personal")
          [ "$(names "$R")" = '[]' ] || { echo "FAIL: viewer personal list: $(names "$R")"; exit 1; }

          VIEWER_NAME="u-$(owner_hash viewer@ark.local)-github"
          [ "$VIEWER_NAME" != "$NAME" ] || { echo "FAIL: both users got the same personal name"; exit 1; }
          R=$(call "$VIEWER" POST "" '{"name":"github","string_data":{"token":"viewer-value"},"scope":"personal"}')
          expect_status "POST personal github as viewer" "$R" 200
          R=$(call "$VIEWER" GET "?scope=personal")
          [ "$(names "$R")" = "[\"$VIEWER_NAME\"]" ] || { echo "FAIL: viewer personal list: $(names "$R")"; exit 1; }
          R=$(call "$ADMIN" GET "?scope=personal")
          [ "$(names "$R")" = "[\"$NAME\"]" ] || { echo "FAIL: admin sees viewer's secret: $(names "$R")"; exit 1; }

          BEFORE=$(kubectl get secret "$NAME" -n "$NAMESPACE" -o json | jq -c '{data, labels: .metadata.labels}')
          [ -n "$BEFORE" ] || { echo "FAIL: could not read $NAME"; exit 1; }
          MISSING=$(body_of "$(call "$VIEWER" GET "/u-$HASH-missing")" | jq -r .detail | sed "s/u-$HASH-missing/NAME/")
          for METHOD in GET PUT DELETE; do
            case $METHOD in
              PUT) R=$(call "$VIEWER" PUT "/$NAME" '{"string_data":{"token":"stolen"},"scope":"shared"}') ;;
              *) R=$(call "$VIEWER" "$METHOD" "/$NAME") ;;
            esac
            expect_status "$METHOD admin's personal as viewer" "$R" 404
            DETAIL=$(body_of "$R" | jq -r .detail | sed "s/$NAME/NAME/")
            [ "$DETAIL" = "$MISSING" ] || { echo "FAIL: '$DETAIL' differs from a missing secret's '$MISSING'"; exit 1; }
          done
          AFTER=$(kubectl get secret "$NAME" -n "$NAMESPACE" -o json | jq -c '{data, labels: .metadata.labels}')
          [ "$BEFORE" = "$AFTER" ] || { echo "FAIL: viewer changed admin's personal secret"; exit 1; }
        env:
        - name: NAMESPACE
          value: ($namespace)
    catch:
    - script:
        content: |
          kubectl -n $NAMESPACE get secrets --show-labels || true
          kubectl -n $NAMESPACE logs -l app=ark-api --tail=100 || true
        env:
        - name: NAMESPACE
          value: ($namespace)

  - name: promotion
    try:
    - script:
        timeout: 120s
        content: |
          set -eu
          . ./helpers.sh
          ADMIN=$(token admin@ark.local)
          VIEWER=$(token viewer@ark.local)
          HASH=$(owner_hash admin@ark.local)
          NAME="u-$HASH-github"

          R=$(call "$ADMIN" PUT "/$NAME" '{"scope":"shared","description":"GitHub token"}')
          expect_status "PUT scope=shared as admin" "$R" 200
          body_of "$R" | jq -e --arg name "$NAME" '.name == $name and .display_name == "github" and .scope == "shared" and .description == "GitHub token"' >/dev/null \
            || { echo "FAIL: unexpected promote response"; body_of "$R"; exit 1; }
          kubectl get secret "$NAME" -n "$NAMESPACE" -o json \
            | jq -e '.metadata.labels."ark.mckinsey.com/scope" == "shared" and (.data.token | @base64d) == "admin-value"' >/dev/null \
            || { echo "FAIL: promotion did not flip the label or lost the value"; exit 1; }

          R=$(call "$VIEWER" GET "")
          [ "$(names "$R")" = "[\"ark-shared-token\",\"$NAME\"]" ] || { echo "FAIL: viewer does not see the promoted secret: $(names "$R")"; exit 1; }
          expect_status "GET promoted as viewer" "$(call "$VIEWER" GET "/$NAME")" 200

          R=$(call "$ADMIN" POST "" '{"name":"github","string_data":{"token":"again"},"scope":"personal"}')
          expect_status "POST personal github again after promotion" "$R" 409

          VIEWER_NAME="u-$(owner_hash viewer@ark.local)-github"
          expect_status "DELETE own personal as viewer" "$(call "$VIEWER" DELETE "/$VIEWER_NAME")" 200
          ! kubectl get secret "$VIEWER_NAME" -n "$NAMESPACE" 2>/dev/null || { echo "FAIL: $VIEWER_NAME was not deleted"; exit 1; }

          R=$(call "$ADMIN" PUT "/ark-shared-token" '{"scope":"personal"}')
          expect_status "PUT scope=personal on a shared secret" "$R" 422
          kubectl get secret ark-shared-token -n "$NAMESPACE" -o json \
            | jq -e '.metadata.labels."ark.mckinsey.com/scope" == "shared"' >/dev/null \
            || { echo "FAIL: ark-shared-token is no longer shared"; exit 1; }
        env:
        - name: NAMESPACE
          value: ($namespace)
    catch:
    - script:
        content: |
          kubectl -n $NAMESPACE get secrets --show-labels || true
          kubectl -n $NAMESPACE logs -l app=ark-api --tail=100 || true
        env:
        - name: NAMESPACE
          value: ($namespace)

  - name: enforcement
    try:
    - script:
        timeout: 150s
        content: |
          set -eu
          . ./helpers.sh
          ADMIN=$(token admin@ark.local)
          VIEWER=$(token viewer@ark.local)
          HASH=$(owner_hash admin@ark.local)
          MCP="u-$HASH-mcp"
          PROMOTED="u-$HASH-github"
          SELECTOR='{"matchLabels":{"ark.mckinsey.com/name":"github"}}'

          override() {
            printf '{"resourceType":"%s","labelSelector":%s,"headers":[{"name":"Authorization","value":{"valueFrom":{"secretKeyRef":{"name":"%s","key":"token"}}}}]}' "$2" "$3" "$1"
          }
          query() {
            printf '{"name":"%s","input":"hi","target":{"type":"model","name":"personal-model"},%s}' "$1" "$2"
          }
          model() {
            printf '{"name":"%s","provider":"openai","model":"gpt-4o-mini","config":{"openai":{"baseUrl":"https://model.invalid/v1","apiKey":{"valueFrom":{"secretKeyRef":{"name":"%s","key":"token"}}}}}}' "$1" "$2"
          }
          expect_rejected() {
            expect_status "$1" "$2" 422
            DETAIL=$(body_of "$2" | jq -r .detail)
            [ "$DETAIL" = "$REJECTED" ] || { echo "FAIL: '$DETAIL' differs from '$REJECTED'"; exit 1; }
            assert_absent "$3" "$4"
          }
          assert_absent() {
            kubectl get "$1" "$2" -n "$NAMESPACE" 2>&1 | grep -q NotFound || { echo "FAIL: $1/$2 exists or could not be checked"; exit 1; }
          }

          R=$(call "$ADMIN" POST "" '{"name":"mcp","string_data":{"token":"admin-mcp-value"},"scope":"personal"}')
          expect_status "POST personal mcp as admin" "$R" 200

          R=$(call_api queries "$ADMIN" POST "" "$(query q-owner "\"overrides\":[$(override "$MCP" mcpserver "$SELECTOR")]")")
          expect_status "POST query with own personal MCP override as admin" "$R" 200
          kubectl get query q-owner -n "$NAMESPACE" -o json \
            | jq -e --arg name "$MCP" '.spec.overrides[0].headers[0].value.valueFrom.secretKeyRef.name == $name' >/dev/null \
            || { echo "FAIL: q-owner does not keep the override"; exit 1; }

          R=$(call_api queries "$ADMIN" POST "" "$(query q-missing "\"overrides\":[$(override "u-$HASH-missing" mcpserver "$SELECTOR")]")")
          REJECTED=$(body_of "$R" | jq -r .detail)
          case "$REJECTED" in
            *"Personal secrets can only be referenced from MCP server header overrides"*) ;;
            *) echo "FAIL: unexpected rejection detail '$REJECTED'"; exit 1 ;;
          esac
          expect_rejected "POST query with a missing personal secret" "$R" query q-missing
          R=$(call_api queries "$VIEWER" PUT "/q-owner" '{"input":"changed by viewer"}')
          expect_status "PUT admin's query as viewer" "$R" 422
          [ "$(body_of "$R" | jq -r .detail)" = "$REJECTED" ] || { echo "FAIL: viewer PUT detail differs"; exit 1; }
          kubectl get query q-owner -n "$NAMESPACE" -o jsonpath='{.spec.input}' | grep -qx hi || { echo "FAIL: viewer changed q-owner"; exit 1; }
          expect_status "PUT own query as admin" "$(call_api queries "$ADMIN" PUT "/q-owner" '{"input":"changed by admin"}')" 200
          expect_status "DELETE q-owner" "$(call_api queries "$ADMIN" DELETE "/q-owner")" 204

          R=$(call_api queries "$VIEWER" POST "" "$(query q-viewer "\"overrides\":[$(override "$MCP" mcpserver "$SELECTOR")]")")
          expect_rejected "POST query with admin's personal secret as viewer" "$R" query q-viewer
          R=$(call_api queries "$ADMIN" POST "" "$(query q-empty "\"overrides\":[$(override "$MCP" mcpserver '{}')]")")
          expect_rejected "POST query with an empty labelSelector" "$R" query q-empty
          R=$(call_api queries "$ADMIN" POST "" "$(query q-model "\"overrides\":[$(override "$MCP" model "$SELECTOR")]")")
          expect_rejected "POST query with a model override" "$R" query q-model
          PARAMETERS=$(printf '"parameters":[{"name":"token","valueFrom":{"secretKeyRef":{"name":"%s","key":"token"}}}]' "$MCP")
          R=$(call_api queries "$ADMIN" POST "" "$(query q-param "$PARAMETERS")")
          expect_rejected "POST query with a personal secret in parameters" "$R" query q-param

          R=$(call_api models "$ADMIN" POST "" "$(model m-personal "$MCP")")
          expect_rejected "POST model with a personal secret as its owner" "$R" model m-personal
          R=$(call_api models "$VIEWER" POST "" "$(model m-promoted "$PROMOTED")")
          expect_status "POST model with the promoted secret as viewer" "$R" 200
          expect_status "DELETE m-promoted" "$(call_api models "$VIEWER" DELETE "/m-promoted")" 204
          expect_status "DELETE own personal mcp as admin" "$(call "$ADMIN" DELETE "/$MCP")" 200
        env:
        - name: NAMESPACE
          value: ($namespace)
    catch:
    - script:
        content: |
          kubectl -n $NAMESPACE get secrets --show-labels || true
          kubectl -n $NAMESPACE get queries,models || true
          kubectl -n $NAMESPACE logs -l app=ark-api --tail=100 || true
        env:
        - name: NAMESPACE
          value: ($namespace)
