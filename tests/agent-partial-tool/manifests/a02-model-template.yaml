# Model configuration for partial tool test
# NOTE: baseUrl must use FQDN because model controller runs in ark-system namespace
# ${NAMESPACE} is substituted by chainsaw-test.yaml with envsubst
apiVersion: ark.mckinsey.com/v1alpha1
kind: Model
metadata:
  name: test-model
spec:
  type: openai
  model:
    value: gpt-4o-mini
  pollInterval: 3s
  config:
    openai:
      baseUrl:
        value: http://mock-openai.${NAMESPACE}.svc.cluster.local/v1
      apiKey:
        value: mock-api-key
