# Mock OpenAI server using mock-llm (https://github.com/dwmkerr/mock-llm)
apiVersion: v1
kind: Service
metadata:
  name: mock-openai
spec:
  selector:
    app: mock-openai
  ports:
  - port: 80
    targetPort: 6556
---
apiVersion: v1
kind: Pod
metadata:
  name: mock-openai
  labels:
    app: mock-openai
spec:
  terminationGracePeriodSeconds: 1
  automountServiceAccountToken: false
  containers:
  - name: mock-llm
    image: ghcr.io/dwmkerr/mock-llm:0.1.22
    ports:
    - containerPort: 6556
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
        ephemeral-storage: "128Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"
    readinessProbe:
      httpGet:
        path: /health
        port: 6556
      initialDelaySeconds: 2
      periodSeconds: 5
