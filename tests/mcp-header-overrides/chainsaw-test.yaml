apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: mcp-header-overrides
spec:
  description: MCP server receives server default, agent and query header overrides with the right precedence
  timeouts:
    exec: 300s
  steps:
  - name: deploy-mock-llm-and-mcpserver
    try:
    - script:
        timeout: 180s
        content: |
          bash ../shared/install-mock-llm.sh
        env:
        - name: NAMESPACE
          value: ($namespace)
    - apply:
        file: manifests/a01-mcpserver.yaml

  - name: wait-for-model-and-tool
    try:
    - wait:
        apiVersion: ark.mckinsey.com/v1alpha1
        kind: Model
        name: test-model-mock
        timeout: 3m
        for:
          condition:
            name: ModelAvailable
            value: 'True'
    - assert:
        timeout: 2m
        resource:
          apiVersion: ark.mckinsey.com/v1alpha1
          kind: MCPServer
          metadata:
            name: header-overrides-mcp
            labels:
              mcp/server: header-overrides-mcp
          status:
            (toolCount > `0`): true
    - assert:
        resource:
          apiVersion: ark.mckinsey.com/v1alpha1
          kind: Tool
          metadata:
            name: header-overrides-mcp-echo-headers

  - name: run-query
    try:
    - apply:
        file: manifests/a02-agent.yaml
    - apply:
        file: manifests/a03-query.yaml
    - wait:
        apiVersion: ark.mckinsey.com/v1alpha1
        kind: Query
        name: header-overrides-query
        timeout: 60s
        for:
          jsonPath:
            path: '{.status.response.content}'
    catch:
    - events: {}
    - describe:
        apiVersion: ark.mckinsey.com/v1alpha1
        kind: Query
        name: header-overrides-query

  - name: validate-mcp-headers
    try:
    - script:
        env:
        - name: NAMESPACE
          value: ($namespace)
        content: |
          RESPONSE=$(kubectl -n $NAMESPACE get query header-overrides-query -o jsonpath='{.status.response.content}')

          echo "=== Query Response Content ==="
          echo "$RESPONSE"
          echo "=========================="

          for value in server-default-value agent-scoped-value agent-unscoped-value query-only-value; do
            if echo "$RESPONSE" | grep -q "$value"; then
              echo "✓ MCP server received $value"
            else
              echo "✗ MCP server did not receive $value"
              exit 1
            fi
          done

          for value in server-agent-value server-all-value server-query-value agent-query-value; do
            if echo "$RESPONSE" | grep -q "$value"; then
              echo "✗ MCP server received overridden value $value"
              exit 1
            else
              echo "✓ $value was overridden"
            fi
          done

          echo ""
          echo "✅ Server default, agent and query MCP headers verified"
    catch:
    - events: {}
    - describe:
        apiVersion: ark.mckinsey.com/v1alpha1
        kind: Query
        name: header-overrides-query

    cleanup:
    - script:
        content: |
          helm uninstall mock-llm --namespace $NAMESPACE --wait --timeout=180s || true
        env:
        - name: NAMESPACE
          value: ($namespace)
