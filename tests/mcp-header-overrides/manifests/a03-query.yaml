apiVersion: ark.mckinsey.com/v1alpha1
kind: Query
metadata:
  name: header-overrides-query
spec:
  input: echo-headers
  target:
    type: agent
    name: header-overrides-agent
  overrides:
  - resourceType: mcpserver
    labelSelector:
      matchLabels:
        mcp/server: header-overrides-mcp
    headers:
    - name: X-Query-Override
      value:
        value: query-only-value
