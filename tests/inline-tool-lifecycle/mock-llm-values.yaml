config:
  rules:
  - path: "/v1/models"
    method: "GET"
    response:
      status: 200
      content: |
        {
          "object": "list",
          "data": [
            {
              "id": "gpt-4.1-mini",
              "object": "model",
              "owned_by": "openai"
            }
          ]
        }

  # Single rule: mock-llm's SSE streaming path (streaming.js's
  # streamResponse) always reads choices[0].message.content before chunking
  # it, so a tool_calls-only message (no content field) crashes with a 500
  # once the client requests streaming. The completions executor only takes
  # that path when the query's namespace has ark-config-streaming enabled,
  # which this test's pinned "default" namespace does, so a tool_calls
  # round-trip can't be scripted here even with content: "" (the SSE delta
  # then drops tool_calls entirely). Answer directly instead; see the test
  # README for what this does and doesn't prove.
  - path: "/v1/chat/completions"
    response:
      status: 200
      content: '{"choices":[{"message":{"role":"assistant","content":"done"},"finish_reason":"stop"}],"usage":{"prompt_tokens":1,"completion_tokens":1,"total_tokens":2}}'
