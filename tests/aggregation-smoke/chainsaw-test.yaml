apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: aggregation-smoke
  labels:
    postgresql: "true"
spec:
  steps:
    - name: api-discovery
      try:
      - script:
          content: |
            set -eu
            echo "Checking ark.mckinsey.com/v1alpha1 API resources..."
            RESOURCES=$(kubectl api-resources --api-group=ark.mckinsey.com -o name)
            for kind in agents models queries teams; do
              if echo "$RESOURCES" | grep -q "^${kind}\."; then
                echo "OK ${kind} discovered"
              else
                echo "FAIL ${kind} not found in API discovery"
                exit 1
              fi
            done
          timeout: 30s

    - name: storage-round-trip
      try:
      - script:
          content: |
            set -eu
            cat <<'MANIFEST' | kubectl apply -n $NAMESPACE -f -
            apiVersion: ark.mckinsey.com/v1alpha1
            kind: Model
            metadata:
              name: smoke-test-model
            spec:
              provider: openai
              model:
                value: smoke-test
              config:
                openai:
                  baseUrl:
                    value: https://localhost:9999/v1
                  apiKey:
                    value: smoke-test-key
            MANIFEST
            echo "OK Model created"

            MODEL=$(kubectl get model smoke-test-model -n $NAMESPACE -o jsonpath='{.metadata.name}')
            if [ "$MODEL" != "smoke-test-model" ]; then
              echo "FAIL Model read-back failed: got '$MODEL'"
              exit 1
            fi
            echo "OK Model read-back succeeded"
          env:
          - name: NAMESPACE
            value: ($namespace)
          timeout: 30s

    - name: watch-routing
      try:
      - script:
          content: |
            set -eu

            WATCH_OUT=$(mktemp)
            kubectl get models -n $NAMESPACE --watch -o name > "$WATCH_OUT" 2>&1 &
            WATCH_PID=$!
            trap 'kill $WATCH_PID 2>/dev/null || true; wait $WATCH_PID 2>/dev/null || true; rm -f "$WATCH_OUT"' EXIT

            await_watch_line() {
              name=$1
              what=$2
              i=0
              while :; do
                if grep -q "/${name}$" "$WATCH_OUT"; then
                  echo "OK ${what}"
                  return 0
                fi
                i=$((i + 1))
                [ "$i" -ge 50 ] && break
                sleep 0.2
              done
              echo "FAIL ${what}"
              echo "watch output so far:"
              cat "$WATCH_OUT"
              return 1
            }

            await_watch_line smoke-test-model "watch established (initial list delivered)"

            cat <<'MANIFEST' | kubectl apply -n $NAMESPACE -f -
            apiVersion: ark.mckinsey.com/v1alpha1
            kind: Model
            metadata:
              name: smoke-test-watch
            spec:
              provider: openai
              model:
                value: watch-test
              config:
                openai:
                  baseUrl:
                    value: https://localhost:9999/v1
                  apiKey:
                    value: smoke-test-key
            MANIFEST

            await_watch_line smoke-test-watch "watch delivered the create event"
            echo "OK Watch routing operational"
          env:
          - name: NAMESPACE
            value: ($namespace)
          timeout: 60s
