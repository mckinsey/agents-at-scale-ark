# Model the sandboxed agent calls. The runner's provider-agnostic client reads this via the
# resolved ExecutionEngineRequest (type=provider, config.<provider>.{baseUrl,apiKey}).
#
#   export OPENAI_GATEWAY_TOKEN="<jwt>"
#   envsubst < samples/model.yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: openai-gateway-key
type: Opaque
stringData:
  token: ${OPENAI_GATEWAY_TOKEN}
---
apiVersion: ark.mckinsey.com/v1alpha1
kind: Model
metadata:
  name: substrate-model
spec:
  provider: openai
  model:
    value: gpt-5-nano-2025-08-07
  config:
    openai:
      baseUrl:
        value: "https://openai.prod.ai-gateway.quantumblack.com/b894067e-6530-4890-aa17-e4d5a999acf4/v1"
      apiKey:
        valueFrom:
          secretKeyRef:
            name: openai-gateway-key
            key: token
