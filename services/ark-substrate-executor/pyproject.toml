[project]
name = "ark-substrate-executor"
version = "0.1.0"
description = "Ark ExecutionEngine backed by Agent Substrate: runs agents as sandboxed actors."
requires-python = ">=3.11"
dependencies = [
    "ark-sdk",
    "fastapi",
    "uvicorn",
    "grpcio",
]

[project.optional-dependencies]
# Only needed to regenerate the ateapi stubs (scripts/gen_ateapi.sh), not at runtime.
codegen = ["grpcio-tools"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ark_substrate_executor"]
