app:
  image:
    repository: workspace-service
    tag: latest
    pullPolicy: IfNotPresent
  port: 8090
  basePath: /workspaces
  orphanGracePeriod: 1h

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

storage:
  size: 10Gi
  storageClass: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
