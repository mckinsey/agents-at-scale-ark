# DevSpace configuration for ark-api service
version: v2beta1

vars:
  ARK_API_CALLBACK_PORT:
    source: env
    default: "34780"
  ENABLE_SSO:
    source: env
    default: false
  # Must match the values of the same name in the root devspace.yaml.
  SSO_DEX_HOST:
    source: env
    default: "dex.default.svc.cluster.local"
  SSO_DEX_PORT:
    source: env
    default: "5556"

images:
  ark-api:
    image: ark-api
    dockerfile: Dockerfile
    context: .
  ark-api-dev:
    image: ark-api-dev
    dockerfile: Dockerfile.dev
    context: .
    buildKit: {}

dependencies:
  ark-sdk:
    path: ../../lib/ark-sdk

pipelines:
  deploy: |-
    run_dependency_pipelines --all --pipeline=deploy
    ./sync-ark-sdk.sh
    build_images --all
    create_deployments --all
  dev: |-
    run_dependency_pipelines --all --pipeline=dev
    ./sync-ark-sdk.sh
    build_images ark-api-dev
    create_deployments --all
    start_dev --all

deployments:
  ark-api:
    namespace: default
    helm:
      chart:
        path: ./chart
      values:
        app:
          image:
            repository: ${runtime.images.ark-api.image}
            tag: ${runtime.images.ark-api.tag}
          # Override resources for local development
          resources:
            limits:
              memory: "1024Mi"
              cpu: "1000m"
            requests:
              memory: "256Mi"
              cpu: "200m"
          # Override security context for dev mode to allow DevSpace sync
          podSecurityContext:
            runAsNonRoot: false
            runAsUser: 0
            fsGroup: 0
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
            capabilities:
              add:
                - SETUID
                - SETGID
                - CHOWN
                - FOWNER
                - DAC_OVERRIDE
        httpRoute:
          enabled: true

profiles:
  - name: sso
    activation:
      - vars:
          ENABLE_SSO: true
    patches:
      # Helm replaces list values rather than merging them, so app.env has to
      # restate the chart defaults it is not changing. Dropping them would
      # silently disable the MCP auth endpoints and misreport the A2A agent card
      # URLs, making SSO mode differ from open mode in ways unrelated to auth.
      - op: add
        path: deployments.ark-api.helm.values.app.env
        value:
          - name: CORS_ORIGINS
            value: "*"
          - name: AUTH_MODE
            value: "sso"
          - name: OIDC_ISSUER_URL
            value: "http://${SSO_DEX_HOST}:${SSO_DEX_PORT}/dex"
          # Dex sets the token's `aud` to the client id, so this is the Dex
          # staticClient id from charts/ark-dex-dev.
          - name: OIDC_APPLICATION_ID
            value: "ark-dashboard"
          # Set explicitly to skip OIDC discovery: the token validator is built
          # while the auth middleware is constructed, and discovery failure there
          # crash-loops the pod if Dex is not up yet. With the URL known up front
          # no request is made until the first token arrives.
          - name: OIDC_JWKS_URL
            value: "http://${SSO_DEX_HOST}:${SSO_DEX_PORT}/dex/keys"
          - name: PROXY_TIMEOUT
            value: "10.0"
          - name: ARK_A2A_AGENT_CARD_PORT
            value: "8000"
          - name: ARK_A2A_AGENT_CARD_HOST
            value: "ark-api.127.0.0.1.nip.io"
          - name: ARK_A2A_AGENT_CARD_PROTOCOL
            value: "http"
          - name: READ_ONLY_MODE
            value: "false"
          - name: ARK_API_PUBLIC_CALLBACK_URL
            value: "http://127.0.0.1:${ARK_API_CALLBACK_PORT}/v1/mcp/auth/callback"
          - name: ARK_API_DASHBOARD_URL
            value: "http://dashboard.default.127.0.0.1.nip.io:8080"
      # Apply RBAC to the logged-in user instead of ark-api-sa. Also grants the
      # service account the cluster-scoped impersonate verb it needs to do so.
      # Dex static passwords carry no groups claim, so groupsClaim resolves to an
      # empty list and the bindings in charts/ark-dex-dev match on username.
      - op: add
        path: deployments.ark-api.helm.values.impersonation
        value:
          enabled: true
          fallback: false
          usernameClaim: email
          groupsClaim: groups
          prefix: ""

dev:
  ark-api:
    imageSelector: ark-api
    devImage: ${runtime.images.ark-api-dev.image}:${runtime.images.ark-api-dev.tag}
    command:
      [
        "sh",
        "-c",
        "cd /app/ark-api && uv sync --frozen && uv run uvicorn ark_api.main:app --host 0.0.0.0 --port 8000 --reload",
      ]
    namespace: default
    # Forward the OAuth callback loopback port so dashboard-driven MCP auth
    # reaches ark-api without a manual port-forward. Matches the loopback
    # literal in ARK_API_PUBLIC_CALLBACK_URL, which strict IdPs accept.
    ports:
      - port: ${ARK_API_CALLBACK_PORT}:8000
    # Stream logs instead of terminal
    logs:
      lastLines: 50
    # File synchronization for hot reload
    sync:
      - path: .:/app
        startContainer: true
        disableDownload: true
        uploadExcludeFile: .dockerignore
      - path: ./out:/app/ark-api/out/
        startContainer: true
        disableDownload: true
        onUpload:
          restartContainer: true
      - path: ../../ark:/workspace
        excludePaths:
          - bin/
          - out/
          - .git/
    # Enable SSH for IDE integration
    ssh:
      enabled: true

