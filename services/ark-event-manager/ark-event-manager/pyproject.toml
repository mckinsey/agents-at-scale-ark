[project]
name = "ark-event-manager"
version = "0.1.0"
description = "Ark Event Manager - event collection and streaming system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.123.0",
    "uvicorn>=0.38.0",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "python-multipart>=0.0.20",
    "sqlmodel>=0.0.27",
    "sqlalchemy[asyncio]>=2.0.44",
    "aiosqlite>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=0.24.0",
    "black>=24.0.0",
    "ruff>=0.6.0",
]

[tool.uv]
package = true

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
]
markers = [
    "asyncio: marks tests as async (pytest-asyncio)",
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
    "slow: marks tests that take a long time to run",
]
asyncio_mode = "auto"

