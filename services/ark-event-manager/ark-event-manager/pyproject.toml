[project]
name = "ark-event-manager"
version = "0.1.0"
description = "Ark Event Manager - event collection and streaming system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.122.0",
    "uvicorn>=0.38.0",
    "httpx>=0.28.1",
    "protobuf>=6.33.1",
    "pydantic>=2.12.5",
    "python-multipart>=0.0.20",
    "sqlmodel>=0.0.27",
    "sqlalchemy[asyncio]>=2.0.44",
    "aiosqlite>=0.21.0",
    "protobuf-to-pydantic>=0.3.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=0.24.0",
    "black>=24.0.0",
    "ruff>=0.6.0",
    "grpcio-tools>=1.60.0",
]

[tool.uv]
package = true

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

