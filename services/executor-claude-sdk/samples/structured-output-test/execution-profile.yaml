apiVersion: ark.mckinsey.com/v1prealpha1
kind: ExecutionProfile
metadata:
  name: structured-output-test-profile
  labels:
    sample: "true"
spec:
  workspace:
    type: none
  
  execution:
    maxIterations: 5
    timeout: "2m"
  
  sdkConfig:
    claude:
      allowedTools: []
      permissionMode: acceptEdits
      
      # Simple structured output schema
      outputFormat:
        type: json_schema
        schema:
          type: object
          properties:
            answer:
              type: string
              description: "The answer to the question"
            confidence:
              type: number
              minimum: 0
              maximum: 1
              description: "Confidence score (0-1)"
          required: ["answer", "confidence"]

  postExecute:
    - name: log-result
      action: log
      params:
        message: "Answer: {{.StructuredOutput.answer}}, Confidence: {{.StructuredOutput.confidence}}"
