# Feature Development Execution Profile
# Full workflow: clone → branch → develop → validate → commit → push → PR
apiVersion: ark.mckinsey.com/v1prealpha1
kind: ExecutionProfile
metadata:
  name: feature-dev-profile
  labels:
    sample: "true"
spec:
  # Workspace: Clone the repository
  workspace:
    type: git
    git:
      defaultBranch: main
      branchPrefix: "agent/feature/"
      commitMessageTemplate: "feat({{.FeatureName}}): {{.CommitSummary}}"
      targetPath: "{{.TargetPath}}"

  # Pre-execute: Set up the workspace
  preExecute:
    - name: clone-repo
      action: git_clone
      params:
        url: "{{.RepoUrl}}"
        branch: main
        depth: "1"  # Shallow clone for speed
    
    - name: create-branch
      action: git_create_branch
      params:
        nameTemplate: "{{.FeatureName}}-{{.QueryID | truncate 8}}"

  # Execution constraints
  execution:
    maxIterations: 25
    timeout: "30m"
    maxBudgetUsd: "5.00"

  # Inline critic: Agent validates its own work
  critic:
    enabled: true
    mode: inline
    maxRetries: 2
    inline:
      prompt: |
        Review the implementation you just completed.
        
        Check for:
        1. **Completeness**: Does it fulfill all requirements from the feature description?
        2. **Code Quality**: Is the code clean, readable, and following project conventions?
        3. **Errors**: Are there any syntax errors or obvious bugs?
        4. **Integration**: Does it integrate properly with existing code?
        
        If everything looks good, respond with APPROVED.
        If there are issues, respond with NEEDS_REVISION and list the specific problems.
      
      passCondition: "{{.CriticApproved}}"

  # SDK-specific configuration for Claude
  sdkConfig:
    claude:
      # Full development tools (Skill enables .claude/skills/ from cloned repos)
      allowedTools:
        - Read
        - Edit
        - Write
        - Bash
        - Glob
        - Grep
        - Skill
      
      # Auto-accept file edits
      permissionMode: acceptEdits
      
      # Load CLAUDE.md and Skills from repo
      settingSources:
        - project
      
      # Critic configuration
      critic:
        passPattern: "APPROVED"
      
      # Structured output for reliable parsing
      outputFormat:
        type: json_schema
        schema:
          type: object
          properties:
            summary:
              type: string
              description: "Brief overview of the implementation"
            files_created:
              type: array
              items:
                type: string
              description: "List of new files created"
            files_modified:
              type: array
              items:
                type: string
              description: "List of existing files modified"
            changes:
              type: array
              items:
                type: object
                properties:
                  file:
                    type: string
                    description: "File path"
                  category:
                    type: string
                    enum: ["feature", "test", "documentation", "refactor"]
                    description: "Type of change"
                  description:
                    type: string
                    description: "What was changed"
                required: ["file", "category", "description"]
              description: "Detailed list of changes made"
            tests_added:
              type: boolean
              description: "Whether tests were added for the feature"
            limitations:
              type: array
              items:
                type: string
              description: "Known limitations or future improvements"
          required: ["summary", "files_created", "files_modified", "changes", "tests_added"]

  # Post-execute: Commit and create PR
  postExecute:
    - name: commit-changes
      action: git_commit
      condition: "{{.HasChanges}}"
      params:
        messageTemplate: |
          feat({{.FeatureName}}): implement feature
          
          {{.StructuredOutput.summary | truncate 500}}
    
    - name: push-branch
      action: git_push
      condition: "{{.HasChanges}}"
    
    - name: create-pr
      action: pr_create
      condition: "{{.HasChanges}}"
      params:
        titleTemplate: "feat({{.FeatureName}}): {{.FeatureDescription | truncate 50}}"
        bodyTemplate: |
          ## Summary
          
          {{.StructuredOutput.summary}}
          
          ## Files Created
          
          {{range .StructuredOutput.files_created}}- `{{.}}`
          {{end}}
          {{if not .StructuredOutput.files_created}}None
          {{end}}
          
          ## Files Modified
          
          {{range .StructuredOutput.files_modified}}- `{{.}}`
          {{end}}
          {{if not .StructuredOutput.files_modified}}None
          {{end}}
          
          ## Changes
          
          {{range .StructuredOutput.changes}}### {{.category}}: `{{.file}}`
          
          {{.description}}
          
          {{end}}
          
          ## Tests
          
          {{if .StructuredOutput.tests_added}}✅ Tests added{{else}}⚠️ No tests added{{end}}
          
          {{if .StructuredOutput.limitations}}## Known Limitations
          
          {{range .StructuredOutput.limitations}}- {{.}}
          {{end}}
          {{end}}
          
          ---
          *Generated by Ark Feature Developer*
        labels: "ai-generated,feature"

  # On failure: Create issue for manual follow-up
  onFailure:
    - name: log-failure
      action: log
      params:
        message: "Feature development failed: {{.Error}}"
    
    - name: create-issue
      action: issue_create
      condition: "{{.HasChanges}}"
      params:
        titleTemplate: "Feature development failed: {{.FeatureName}}"
        bodyTemplate: |
          ⚠️ **Automated feature development failed**
          
          **Feature:** {{.FeatureName}}
          
          **Description:** {{.FeatureDescription}}
          
          **Error:** {{.Error}}
          
          **Branch:** `{{.BranchName}}`
          
          The agent made partial progress. Please review the branch and complete manually.
        labels: "ai-failed,needs-attention"