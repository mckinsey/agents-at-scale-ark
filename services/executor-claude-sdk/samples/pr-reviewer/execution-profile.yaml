# PR Review Execution Profile
# Clones repo, checks out PR branch, and submits review
apiVersion: ark.mckinsey.com/v1prealpha1
kind: ExecutionProfile
metadata:
  name: pr-review-profile
  labels:
    sample: "true"
spec:
  # Workspace: Clone the repository
  workspace:
    type: git
    git:
      defaultBranch: "{{.BaseBranch}}"

  # Pre-execute: Clone repo and checkout PR branch
  preExecute:
    - name: clone-repo
      action: git_clone
      params:
        url: "{{.RepoUrl}}"
        branch: "{{.BaseBranch}}"
        depth: "50"  # Shallow clone with enough history for diff
    
    - name: fetch-pr-branch
      action: git_fetch
      params:
        ref: "{{.PrBranch}}"
    
    - name: checkout-pr
      action: git_checkout
      params:
        ref: "{{.PrBranch}}"

  # Execution constraints
  execution:
    maxIterations: 15
    timeout: "15m"

  # No critic needed for reviews - we trust the agent's judgment
  critic:
    enabled: false

  # SDK-specific configuration for Claude
  sdkConfig:
    claude:
      # Read-only tools for code review
      allowedTools:
        - Read
        - Glob
        - Grep
        - Bash  # For git commands only
      
      # Accept all read operations automatically
      permissionMode: acceptEdits
      
      # Load CLAUDE.md from the repo if present
      settingSources:
        - project

  # Post-execute: Submit the review to GitHub
  postExecute:
    - name: submit-review
      action: pr_submit_review
      params:
        prNumber: "{{.PrNumber}}"
        bodyTemplate: "{{.AgentOutput}}"
        # Event is determined by agent output: APPROVE or REQUEST_CHANGES
        event: "{{if contains .AgentOutput \"APPROVE\"}}APPROVE{{else}}REQUEST_CHANGES{{end}}"

  # On failure: Comment on PR with error
  onFailure:
    - name: comment-error
      action: pr_comment
      params:
        prNumber: "{{.PrNumber}}"
        body: |
          ⚠️ **Automated review failed**
          
          Error: {{.Error}}
          
          Please review manually or retry.
