# PR Review Execution Profile
# Clones repo, checks out PR branch, and submits review
apiVersion: ark.mckinsey.com/v1prealpha1
kind: ExecutionProfile
metadata:
  name: pr-review-profile
  labels:
    sample: "true"
spec:
  # Workspace: Clone the repository
  workspace:
    type: git
    git:
      defaultBranch: "{{.BaseBranch}}"

  # Pre-execute: Clone repo and checkout PR branch
  preExecute:
    - name: clone-repo
      action: git_clone
      params:
        url: "{{.RepoUrl}}"
        branch: "{{.BaseBranch}}"
        depth: "50"  # Shallow clone with enough history for diff
    
    - name: fetch-pr-branch
      action: git_fetch
      params:
        ref: "{{.PrBranch}}"
    
    - name: checkout-pr
      action: git_checkout
      params:
        ref: "FETCH_HEAD"

  # Execution constraints
  execution:
    maxIterations: 15
    timeout: "15m"

  # No critic needed for reviews - we trust the agent's judgment
  critic:
    enabled: false

  # SDK-specific configuration for Claude
  sdkConfig:
    claude:
      # Read-only tools for code review (Skill enables .claude/skills/ from repo)
      allowedTools:
        - Read
        - Glob
        - Grep
        - Bash  # For git commands only
        - Skill
      
      # Accept all read operations automatically
      permissionMode: acceptEdits
      
      # Load CLAUDE.md and Skills from the repo if present
      settingSources:
        - project
      
      # Structured output for reliable parsing
      outputFormat:
        type: json_schema
        schema:
          type: object
          properties:
            summary:
              type: string
              description: "Brief overview of the PR changes and their purpose"
            files_reviewed:
              type: array
              items:
                type: string
              description: "List of files that were reviewed"
            findings:
              type: array
              items:
                type: object
                properties:
                  severity:
                    type: string
                    enum: ["critical", "warning", "suggestion", "praise"]
                    description: "Severity of the finding"
                  file:
                    type: string
                    description: "File path where the finding applies"
                  line:
                    type: integer
                    description: "Line number in the file (optional)"
                  message:
                    type: string
                    description: "Description of the finding"
                  category:
                    type: string
                    enum: ["security", "performance", "logic", "style", "testing", "documentation"]
                    description: "Category of the finding"
                required: ["severity", "file", "message", "category"]
              description: "List of review findings"
            verdict:
              type: string
              enum: ["APPROVE", "REQUEST_CHANGES"]
              description: "Final review verdict"
            confidence:
              type: number
              minimum: 0
              maximum: 1
              description: "Confidence score for the verdict (0-1)"
          required: ["summary", "files_reviewed", "findings", "verdict", "confidence"]

  # Post-execute: Submit the review to GitHub (skipped if PrNumber is 0)
  postExecute:
    - name: submit-review
      action: pr_submit_review
      condition: '{{ne .PrNumber "0"}}'  # Skip if PrNumber is 0 (e.g., for testing)
      params:
        repo: "{{.RepoUrl}}"
        prNumber: "{{.PrNumber}}"
        bodyTemplate: |
          ## Summary
          
          {{.StructuredOutput.summary}}
          
          ## Files Reviewed
          
          {{range .StructuredOutput.files_reviewed}}- `{{.}}`
          {{end}}
          
          ## Findings
          
          {{range .StructuredOutput.findings}}### {{if eq .severity "critical"}}🔴 Critical{{else if eq .severity "warning"}}🟡 Warning{{else if eq .severity "suggestion"}}💡 Suggestion{{else}}🟢 Praise{{end}}: {{.category}}
          
          **File:** `{{.file}}`{{if .line}} (line {{.line}}){{end}}
          
          {{.message}}
          
          {{end}}
          {{if not .StructuredOutput.findings}}No issues found. Code looks good! 🎉
          {{end}}
          
          ---
          
          **Verdict:** {{.StructuredOutput.verdict}} (confidence: {{.StructuredOutput.confidence | printf "%.0f%%"}})
          
          *Review generated by Ark PR Reviewer*
        # Event comes directly from structured output - no string matching needed
        event: "{{.StructuredOutput.verdict}}"

  # On failure: Comment on PR with error (skipped if PrNumber is 0)
  onFailure:
    - name: comment-error
      action: pr_comment
      condition: '{{ne .PrNumber "0"}}'  # Skip if PrNumber is 0
      params:
        repo: "{{.RepoUrl}}"
        prNumber: "{{.PrNumber}}"
        body: |
          ⚠️ **Automated review failed**
          
          Error: {{.Error}}
          
          Please review manually or retry.
