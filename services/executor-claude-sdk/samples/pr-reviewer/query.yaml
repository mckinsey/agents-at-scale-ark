# Example Query for PR Reviewer
# Edit the parameters below for your specific PR
apiVersion: ark.mckinsey.com/v1alpha1
kind: Query
metadata:
  name: review-my-pr
  labels:
    sample: "true"
spec:
  # Target agent
  target:
    name: pr-reviewer
    type: agent
  
  # The task for the agent
  input: |
    Review the changes in this PR.
    
    The PR branch `{{.PrBranch}}` has been checked out locally, targeting `{{.BaseBranch}}`.
    
    Use git diff commands to see the changes, then provide a thorough code review.
  
  # Parameters passed to the agent and profile templates
  parameters:
    - name: RepoUrl
      value: "git@github.com:your-org/your-repo.git"  # CHANGE THIS
    
    - name: PrNumber
      value: "42"  # CHANGE THIS (used for posting review, set to "0" for local-only)
    
    - name: PrBranch
      value: "feature/your-feature"  # CHANGE THIS
    
    - name: BaseBranch
      value: "main"
  
  timeout: 10m
