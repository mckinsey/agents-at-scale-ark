# Code Refactor Execution Profile
# Refactors code and validates with test suite before creating PR
apiVersion: ark.mckinsey.com/v1prealpha1
kind: ExecutionProfile
metadata:
  name: refactor-profile
  labels:
    sample: "true"
spec:
  # Workspace: Clone the repository
  workspace:
    type: git
    git:
      defaultBranch: main
      branchPrefix: "agent/refactor/"
      commitMessageTemplate: "refactor: {{.CommitSummary}}"

  # Pre-execute: Set up the workspace
  preExecute:
    - name: clone-repo
      action: git_clone
      params:
        url: "{{.RepoUrl}}"
        branch: main
    
    - name: create-branch
      action: git_create_branch
      params:
        nameTemplate: "{{.RefactorScope | slugify}}-{{.QueryID | truncate 8}}"
    
    - name: install-deps
      action: shell
      params:
        command: |
          # Install dependencies for test execution
          if [ -f "package.json" ]; then
            npm ci --prefer-offline
          elif [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          elif [ -f "go.mod" ]; then
            go mod download
          fi

  # Execution constraints
  execution:
    maxIterations: 20
    timeout: "25m"
    maxBudgetUsd: "3.00"

  # Inline critic with TEST VALIDATION
  critic:
    enabled: true
    mode: inline
    maxRetries: 2
    inline:
      prompt: |
        Review the refactoring you just completed.
        
        Verify:
        1. The code behavior is unchanged (tests should pass)
        2. The refactoring improves code quality
        3. No regressions were introduced
        
        If the refactoring is complete and correct, respond with APPROVED.
        If there are issues, respond with NEEDS_REVISION and explain what's wrong.
      
      passCondition: "{{.CriticApproved}}"
      
      # Run tests to validate refactoring
      runTests: true
      testCommand: "{{.TestCommand}}"
      testTimeout: 300

  # SDK-specific configuration for Claude
  sdkConfig:
    claude:
      allowedTools:
        - Read
        - Edit
        - Write
        - Bash
        - Glob
        - Grep
      
      permissionMode: acceptEdits
      settingSources:
        - project
      
      critic:
        passPattern: "APPROVED"

  # Post-execute: Only create PR if tests passed
  postExecute:
    - name: commit-changes
      action: git_commit
      condition: "{{.HasChanges}}"
      params:
        messageTemplate: |
          refactor({{.RefactorScope}}): improve code quality
          
          {{.AgentOutput | truncate 500}}
    
    - name: push-branch
      action: git_push
      condition: "{{.HasChanges}}"
    
    - name: create-pr
      action: pr_create
      condition: "{{.HasChanges}}"
      params:
        titleTemplate: "refactor: {{.RefactorGoal | truncate 50}}"
        bodyTemplate: |
          ## Refactoring Summary
          
          **Scope:** `{{.RefactorScope}}`
          
          **Goal:** {{.RefactorGoal}}
          
          ## Changes Made
          
          {{.DiffSummary}}
          
          ## Validation
          
          ✅ Tests passed after refactoring
          
          ## Implementation Notes
          
          {{.AgentOutput}}
          
          ---
          *Generated by Claude SDK Executor*
        labels: "ai-generated,refactor"

  # On failure: Log and optionally notify
  onFailure:
    - name: log-failure
      action: log
      params:
        message: "Refactoring failed: {{.Error}}"
