replicaCount: 1

image:
  repository: ghcr.io/mckinsey/agents-at-scale-ark/executor-claude-sdk
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

workspace:
  enabled: true
  sizeLimit: "1Gi"

tmpVolume:
  enabled: true
  sizeLimit: "256Mi"

workspaceStorage:
  enabled: true
  mountPath: /workspaces
  pvcName: workspace-service-pvc

service:
  type: ClusterIP
  port: 8000
  targetPort: http
  name: http

resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "2Gi"
    cpu: "1000m"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

otel:
  secretRef:
    enabled: true
    name: otel-environment-variables

env:
  HOST: "0.0.0.0"
  PORT: "8000"
  UV_CACHE_DIR: "/tmp/uv-cache"

healthCheck:
  enabled: true
  path: /health
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

executionEngine:
  description: "Claude Agent SDK Executor - Autonomous agent execution with built-in tools and subagent support"
  timeout: "30m"
  streaming: true
  address:
    serviceRef:
      namespace: ""
      port: ""
      path: ""
