[project]
name = "argo-workflows-exporter"
version = "0.1.0"
description = "Sends Argo workflow step data from ark-api to an OpenTelemetry endpoint"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.0",
    "kubernetes>=31.0.0",
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-exporter-otlp-proto-http>=1.30.0",
]

[project.scripts]
argo-workflows-exporter = "argo_workflows_exporter.main:main"

[dependency-groups]
dev = ["ruff>=0.9.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argo_workflows_exporter"]
