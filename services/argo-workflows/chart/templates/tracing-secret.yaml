{{- if .Values.tracing.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: argo-workflows-tracing
type: Opaque
stringData:
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: {{ required "tracing.endpoint is required when tracing.enabled is true" .Values.tracing.endpoint | quote }}
  OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: {{ .Values.tracing.protocol | quote }}
  {{- with .Values.tracing.headers }}
  OTEL_EXPORTER_OTLP_TRACES_HEADERS: {{ . | quote }}
  {{- end }}
{{- end }}
