apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: a2a-arithmetic-workflow
  annotations:
    workflows.argoproj.io/title: "A2A Arithmetic Workflow"
    workflows.argoproj.io/description: |
      Demonstrates A2A agents, Ark agents, and Python scripts performing arithmetic operations.
      Shows how to pass data between different execution environments.
spec:
  entrypoint: main
  serviceAccountName: argo-workflow

  arguments:
    parameters:
      - name: a
        value: "1"
      - name: b
        value: "2"

  templates:
  - name: main
    dag:
      tasks:
      - name: prepare-resources
        template: prepare-resources

      - name: countdown-start
        template: a2a-agent-countdown
        dependencies: [prepare-resources]
        arguments:
          parameters:
          - name: countdown-message
            value: "Starting calculations in"
          - name: countdown-seconds
            value: "5"

      - name: add-numbers
        template: python-add
        dependencies: [countdown-start]
        arguments:
          parameters:
          - name: a
            value: "{{workflow.parameters.a}}"
          - name: b
            value: "{{workflow.parameters.b}}"

      - name: multiply-result
        template: python-multiply
        dependencies: [add-numbers]
        arguments:
          parameters:
          - name: input-number
            value: "{{tasks.add-numbers.outputs.parameters.result}}"

      - name: number-facts
        template: ark-agent-curiosa
        dependencies: [multiply-result]
        arguments:
          parameters:
          - name: final-number
            value: "{{tasks.multiply-result.outputs.parameters.result}}"

  - name: prepare-resources
    script:
      image: alpine/k8s:1.28.13
      command: [sh]
      source: |
        # Check if mock-llm A2A server exists (required)
        if ! kubectl get a2aserver mock-llm-countdown >/dev/null 2>&1; then
          echo "ERROR: A2A server 'mock-llm-countdown' not found"
          echo "Install with: helm install mock-llm oci://ghcr.io/dwmkerr/charts/mock-llm --version 0.1.8 --set ark.a2a.enabled=true"
          exit 1
        fi

        # Create number-curiosa agent if it doesn't exist
        if ! kubectl get agent number-curiosa >/dev/null 2>&1; then
          cat <<EOF | kubectl apply -f -
        apiVersion: ark.mckinsey.com/v1alpha1
        kind: Agent
        metadata:
          name: number-curiosa
        spec:
          description: "Provides mathematical facts about numbers"
          prompt: "You are a number facts expert. Provide 3-5 interesting facts about the given number."
          modelRef:
            name: default
          parameters:
            - name: number
              type: string
              required: true
        EOF
        fi

  - name: python-add
    inputs:
      parameters:
        - name: a
        - name: b
    script:
      image: python:3.12-slim
      command: [python]
      source: |
        a = int("{{inputs.parameters.a}}")
        b = int("{{inputs.parameters.b}}")
        result = a + b

        with open('/tmp/result.txt', 'w') as f:
            f.write(str(result))

        print(f"{a} + {b} = {result}")
    outputs:
      parameters:
      - name: result
        valueFrom:
          path: /tmp/result.txt

  - name: python-multiply
    inputs:
      parameters:
        - name: input-number
    script:
      image: python:3.12-slim
      command: [python]
      source: |
        num = int("{{inputs.parameters.input-number}}")
        result = num * 3

        with open('/tmp/result.txt', 'w') as f:
            f.write(str(result))

        print(f"{num} × 3 = {result}")
    outputs:
      parameters:
      - name: result
        valueFrom:
          path: /tmp/result.txt

  - name: ark-agent-curiosa
    inputs:
      parameters:
        - name: final-number
    script:
      image: alpine/k8s:1.28.13
      command: [sh]
      source: |
        cat > /tmp/query.yaml << EOF
        apiVersion: ark.mckinsey.com/v1alpha1
        kind: Query
        metadata:
          name: curiosa-{{workflow.name}}-{{inputs.parameters.final-number}}
        spec:
          input: "Tell me interesting facts about this number"
          parameters:
            - name: number
              value: "{{inputs.parameters.final-number}}"
          targets:
            - name: number-curiosa
              type: agent
          timeout: 2m
          ttl: 1h
        EOF

        kubectl apply -f /tmp/query.yaml
        kubectl wait --for=condition=Completed --timeout=120s query/curiosa-{{workflow.name}}-{{inputs.parameters.final-number}}
        kubectl get query curiosa-{{workflow.name}}-{{inputs.parameters.final-number}} -o jsonpath='{.status.responses[0].content}' > /tmp/curiosa-facts.txt
        cat /tmp/curiosa-facts.txt
    outputs:
      parameters:
      - name: curiosa-facts
        valueFrom:
          path: /tmp/curiosa-facts.txt

  - name: a2a-agent-countdown
    inputs:
      parameters:
        - name: countdown-message
        - name: countdown-seconds
    script:
      image: alpine/k8s:1.28.13
      command: [sh]
      source: |
        cat > /tmp/countdown-query.yaml << EOF
        apiVersion: ark.mckinsey.com/v1alpha1
        kind: Query
        metadata:
          name: countdown-{{workflow.name}}-start
        spec:
          input: "{{inputs.parameters.countdown-message}}"
          parameters:
            - name: seconds
              value: "{{inputs.parameters.countdown-seconds}}"
          targets:
            - name: mock-llm-countdown
              type: a2aserver
          timeout: 2m
          ttl: 1h
        EOF

        kubectl apply -f /tmp/countdown-query.yaml
        kubectl wait --for=condition=Completed --timeout=120s query/countdown-{{workflow.name}}-start
        kubectl get query countdown-{{workflow.name}}-start -o jsonpath='{.status.responses[0].content}' | tee /tmp/countdown-result.txt
    outputs:
      parameters:
      - name: countdown-result
        valueFrom:
          path: /tmp/countdown-result.txt
