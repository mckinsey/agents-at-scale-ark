# DevSpace configuration for localhost-gateway
version: v2beta1

vars:
  GATEWAY_PORT:
    source: env
    default: "8080"

pipelines:
  deploy: |-
    apply_nginx_gateway_fabric_crds
    create_deployments --all
  dev: |-
    apply_nginx_gateway_fabric_crds
    create_deployments --all

    echo "Waiting for gateway to be ready to port-forward..."
    until kubectl port-forward -n ark-system service/localhost-gateway-nginx ${GATEWAY_PORT}:80; do
      echo "Port-forwarding failed - gateway not ready yet. Retrying in 10s..."
      sleep 10
    done

functions:
  apply_nginx_gateway_fabric_crds: |-
    helm dependency build ./chart
    CRD_TMP=$(mktemp -d)
    tar -xzf ./chart/charts/nginx-gateway-fabric-*.tgz -C "$CRD_TMP" nginx-gateway-fabric/crds
    kubectl apply -f "$CRD_TMP/nginx-gateway-fabric/crds/"
    rm -rf "$CRD_TMP"

deployments:
  localhost-gateway:
    namespace: ark-system
    helm:
      chart:
        path: ./chart
      values:
        nginxGateway:
          install: true
          namespace: ark-system
          image:
            repository: ghcr.io/nginx/nginx-gateway-fabric
            tag: "1.6.2"
        gateway:
          name: localhost-gateway
          namespace: ark-system
        localhost:
          port: 8080

dev:
  localhost-gateway:
    namespace: ark-system
    imageSelector: ghcr.io/nginx/nginx-gateway-fabric/nginx
    ports:
    - port: ${GATEWAY_PORT}:80
