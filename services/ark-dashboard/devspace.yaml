# DevSpace configuration for ark-dashboard service
version: v2beta1

vars:
  AUTH_MODE:
    source: env
    default: "sso"
  BASE_URL:
    source: env
    default: ""
  AUTH_URL:
    source: env
    default: ""
  NEXT_PUBLIC_BASE_URL:
    source: env
    default: ""
  NEXTAUTH_URL:
    source: env
    default: ""
  AUTH_SECRET:
    source: env
    default: ""
  OIDC_ISSUER_URL:
    source: env
    default: ""
  OIDC_CLIENT_ID:
    source: env
    default: ""
  OIDC_CLIENT_SECRET:
    source: env
    default: ""
  OIDC_PROVIDER_NAME:
    source: env
    default: ""
  OIDC_PROVIDER_ID:
    source: env
    default: ""
  SESSION_MAX_AGE:
    source: env
    default: ""

images:
  ark-dashboard:
    image: ark-dashboard
    dockerfile: Dockerfile
    context: .

pipelines:
  deploy: |-
    build_images --all
    create_deployments --all
  dev: |-
    create_deployments --all
    start_dev --all

deployments:
  ark-dashboard:
    namespace: default
    helm:
      chart:
        path: ./chart
      values:
        app:
          image:
            repository: ${runtime.images.ark-dashboard.image}
            tag: ${runtime.images.ark-dashboard.tag}
          # Add host alias so keycloak.127.0.0.1.nip.io resolves to Keycloak service
          hostAliases:
            - ip: "10.100.29.235"
              hostnames:
                - "keycloak.127.0.0.1.nip.io"
          # Override resources for local development
          resources:
            limits:
              memory: "3072Mi"
              cpu: "2000m"
            requests:
              memory: "256Mi"
              cpu: "200m"
          env:
            - name: BASE_URL
              value: ${vars.BASE_URL}
            - name: AUTH_URL
              value: ${vars.AUTH_URL}
            - name: AUTH_SECRET
              value: ${vars.AUTH_SECRET}
            - name: OIDC_ISSUER_URL
              value: ${vars.OIDC_ISSUER_URL}
            - name: OIDC_CLIENT_ID
              value: ${vars.OIDC_CLIENT_ID}
            - name: OIDC_CLIENT_SECRET
              value: ${vars.OIDC_CLIENT_SECRET}
            - name: OIDC_PROVIDER_NAME
              value: ${vars.OIDC_PROVIDER_NAME}
            - name: OIDC_PROVIDER_ID
              value: ${vars.OIDC_PROVIDER_ID}
            - name: SESSION_MAX_AGE
              value: ${vars.SESSION_MAX_AGE}
            - name: AUTH_MODE
              value: ${vars.AUTH_MODE}
            - name: NEXT_PUBLIC_BASE_URL
              value: ${vars.NEXT_PUBLIC_BASE_URL}
            - name: NEXTAUTH_URL
              value: ${vars.NEXTAUTH_URL}
          # Override security context for dev mode to allow DevSpace sync
          podSecurityContext:
            runAsNonRoot: false
            runAsUser: 0
            fsGroup: 0
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
            capabilities:
              add:
                - SETUID
                - SETGID
                - CHOWN
                - FOWNER
                - DAC_OVERRIDE
        httpRoute:
          enabled: true

dev:
  ark-dashboard:
    imageSelector: ark-dashboard
    devImage: node:24-alpine
    env:
      - name: NODE_ENV
        value: development
      - name: BASE_URL
        value: "http://dashboard.default.127.0.0.1.nip.io:8080"
      - name: AUTH_URL
        value: "http://dashboard.default.127.0.0.1.nip.io:8080/api/auth"
      - name: AUTH_SECRET
        value: "dev-secret-key-for-local-testing-only-min-32-chars"
      - name: OIDC_ISSUER_URL
        value: "http://keycloak.127.0.0.1.nip.io:8080/realms/master"
      - name: OIDC_CLIENT_ID
        value: "ark-dashboard"
      - name: OIDC_CLIENT_SECRET
        value: "EnBB8pCenqmFhLTIIyaQctZCRrTTVgRg"
      - name: OIDC_PROVIDER_NAME
        value: "Local Keycloak"
      - name: OIDC_PROVIDER_ID
        value: "mid"
      - name: SESSION_MAX_AGE
        value: "1800"
      - name: AUTH_MODE
        value: "sso"
      - name: NEXT_PUBLIC_BASE_URL
        value: "http://dashboard.default.127.0.0.1.nip.io:8080"
      - name: NEXTAUTH_URL
        value: "http://dashboard.default.127.0.0.1.nip.io:8080/api/auth"
    command:
      [
        "sh",
        "-c",
        "cd /app/ark-dashboard && npm install -g pnpm && pnpm install && pnpm run dev",
      ]
    namespace: default
    ports:
      - port: 3000:3000
    # Stream logs instead of terminal
    logs:
      lastLines: 50
    # File synchronization for hot reload
    sync:
      - path: .:/app
        startContainer: true
        disableDownload: true
        uploadExcludeFile: .dockerignore
    # Enable SSH for IDE integration
    ssh:
      enabled: true

