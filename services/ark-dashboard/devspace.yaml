# DevSpace configuration for ark-dashboard service
version: v2beta1

vars:
  ENABLE_SSO:
    source: env
    default: false
  # Must match the values of the same name in the root devspace.yaml.
  SSO_DEX_HOST:
    source: env
    default: "dex.default.svc.cluster.local"
  SSO_DEX_PORT:
    source: env
    default: "5556"
  # Host the browser uses. AUTH_URL derives from it, and the callback path it
  # produces must be registered as a redirect URI in charts/ark-dex-dev.
  SSO_DASHBOARD_URL:
    source: env
    default: "http://dashboard.default.127.0.0.1.nip.io:8080"

images:
  ark-dashboard:
    image: ark-dashboard
    dockerfile: Dockerfile
    context: .
    docker:
      useBuildKit: true

pipelines:
  deploy: |-
    build_images --all
    create_deployments --all
  dev: |-
    create_deployments --all

    # Patch deployment to add PVCs for node modules and the npm cache
    kubectl patch deployment ark-dashboard -n ${DEVSPACE_NAMESPACE:-default} --type=strategic -p \
      '{"spec":{"template":{"spec":{"volumes":[{"name":"node-modules","persistentVolumeClaim":{"claimName":"ark-dashboard-node-modules"}},{"name":"npm-cache","persistentVolumeClaim":{"claimName":"ark-dashboard-npm-cache"}}],"containers":[{"name":"ark-dashboard","volumeMounts":[{"name":"node-modules","mountPath":"/app/ark-dashboard/node_modules"},{"name":"npm-cache","mountPath":"/npm-cache"}]}]}}}}' || true

    start_dev --all

deployments:
  ark-dashboard:
    namespace: default
    helm:
      chart:
        path: ./chart
      values:
        app:
          image:
            repository: ${runtime.images.ark-dashboard.image}
            tag: ${runtime.images.ark-dashboard.tag}
          # Override resources for local development
          resources:
            limits:
              memory: "10240Mi"
              cpu: "2000m"
            requests:
              memory: "256Mi"
              cpu: "200m"
          # Override security context for dev mode to allow DevSpace sync
          podSecurityContext:
            runAsNonRoot: false
            runAsUser: 0
            fsGroup: 0
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
            capabilities:
              add:
                - SETUID
                - SETGID
                - CHOWN
                - FOWNER
                - DAC_OVERRIDE
        httpRoute:
          enabled: true
        extraPVCs:
          - name: ark-dashboard-node-modules
            size: 2Gi
          - name: ark-dashboard-npm-cache
            size: 2Gi
  # Local-dev only: bind the chart's marketplace-source-editor Role to ark-api-sa
  # so marketplace source editing works in devspace (impersonation is off, so the
  # service account is the effective identity). Not part of the chart — production
  # binds the Role per user/namespace via impersonation instead.
  marketplace-source-editor-dev-binding:
    namespace: default
    kubectl:
      manifests:
        - dev/marketplace-source-editor-binding.yaml

profiles:
  - name: sso
    activation:
      - vars:
          ENABLE_SSO: true
    patches:
      # Helm replaces list values rather than merging them, so app.env has to
      # restate the chart defaults it is not changing.
      - op: add
        path: deployments.ark-dashboard.helm.values.app.env
        value:
          - name: AUTH_MODE
            value: "sso"
          - name: BASE_URL
            value: "${SSO_DASHBOARD_URL}"
          - name: AUTH_URL
            value: "${SSO_DASHBOARD_URL}/api/auth"
          # Signs the session cookie that wraps the Dex tokens. Fixed value so
          # restarting the dashboard does not invalidate an open session.
          - name: AUTH_SECRET
            value: "ark-devspace-sso-secret-not-for-production"
          - name: OIDC_ISSUER_URL
            value: "http://${SSO_DEX_HOST}:${SSO_DEX_PORT}/dex"
          - name: OIDC_CLIENT_ID
            value: "ark-dashboard"
          - name: OIDC_CLIENT_SECRET
            value: "ark-dashboard-dev-secret"
          - name: OIDC_PROVIDER_NAME
            value: "Dex"
          # Fixes the callback path to /api/auth/callback/dex, which must appear
          # verbatim in the Dex staticClient redirect URIs.
          - name: OIDC_PROVIDER_ID
            value: "dex"
          # offline_access is required: Dex only issues a refresh token when the
          # scope is requested, and without one the periodic token refresh fails.
          - name: OIDC_SCOPES
            value: "openid email profile offline_access"
          - name: SESSION_MAX_AGE
            value: ""
          - name: NEXT_PUBLIC_TOKEN_REFRESH_INTERVAL_MS
            value: "600000"
          - name: NEXT_PUBLIC_FALLBACK_INACTIVITY_TIMEOUT
            value: "1800000"

dev:
  ark-dashboard:
    imageSelector: ark-dashboard
    devImage: node:24-alpine
    env:
      - name: NODE_ENV
        value: development
      - name: npm_config_cache
        value: /npm-cache
    command:
      [
        "sh",
        "-c",
        "cd /app/ark-dashboard && npm install --prefer-offline --no-audit --no-fund && npm run dev 2>&1",
      ]
    namespace: default
    # Stream logs instead of terminal
    logs:
      lastLines: 50
    # File synchronization for hot reload
    sync:
      - path: .:/app
        startContainer: true
        disableDownload: true
        uploadExcludeFile: .dockerignore
        excludePaths:
          - ark-dashboard/node_modules/
    # Enable SSH for IDE integration
    ssh:
      enabled: true

