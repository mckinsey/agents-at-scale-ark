apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ark-evaluator-cluster-access
rules:
- apiGroups: ["ark.mckinsey.com"]
  resources: ["models", "queries", "evaluations", "agents"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets", "configmaps", "events"]
  verbs: ["get", "list"]