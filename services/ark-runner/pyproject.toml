[project]
name = "ark-runner"
version = "0.1.0"
description = "Config-driven Ark agent runner: PID-1 in a Substrate sandbox, runs an agent from its Agent/Model/Tool spec via a framework adapter."
requires-python = ">=3.11"
dependencies = [
    "ark-sdk",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ark_runner"]
