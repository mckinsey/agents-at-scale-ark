{{- with .Values.networkPolicy }}
{{- if hasKey . "enable" }}
{{- fail "ark-broker: networkPolicy.enable is not a value of this chart. Use networkPolicy.enabled — the ark-controller chart is the one that spells it 'enable', and left unnoticed this renders no NetworkPolicy at all." }}
{{- end }}
{{- end }}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ark-broker.fullname" . }}-netpol
  labels:
    {{- include "ark-broker.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ark-broker.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      {{- range .Values.networkPolicy.allowNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
      {{- end }}
      ports:
        - port: {{ .Values.memory.port }}
          protocol: TCP
{{- end }}
