# ARK Broker chart values

# Message backend: memory (default) or postgres
# Event backend: memory (default) or postgres
# Sessions backend: memory (default) or postgres — postgres requires
# backends.message and backends.event to also be postgres, since sessions
# are materialized from both
# Chunk backend: memory (default) or redis
backends:
  message: memory
  event: memory
  sessions: memory
  chunk: memory

# PostgreSQL connection — required when backends.message=postgres,
# backends.event=postgres or backends.sessions=postgres
database:
  # Plain connection URL. Avoid in production — use urlSecretRef instead.
  url: ""

  # URL used only by the migrate init container. Falls back to database.url when not set.
  # Use this when the migrate URL needs extra parameters that the app URL must not have,
  # e.g. sslrootcert= (golang-migrate reads it as a client-side path; postgres.js sends
  # it as a GUC SET command, which PostgreSQL rejects).
  migrateUrl: ""

  # Reference a k8s Secret that holds the full DATABASE_URL.
  # When set, takes priority over database.url in both the app and the migrate init container.
  urlSecretRef:
    name: ""
    key: "database-url"

  # Mount a k8s Secret containing TLS certificates into both the app container
  # and the migrate init container. Required for sslmode=verify-ca / verify-full.
  # Set sslmode in DATABASE_URL, e.g.: ?sslmode=verify-full
  # The CA cert is loaded automatically from <mountPath>/ca.crt via DATABASE_SSL_ROOT_CERT_PATH.
  tls:
    enabled: false
    secretName: ""
    mountPath: /etc/pg-ssl

  poolMax: 10
  connectTimeoutMs: 10000
  statementTimeoutMs: 30000
  messageVisibilityTtlSeconds: 2592000
  eventVisibilityTtlSeconds: 2592000
  # Must be >= both of the above: a session is the index into its messages
  # and events, so hiding it first would strand data that is still retained.
  sessionsVisibilityTtlSeconds: 2592000

  # Expired-row reaper: physically deletes rows past expires_at.
  # Interval between runs in seconds; 0 disables the reaper.
  reapIntervalSeconds: 3600
  # Rows deleted per DELETE statement while draining a backlog.
  reapBatchSize: 10000

  debugQueries: false

# Redis connection — required when backends.chunk=redis
redis:
  # Plain connection URL. Avoid in production — use urlSecretRef instead.
  url: ""

  # Reference a k8s Secret that holds the full REDIS_URL.
  # When set, takes priority over redis.url.
  urlSecretRef:
    name: ""
    key: "redis-url"

  # Reference a k8s Secret for REDIS_PASSWORD (optional, for ACL auth).
  passwordSecretRef:
    name: ""
    key: "redis-password"

  # Mount a k8s Secret containing TLS certificates.
  # Set url to rediss:// scheme when TLS is enabled.
  tls:
    enabled: false
    secretName: ""
    mountPath: /etc/redis-ssl

  keyPrefix: "ark-broker"
  connectTimeoutMs: 10000
  debugCommands: false

# Migration init container image — used when any Postgres backend is enabled
migrate:
  image:
    repository: ghcr.io/mckinsey/agents-at-scale-ark/ark-broker-migrate
    tag: ""
    pullPolicy: IfNotPresent

# Global annotations added to all resources
global:
  annotations:
    ark.mckinsey.com/service: ark-broker

# Application configuration
app:
  name: ark-broker
  image:
    repository: ghcr.io/mckinsey/agents-at-scale-ark/ark-broker
    # tag defaults to .Chart.AppVersion if not specified
    pullPolicy: IfNotPresent

  # Resource configuration
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "1024Mi"
      cpu: "1000m"

  # NODE_OPTIONS for the broker container.
  # Leave empty to derive --max-old-space-size from resources.limits.memory, as the
  # lesser of 85% and limit-128Mi (870MB at the 1024Mi default), omitted entirely below
  # a 256Mi limit where the result would be too small to start. V8 sizes its default
  # heap from host memory, not the container limit, so without this the process can
  # exhaust its heap while the container still has headroom. Bumping limits.memory is
  # enough — the heap follows.
  # The margin is not slack: V8's total heap ceiling sits ~24MB above the value set
  # here, and non-heap memory (native buffers, sockets) sits above that. Raising it
  # risks a kernel OOMKill in place of a clean V8 heap limit.
  # Set explicitly only to override the computed value. This REPLACES it rather than
  # adding to it, so always include --max-old-space-size when setting other flags —
  # omitting it drops the heap cap back to V8's host-derived default:
  #   nodeOptions: "--max-old-space-size=870 --enable-source-maps"
  nodeOptions: ""

server:
  requestTimeout: 0

replicaCount: 1

service:
  type: ClusterIP
  port: 80

# Memory service configuration
memory:
  # Create a Memory CRD resource
  createMemoryCRD: true
  # Set this Memory as the default (names it "default")
  setAsDefault: true
  # Port for the HTTP server
  port: 8080

# Store limits (0 = unlimited)
# Each store persists to JSON. Limits prevent unbounded file growth.
# Estimates: messages ~2KB, chunks ~500B, spans ~1KB, events ~500B each
limits:
  # Per-store in-memory byte budgets. Each store retains the most-recent data
  # within its budget; the sum is sized to fit the ~870MB Node heap the
  # container derives from its memory limit (see app.resources). Raise these and
  # app.resources.limits.memory together to retain more.
  messageMaxBytes: 104857600 # 100 MiB — conversation memory
  eventMaxBytes: 104857600 # 100 MiB — operation events
  chunkMaxBytes: 33554432 # 32 MiB — transient streaming chunks (also TTL-bounded)
  traceMaxBytes: 33554432 # 32 MiB — OTEL spans
  # Retention window for streaming chunks, in seconds.
  chunkTtlSeconds: 3600

# Prometheus ServiceMonitor for the broker's GET /metrics endpoint.
# Requires the Prometheus Operator (monitoring.coreos.com/v1) in the cluster.
prometheus:
  enable: false
  interval: 30s

# Streaming configuration
streaming:
  # Enable streaming support via ConfigMap (creates 'ark-config-streaming' when enabled)
  enabled: true

# Persistence configuration
persistence:
  enabled: false
  # Storage class for the PVC (uses default if not specified)
  storageClass: ""
  # Access mode for the PVC
  accessMode: ReadWriteOnce
  # Size of the persistent volume
  size: 1Gi
  # Path where data will be stored
  mountPath: /data
  # Filename for the memory data (JSONL: header line + one record per line)
  memoryFileName: messages.jsonl
  # Filename for the stream data (JSONL)
  streamFileName: completionchunks.jsonl
  # Filename for the trace data (JSONL)
  traceFileName: oteltraces.jsonl
  # Filename for the event data (JSONL)
  eventFileName: events.jsonl
  # Filename for the sessions data (single JSON object, not JSONL)
  sessionsFileName: sessions.json
  # Use existing PVC instead of creating a new one
  existingClaim: ""

serviceAccount:
  create: true
  name: ""

# L2 FIX: Pod security context for hardening
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

# L2 FIX: Container security context for hardening
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

nodeSelector: {}

tolerations: []

affinity: {}

# OTEL endpoint configuration - registers this broker as an OTEL trace receiver
# When enabled, creates a ConfigMap that the ARK controller discovers when processing queries
otelEndpoint:
  enabled: true

# Controller restart hook - ensures ark-controller restarts after broker deployment
# to discover the broker's OTEL endpoint
restartController:
  enabled: true
  namespace: ark-system
