[project]
name = "executor-claude-cli"
version = "0.1.0"
description = "Claude CLI execution engine for Ark"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.1.44",
    "ark-sdk",
    "uvicorn[standard]>=0.24.0",
    "starlette>=0.27.0",
    "a2a-sdk>=0.2.7",
    "pydantic>=2.5.0",
]

[tool.uv]
package = true

[tool.uv.sources]
ark-sdk = { path = "ark_sdk-0.1.55-py3-none-any.whl" }

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
executor-claude-cli = "executor_claude_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/executor_claude_cli"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]
