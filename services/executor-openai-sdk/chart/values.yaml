replicaCount: 1

image:
  repository: ghcr.io/mckinsey/agents-at-scale-ark/executor-openai-sdk
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8000
  targetPort: http
  name: http

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

otel:
  secretRef:
    enabled: true
    name: otel-environment-variables

env:
  HOST: "0.0.0.0"
  PORT: "8000"

workspace:
  enabled: true
  sizeLimit: "1Gi"

tmpVolume:
  enabled: true
  sizeLimit: "256Mi"

workspaceStorage:
  enabled: true
  mountPath: /workspaces
  pvcName: workspace-service-pvc

healthCheck:
  enabled: true
  path: /health
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

executionEngine:
  description: "OpenAI Agents SDK Executor - Executes agents using the OpenAI Agents SDK"
  timeout: "5m"
  streaming: true
  address:
    serviceRef:
      namespace: ""
      port: ""
      path: ""
