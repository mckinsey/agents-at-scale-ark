# Complete Example: Graph-Constrained Selector Team
# This shows how to configure and execute a team with selector strategy + graph constraints

# =============================================================================
# STEP 1: Create the Selector Agent
# =============================================================================
# This agent decides which team member should speak next
apiVersion: ark.mckinsey.com/v1alpha1
kind: Agent
metadata:
  name: coordinator
  namespace: default
spec:
  prompt: |
    You are a team coordinator. Your job is to select the best next team member 
    to respond based on the conversation context.
    
    Available participants: {{.Participants}}
    Roles: {{.Roles}}
    Conversation history: {{.History}}
    
    Respond with ONLY the name of the member you want to select next.

---
# =============================================================================
# STEP 2: Create the Team Member Agents
# =============================================================================
apiVersion: ark.mckinsey.com/v1alpha1
kind: Agent
metadata:
  name: researcher
  namespace: default
spec:
  prompt: "You are a research specialist. Gather and compile relevant information on the given topic."

---
apiVersion: ark.mckinsey.com/v1alpha1
kind: Agent
metadata:
  name: analyzer
  namespace: default
spec:
  prompt: "You are a data analyst. Analyze the research findings and identify key patterns and insights."

---
apiVersion: ark.mckinsey.com/v1alpha1
kind: Agent
metadata:
  name: reviewer
  namespace: default
spec:
  prompt: "You are a quality reviewer. Review the analysis for accuracy and completeness."

---
apiVersion: ark.mckinsey.com/v1alpha1
kind: Agent
metadata:
  name: writer
  namespace: default
spec:
  prompt: "You are a technical writer. Create a final report based on the reviewed analysis."

---
# =============================================================================
# STEP 3: Create the Team with Selector Strategy + Graph Constraints
# =============================================================================
apiVersion: ark.mckinsey.com/v1alpha1
kind: Team
metadata:
  name: research-pipeline
  namespace: default
spec:
  # Strategy: selector = AI-powered selection
  strategy: selector
  
  # Selector configuration: which agent makes selection decisions
  selector:
    agent: coordinator  # The coordinator agent we created above
    # Optional: custom selector prompt (uses default if not specified)
    # selectorPrompt: |
    #   Custom prompt template with {{.Participants}}, {{.Roles}}, {{.History}}
  
  # Team members
  members:
    - type: agent
      name: coordinator
    - type: agent
      name: researcher
    - type: agent
      name: analyzer
    - type: agent
      name: reviewer
    - type: agent
      name: writer
  
  # Graph constraints: defines allowed transitions
  # The selector can ONLY choose from members allowed by the graph
  graph:
    edges:
      # Coordinator can choose researcher or analyzer
      - from: coordinator
        to: researcher
      - from: coordinator
        to: analyzer
      
      # Researcher must go to analyzer
      - from: researcher
        to: analyzer
      
      # Analyzer must go to reviewer
      - from: analyzer
        to: reviewer
      
      # Reviewer must go to writer
      - from: reviewer
        to: writer
      
      # Writer can loop back to coordinator (for iterations)
      - from: writer
        to: coordinator
  
  # Optional: maximum number of team turns
  maxTurns: 10
  
  # Optional: description
  description: "Research pipeline with AI-driven member selection constrained by workflow graph"

---
# =============================================================================
# STEP 4: Create a Query to Execute the Team
# =============================================================================
apiVersion: ark.mckinsey.com/v1alpha1
kind: Query
metadata:
  name: analyze-market-research
  namespace: default
spec:
  # Input: the question/task for the team
  input: "Research and analyze the current state of AI in healthcare, then write a report."
  
  # Target: the team to execute
  targets:
    - type: team
      name: research-pipeline
  
  # Optional: session ID for conversation continuity
  sessionId: user-session-123
  
  # Optional: memory for conversation history
  # memory:
  #   name: my-memory
  
  # Optional: timeout
  timeout: 10m

---
# =============================================================================
# USAGE INSTRUCTIONS
# =============================================================================
# 
# 1. Apply all the resources:
#    kubectl apply -f graph-selector-complete-example.yaml
#
# 2. Check query status:
#    kubectl get query analyze-market-research -o yaml
#
# 3. Check query status (watch mode):
#    kubectl get query analyze-market-research -w
#
# 4. View the response:
#    kubectl get query analyze-market-research -o jsonpath='{.status.responses[0].content}'
#
# 5. View full response with metadata:
#    kubectl get query analyze-market-research -o yaml | grep -A 20 "responses:"
#
# =============================================================================
# EXECUTION FLOW
# =============================================================================
# 
# When you create the Query, here's what happens:
#
# 1. Query Controller detects the Query CRD
# 2. Controller loads the Team CRD (research-pipeline)
# 3. Controller sees strategy: selector
# 4. Controller calls team.Execute()
# 5. Team.executeSelector() runs:
#    - Builds legalTransitions map from graph edges
#    - First turn: selects coordinator (first member)
#    - Coordinator executes and responds
#    - Next turn: selector agent (coordinator) chooses next member
#      - Graph allows: researcher OR analyzer
#      - Selector agent makes decision based on conversation context
#    - If researcher chosen: must go to analyzer next (graph constraint)
#    - If analyzer chosen: must go to reviewer next (graph constraint)
#    - Reviewer must go to writer (graph constraint)
#    - Writer can loop back to coordinator (graph constraint)
# 6. Response is written to Query.status.responses
#
# =============================================================================
# EXAMPLE: Multiple Options (Branching)
# =============================================================================
# 
# In the graph above, when coordinator finishes, the selector agent can choose
# between researcher or analyzer. The selector agent will:
# - See both options in the prompt: "Available: researcher, analyzer"
# - Make an intelligent decision based on conversation context
# - Choose the most appropriate next step
#
# After that, the graph constrains the flow:
# - researcher → analyzer (only option)
# - analyzer → reviewer (only option)
# - reviewer → writer (only option)
#
# =============================================================================
# EXAMPLE: Single Option (Optimization)
# =============================================================================
# 
# When there's only ONE legal transition (e.g., researcher → analyzer),
# the system automatically selects that member WITHOUT calling the selector agent.
# This saves an LLM call and improves performance.
#
# =============================================================================
# EXAMPLE: No Graph (Classic Selector)
# =============================================================================
# 
# If you remove the `graph:` section, the selector can choose ANY member at any time:
#
# apiVersion: ark.mckinsey.com/v1alpha1
# kind: Team
# metadata:
#   name: free-selector-team
# spec:
#   strategy: selector
#   selector:
#     agent: coordinator
#   members:
#     - type: agent
#       name: researcher
#     - type: agent
#       name: analyzer
#     - type: agent
#       name: writer
#   # No graph section - selector can choose any member
#
# =============================================================================

