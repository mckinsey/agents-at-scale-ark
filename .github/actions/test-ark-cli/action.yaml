name: e2e-ark-cli
description: End-to-end test for the ARK CLI

inputs:
  azure-openai-key:
    description: Azure OpenAI API key for testing
    required: true
  azure-openai-base-url:
    description: Azure OpenAI base URL
    required: true
  model-type:
    description: Model provider type
    required: true
  model-name:
    description: Model name/version
    required: true
  model-api-version:
    description: Model API version (Azure only)
    required: true
  ci-cache-registry-username:
    description: Username for CI cache registry
    required: true
  ci-cache-registry-password:
    description: Password for CI cache registry
    required: true

runs:
  using: composite
  steps:
    - name: Install dependencies
      shell: bash
      run: |
        sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
        sudo chmod +x /usr/local/bin/yq
        curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
        curl -sS https://webinstall.dev/k9s | bash
        export PATH="$HOME/.local/bin:$PATH"
        sudo apt-get update && sudo apt-get install -y gettext

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'

    - name: Setup K3s cluster
      uses: ./.github/actions/setup-k3s
      with:
        metrics-enabled: false
        traefik-enabled: false
        k3s-channel: latest

    - name: Install Ark CLI
      shell: bash
      run: |
        set -x
        cd tools/ark-cli
        npm install
        npm run build
        npm install -g .
        which ark
        ls -la $(which ark)

    - name: Check Status
      shell: bash
      run: ark status

    - name: Configure Ark CLI for local charts
      shell: bash
      run: |
        # By default, 'ark install' pulls charts from the published OCI registry
        # (ghcr.io/mckinsey/agents-at-scale-ark/charts). For CI testing, we need
        # to use the local charts from this PR to test unreleased CRD changes.
        echo '{
          "services": {
            "ark-controller": { "chartPath": "./ark/dist/chart" },
            "ark-tenant": { "chartPath": "./charts/ark-tenant" },
            "ark-api": { "chartPath": "./services/ark-api/chart" },
            "ark-dashboard": { "chartPath": "./services/ark-dashboard/chart" },
            "ark-mcp": { "chartPath": "./services/ark-mcp/chart" },
            "ark-broker": { "chartPath": "./services/ark-broker/chart" }
          }
        }' | yq -P > .arkrc.yaml
        cat .arkrc.yaml

    - name: Install Ark using CLI
      shell: bash
      run: |
        ark install --yes --wait-for-ready=5m
        ark --version
        ark status

    - name: Wait for webhook certificate
      shell: bash
      run: |
        # The webhook needs its certificate to be issued by cert-manager before
        # it can accept requests. Wait for the certificate to be ready.
        kubectl wait --for=condition=Ready certificate/ark-serving-cert \
          -n ark-system --timeout=120s

    - name: Create default model
      shell: bash
      run: |
        ark models create default \
          --type "${{ inputs.model-type }}" \
          --model "${{ inputs.model-name }}" \
          --base-url "${{ inputs.azure-openai-base-url }}" \
          --api-key "${{ inputs.azure-openai-key }}" \
          --api-version "${{ inputs.model-api-version }}" \
          --yes

        kubectl wait --for=jsonpath='{.status.conditions[?(@.type=="ModelAvailable")].status}'=True \
          model/default \
          --timeout=5m

    - name: Run Query
      shell: bash
      run: |
        ark query model/default "Hello, please confirm you received this test message" -o yaml

    - name: Uninstall Ark
      shell: bash
      run: |
        ark uninstall --yes
        ark status
        sleep 30 && ark status
