name: e2e-ark-cli
description: End-to-end test for the ARK CLI

inputs:
  azure-openai-key:
    description: Azure OpenAI API key for testing
    required: true
  azure-openai-base-url:
    description: Azure OpenAI base URL
    required: true
  model-type:
    description: Model provider type
    required: true
  model-name:
    description: Model name/version
    required: true
  model-api-version:
    description: Model API version (Azure only)
    required: true
  ci-cache-registry-username:
    description: Username for CI cache registry
    required: true
  ci-cache-registry-password:
    description: Password for CI cache registry
    required: true

runs:
  using: composite
  steps:
    - name: Install dependencies
      shell: bash
      run: |
        sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
        sudo chmod +x /usr/local/bin/yq
        curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
        curl -sS https://webinstall.dev/k9s | bash
        export PATH="$HOME/.local/bin:$PATH"
        sudo apt-get update && sudo apt-get install -y gettext

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'

    - name: Setup K3s cluster
      uses: ./.github/actions/setup-k3s
      with:
        metrics-enabled: false
        traefik-enabled: false
        k3s-channel: latest

    - name: Install Ark CLI
      shell: bash
      run: |
        set -x
        cd tools/ark-cli
        npm install
        npm run build
        npm install -g .
        which ark
        ls -la $(which ark)

    - name: Check Status
      shell: bash
      run: ark status

    - name: Install Ark from local charts
      shell: bash
      run: |
        # Install cert-manager (required dependency)
        helm repo add jetstack https://charts.jetstack.io --force-update
        helm upgrade --install cert-manager jetstack/cert-manager \
          --namespace cert-manager \
          --create-namespace \
          --set crds.enabled=true \
          --wait --timeout=5m

        # Install ark-controller from local chart (includes CRDs)
        helm upgrade --install ark-controller ark/dist/chart \
          --namespace ark-system \
          --create-namespace \
          --wait --timeout=5m

        # Install ark-tenant from local chart
        helm upgrade --install ark-tenant charts/ark-tenant \
          --namespace default \
          --wait --timeout=5m

        # Install ark-api from local chart
        helm upgrade --install ark-api services/ark-api/chart \
          --namespace default \
          --wait --timeout=5m

        # Install ark-dashboard from local chart
        helm upgrade --install ark-dashboard services/ark-dashboard/chart \
          --namespace default \
          --wait --timeout=5m

        ark --version

    - name: Wait for Ark components to be ready
      shell: bash
      run: |
        ark status \
          ark-controller \
          ark-api \
          ark-dashboard \
          --wait-for-ready=15m

        ark status

    - name: Wait for webhooks to be ready
      shell: bash
      run: |
        echo "Waiting for cert-manager to inject CA bundle into webhooks..."
        timeout=300
        elapsed=0

        # Wait for CA bundle injection
        while [ $elapsed -lt $timeout ]; do
          if kubectl get mutatingwebhookconfiguration ark-mutating-webhook-configuration -o jsonpath='{.webhooks[?(@.name=="mmodel-v1.kb.io")].clientConfig.caBundle}' | grep -q .; then
            echo "CA bundle injected successfully"
            break
          fi
          echo "Waiting for CA bundle injection... ($elapsed/$timeout seconds)"
          sleep 5
          elapsed=$((elapsed + 5))
        done

        if [ $elapsed -ge $timeout ]; then
          echo "Timeout waiting for CA bundle injection"
          exit 1
        fi

        # Wait for webhook service to have endpoints
        echo "Waiting for ark-webhook-service to have endpoints..."
        elapsed=0
        while [ $elapsed -lt $timeout ]; do
          endpoint_count=$(kubectl get endpoints ark-webhook-service -n ark-system -o jsonpath='{.subsets[*].addresses[*].ip}' 2>/dev/null | wc -w)
          if [ "$endpoint_count" -gt 0 ]; then
            echo "Webhook service has $endpoint_count endpoint(s)"
            break
          fi
          echo "Waiting for webhook service endpoints... ($elapsed/$timeout seconds)"
          sleep 5
          elapsed=$((elapsed + 5))
        done

        if [ $elapsed -ge $timeout ]; then
          echo "Timeout waiting for webhook service endpoints"
          exit 1
        fi

        # Test webhook connectivity by making actual requests
        echo "Testing webhook connectivity..."
        elapsed=0
        webhook_ready=false

        # Create a test model YAML
        printf '%s\n' \
          'apiVersion: ark.mckinsey.com/v1alpha1' \
          'kind: Model' \
          'metadata:' \
          '  name: webhook-test' \
          '  namespace: default' \
          'spec:' \
          '  provider: openai' \
          '  model: gpt-4' \
          '  baseUrl: http://test' \
          '  apiKey: test-key' \
          > /tmp/webhook-test.yaml

        while [ $elapsed -lt $timeout ]; do
          # Try to create the model with dry-run
          test_result=$(kubectl apply -f /tmp/webhook-test.yaml --dry-run=server 2>&1 || true)

          # If we get the "could not find" error, webhook isn't responding yet
          if echo "$test_result" | grep -q "the server could not find the requested resource"; then
            echo "Webhook not responding yet, retrying... ($elapsed/$timeout seconds)"
          else
            # Any other response means webhook is working (success or validation error)
            echo "Webhook is responding"
            echo "Response: $test_result"
            webhook_ready=true
            break
          fi

          sleep 5
          elapsed=$((elapsed + 5))
        done

        rm -f /tmp/webhook-test.yaml

        if [ "$webhook_ready" = false ]; then
          echo "❌ Timeout waiting for webhook to respond"
          echo ""
          echo "=== Checking webhook configuration ==="
          kubectl get mutatingwebhookconfiguration ark-mutating-webhook-configuration -o yaml
          echo ""
          echo "=== Checking webhook service ==="
          kubectl get svc ark-webhook-service -n ark-system -o wide
          echo ""
          echo "=== Checking webhook endpoints ==="
          kubectl get endpoints ark-webhook-service -n ark-system -o wide
          echo ""
          echo "=== Checking controller pods ==="
          kubectl get pods -n ark-system -l control-plane=ark-controller -o wide
          echo ""
          echo "=== Controller logs (last 100 lines) ==="
          kubectl logs -n ark-system -l control-plane=ark-controller --tail=100
          exit 1
        fi

        echo "✓ Webhooks are ready and responding"

    - name: Create default model
      shell: bash
      run: |
        ark models create default \
          --type "${{ inputs.model-type }}" \
          --model "${{ inputs.model-name }}" \
          --base-url "${{ inputs.azure-openai-base-url }}" \
          --api-key "${{ inputs.azure-openai-key }}" \
          --api-version "${{ inputs.model-api-version }}" \
          --yes

        kubectl wait --for=jsonpath='{.status.conditions[?(@.type=="ModelAvailable")].status}'=True \
          model/default \
          --timeout=5m

    - name: Run Query
      shell: bash
      run: |
        ark query model/default "Hello, please confirm you received this test message" -o yaml

    - name: Uninstall Ark
      shell: bash
      run: |
        helm uninstall ark-dashboard --namespace default --ignore-not-found || true
        helm uninstall ark-api --namespace default --ignore-not-found || true
        helm uninstall ark-tenant --namespace default --ignore-not-found || true
        helm uninstall ark-controller --namespace ark-system --ignore-not-found || true
        ark status
        sleep 10 && ark status
