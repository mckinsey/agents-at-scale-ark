name: 'Setup E2E Environment'
description: 'Sets up E2E test environment with K8s cluster, tools, and ARK deployment'

inputs:
  ci-cache-registry:
    description: 'CI cache container registry URL'
    required: false
    default: ''
  ci-cache-registry-username:
    description: 'CI cache registry username'
    required: false
    default: ''
  ci-cache-registry-password:
    description: 'CI cache registry password'
    required: false
    default: ''
  ark-image-tag:
    description: 'ARK image tag to deploy'
    required: false
    default: 'latest'
  azure-openai-key:
    description: 'Azure OpenAI API key for default model'
    required: false
    default: ''
  azure-openai-base-url:
    description: 'Azure OpenAI base URL for default model'
    required: false
    default: ''
  install-coverage:
    description: 'Install coverage collection components'
    required: false
    default: 'false'
  storage-backend:
    description: 'Storage backend to use (etcd or postgresql)'
    required: false
    default: 'etcd'
  prefetch-test-images:
    description: 'Pre-pull chainsaw test images (mock-llm, curl, mockserver, hurl, python)'
    required: false
    default: 'false'
  prefetch-argo-images:
    description: 'Pre-pull Argo Workflows images (only for jobs that install Argo)'
    required: false
    default: 'false'
  install-broker:
    description: 'Install ark-broker (required for tests that use the event bus)'
    required: false
    default: 'false'
  enable-third-party-webhooks:
    description: 'Set policy.thirdPartyWebhooks.enabled=true on the aggregated apiserver (postgresql backend only)'
    required: false
    default: 'false'
  enable-inline-tools:
    description: 'Enable inline Tool authoring and the activator (dedicated inline e2e job)'
    required: false
    default: 'false'
  mock-llm-enabled:
    description: 'Pre-install the mock-llm sample into the default namespace (set false for suites that helm install their own there)'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Configure K3s registry authentication
      shell: bash
      run: |
        sudo mkdir -p /etc/rancher/k3s
        # Use provided registry or default to ghcr.io/{repository_owner}
        REGISTRY="${{ inputs.ci-cache-registry || format('ghcr.io/{0}', github.repository_owner) }}"
        USERNAME="${{ inputs.ci-cache-registry-username || github.actor }}"
        PASSWORD="${{ inputs.ci-cache-registry-password || github.token }}"
        
        # Extract registry hostname (e.g., ghcr.io from ghcr.io/org)
        REGISTRY_HOST=$(echo "$REGISTRY" | cut -d'/' -f1)
        
        echo "Configuring K3s registry authentication for: $REGISTRY_HOST"
        
        cat <<EOF | sudo tee /etc/rancher/k3s/registries.yaml
        mirrors:
          $REGISTRY_HOST:
            endpoint:
              - "https://$REGISTRY_HOST"
        configs:
          $REGISTRY_HOST:
            auth:
              username: $USERNAME
              password: $PASSWORD
        EOF

    - name: Setup K3s cluster
      uses: ./.github/actions/setup-k3s
      with:
        metrics-enabled: false
        traefik-enabled: false
        mock-llm-enabled: ${{ inputs.mock-llm-enabled }}

    - name: Run setup-e2e script
      shell: bash
      run: |
        ARGS=(--storage-backend "$STORAGE_BACKEND")
        if [ "$INSTALL_COVERAGE" = 'true' ]; then ARGS+=(--install-coverage); fi
        if [ "$INSTALL_BROKER" = 'true' ]; then ARGS+=(--install-broker); fi
        if [ "$PREFETCH_TEST_IMAGES" = 'true' ]; then ARGS+=(--prefetch-test-images); fi
        if [ "$PREFETCH_ARGO_IMAGES" = 'true' ]; then ARGS+=(--prefetch-argo-images); fi
        if [ "$ENABLE_THIRD_PARTY_WEBHOOKS" = 'true' ]; then ARGS+=(--enable-third-party-webhooks); fi
        if [ "$ENABLE_INLINE_TOOLS" = 'true' ]; then ARGS+=(--enable-inline-tools); fi
        ./.github/actions/setup-e2e/setup-local.sh "${ARGS[@]}"
      env:
        STORAGE_BACKEND: ${{ inputs.storage-backend }}
        INSTALL_COVERAGE: ${{ inputs.install-coverage }}
        INSTALL_BROKER: ${{ inputs.install-broker }}
        PREFETCH_TEST_IMAGES: ${{ inputs.prefetch-test-images }}
        PREFETCH_ARGO_IMAGES: ${{ inputs.prefetch-argo-images }}
        ENABLE_THIRD_PARTY_WEBHOOKS: ${{ inputs.enable-third-party-webhooks }}
        ENABLE_INLINE_TOOLS: ${{ inputs.enable-inline-tools }}
        DOCKER_CICD_CACHE_REGISTRY: ${{ inputs.ci-cache-registry || format('ghcr.io/{0}', github.repository_owner) }}
        DOCKER_CICD_CACHE_REGISTRY_USERNAME: ${{ inputs.ci-cache-registry-username || github.actor }}
        DOCKER_CICD_CACHE_REGISTRY_PASSWORD: ${{ inputs.ci-cache-registry-password || github.token }}
        ARK_IMAGE_TAG: ${{ inputs.ark-image-tag }}
        AZURE_OPENAI_KEY: ${{ inputs.azure-openai-key }}
        AZURE_OPENAI_BASE_URL: ${{ inputs.azure-openai-base-url }}
