name: Promote to Stable

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version to promote (e.g. 0.1.64). The latest v<version>-rc.* tag will be used as the freeze point.'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: main

      - name: Resolve RC tag and release branch
        id: resolve
        run: |
          STABLE="${{ inputs.version }}"

          if [[ ! "$STABLE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: version input '$STABLE' must be X.Y.Z (no 'v' prefix, no -rc suffix)"
            exit 1
          fi

          STABLE_TAG="v${STABLE}"
          if git rev-parse -q --verify "refs/tags/${STABLE_TAG}" >/dev/null; then
            echo "Error: stable tag ${STABLE_TAG} already exists. Nothing to promote."
            exit 1
          fi

          LATEST_RC=$(git tag --list "v${STABLE}-rc*" --sort=-version:refname | head -1)
          if [ -z "$LATEST_RC" ]; then
            echo "Error: no RC tags found matching v${STABLE}-rc*. Cut an RC from main first."
            exit 1
          fi

          RC_SHA=$(git rev-list -n 1 "$LATEST_RC")
          RELEASE_BRANCH="release-v${STABLE}"

          echo "stable=${STABLE}" >> $GITHUB_OUTPUT
          echo "latest_rc=${LATEST_RC}" >> $GITHUB_OUTPUT
          echo "rc_sha=${RC_SHA}" >> $GITHUB_OUTPUT
          echo "release_branch=${RELEASE_BRANCH}" >> $GITHUB_OUTPUT

          echo "Promoting ${LATEST_RC} (${RC_SHA}) → v${STABLE} via ${RELEASE_BRANCH}"

      - name: Ensure release branch exists at the RC tag SHA
        run: |
          RELEASE_BRANCH="${{ steps.resolve.outputs.release_branch }}"
          RC_SHA="${{ steps.resolve.outputs.rc_sha }}"

          if git ls-remote --heads origin "$RELEASE_BRANCH" | grep -q "$RELEASE_BRANCH"; then
            REMOTE_SHA=$(git ls-remote --heads origin "$RELEASE_BRANCH" | awk '{print $1}')
            echo "Release branch $RELEASE_BRANCH already exists at $REMOTE_SHA"
            if [ "$REMOTE_SHA" != "$RC_SHA" ]; then
              echo "Note: existing branch tip differs from RC tag SHA. Keeping existing branch (it may include hotfixes)."
            fi
          else
            echo "Creating $RELEASE_BRANCH at $RC_SHA"
            git push origin "${RC_SHA}:refs/heads/${RELEASE_BRANCH}"
          fi

      - name: Check for existing promotion PR
        id: check-pr
        run: |
          RELEASE_BRANCH="${{ steps.resolve.outputs.release_branch }}"
          BRANCH="promote/${{ steps.resolve.outputs.stable }}"

          EXISTING_PR=$(gh pr list --base "$RELEASE_BRANCH" --head "$BRANCH" --json number --jq '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "Error: Promotion PR #${EXISTING_PR} already exists for v${{ steps.resolve.outputs.stable }}"
            echo "Please merge or close the existing PR first."
            exit 1
          fi

          if git ls-remote --heads origin "$BRANCH" | grep -q "$BRANCH"; then
            echo "Deleting orphaned branch $BRANCH from previous run"
            git push origin --delete "$BRANCH" || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check out release branch and create promote branch
        run: |
          RELEASE_BRANCH="${{ steps.resolve.outputs.release_branch }}"
          BRANCH="promote/${{ steps.resolve.outputs.stable }}"

          git fetch origin "$RELEASE_BRANCH"
          git checkout "$RELEASE_BRANCH"
          git checkout -b "$BRANCH"

      - name: Graduate manifest and pin release-as
        run: |
          MANIFEST=".github/release-please-manifest.json"
          STABLE="${{ steps.resolve.outputs.stable }}"

          CURRENT=$(jq -r '."."' "$MANIFEST")
          echo "Manifest on release branch: $CURRENT → $STABLE"

          jq --arg v "$STABLE" '."." = $v' "$MANIFEST" > tmp.json
          mv tmp.json "$MANIFEST"

          # Pin release-as in the stable config so release-please cuts exactly $STABLE
          # (release-please ignores the action's release-as input in manifest mode)
          jq --arg v "$STABLE" '. + {"release-as": $v}' .github/release-please-config.json > tmp.json
          mv tmp.json .github/release-please-config.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$MANIFEST" .github/release-please-config.json
          git commit -m "chore: promote ${{ steps.resolve.outputs.latest_rc }} to v$STABLE"

      - name: Push branch and create PR
        run: |
          RELEASE_BRANCH="${{ steps.resolve.outputs.release_branch }}"
          BRANCH="promote/${{ steps.resolve.outputs.stable }}"
          LATEST_RC="${{ steps.resolve.outputs.latest_rc }}"
          STABLE="${{ steps.resolve.outputs.stable }}"
          RC_SHA="${{ steps.resolve.outputs.rc_sha }}"

          git push origin "$BRANCH"

          gh pr create \
            --base "$RELEASE_BRANCH" \
            --head "$BRANCH" \
            --title "chore: promote $LATEST_RC to v$STABLE" \
            --body "## Summary

          Promotes release candidate \`$LATEST_RC\` to stable release \`v$STABLE\`.

          ### What this PR does
          - Updates the release-please manifest to \`$STABLE\` on \`$RELEASE_BRANCH\`
          - Adds \`release-as: $STABLE\` to the stable config

          ### What happens when merged
          - CI runs on \`$RELEASE_BRANCH\`
          - Release-please cuts \`v$STABLE\` from \`$RELEASE_BRANCH\` HEAD
          - The released artifacts come from the RC commit (\`$RC_SHA\`) plus this manifest bump only — nothing else from main is included
          - Full deployment: containers, Helm charts, npm, PyPI, docs

          ---
          **RC Tag:** \`$LATEST_RC\`
          **RC SHA:** \`$RC_SHA\`
          **Release Branch:** \`$RELEASE_BRANCH\`
          **Stable Version:** \`v$STABLE\`"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## Promotion PR Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **RC Tag:** ${{ steps.resolve.outputs.latest_rc }}" >> $GITHUB_STEP_SUMMARY
          echo "- **RC SHA:** ${{ steps.resolve.outputs.rc_sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Branch:** ${{ steps.resolve.outputs.release_branch }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Stable Version:** v${{ steps.resolve.outputs.stable }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Merge the PR on the release branch to trigger the stable release." >> $GITHUB_STEP_SUMMARY
