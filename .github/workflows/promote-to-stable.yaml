name: Promote to Stable

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    concurrency:
      group: release-please
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Validate RC version exists
        id: version
        run: |
          MANIFEST=".github/release-please-manifest.json"
          CURRENT=$(jq -r '."."' "$MANIFEST")

          if [[ "$CURRENT" != *-rc.* ]]; then
            echo "Error: Current version $CURRENT is not an RC version. Nothing to promote."
            exit 1
          fi

          STABLE=$(echo "$CURRENT" | sed 's/-rc\.[0-9]*$//')
          LATEST_RC=$(git tag --list "v${STABLE}-rc.*" --sort=-version:refname | head -1)

          echo "current=${CURRENT}" >> $GITHUB_OUTPUT
          echo "stable=${STABLE}" >> $GITHUB_OUTPUT
          echo "latest_rc=${LATEST_RC:-v${CURRENT}}" >> $GITHUB_OUTPUT

          echo "Promoting ${LATEST_RC:-v${CURRENT}} to v${STABLE}"

      - name: Create Stable Release PR
        uses: googleapis/release-please-action@v4
        id: release-please
        with:
          manifest-file: .github/release-please-manifest.json
          config-file: .github/release-please-config.json
          target-branch: main

      - name: Summary
        run: |
          echo "## Promotion to Stable" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Current RC:** ${{ steps.version.outputs.latest_rc }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Stable:** v${{ steps.version.outputs.stable }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.release-please.outputs.pr }}" != "" ]; then
            echo "Release Please created/updated PR: ${{ steps.release-please.outputs.pr }}" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ steps.release-please.outputs.release_created }}" == "true" ]; then
            echo "Release created: ${{ steps.release-please.outputs.tag_name }}" >> $GITHUB_STEP_SUMMARY
          fi
