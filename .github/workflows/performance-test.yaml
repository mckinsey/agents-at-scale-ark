name: Verification - Performance

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
  pull_request:
    paths:
      - 'docs/specs/performance/**'
      - 'benchmarks/apiserver/**'

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Vanilla Ark install (etcd backend)
  etcd-baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-e2e
        with:
          ark-image-tag: latest
          ci-cache-registry: ghcr.io/${{ github.repository }}
          ci-cache-registry-password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: benchmarks/apiserver/go.mod
          cache-dependency-path: benchmarks/apiserver/go.sum

      - name: Build benchmarks
        run: make build
        working-directory: benchmarks/apiserver

      - name: Benchmark at 100 objects
        run: ./apiserver-bench -objects 100 -output /tmp/results-etcd-100.json
        working-directory: benchmarks/apiserver

      - name: Check thresholds
        run: |
          pip install pyyaml -q
          ./scripts/calc-check-thresholds \
            ../../docs/specs/performance/performance-thresholds.yaml \
            etcd-baseline-query-creation \
            /tmp/results-etcd-100.json
        working-directory: benchmarks/apiserver

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: etcd-benchmark-results
          path: /tmp/results-etcd-*.json

  # PostgreSQL storage backend install
  postgres-baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-e2e
        with:
          ark-image-tag: latest
          ci-cache-registry: ghcr.io/${{ github.repository }}
          ci-cache-registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install PostgreSQL storage backend
        run: |
          helm upgrade --install ark-storage-dev charts/ark-storage-dev \
            --namespace ark-system \
            --create-namespace \
            --wait --timeout=120s

      - name: Reconfigure controller for PostgreSQL backend
        run: |
          kubectl delete apiservice v1alpha1.ark.mckinsey.com --ignore-not-found
          helm upgrade ark-controller ark/dist/chart \
            --namespace ark-system \
            --reuse-values \
            --set storage.backend=postgresql \
            --set storage.postgresql.host=ark-storage-dev.ark-system.svc.cluster.local \
            --set storage.postgresql.port=5432 \
            --set storage.postgresql.database=ark \
            --set storage.postgresql.user=postgres \
            --set storage.postgresql.passwordSecretName=ark-storage-dev \
            --set storage.postgresql.passwordSecretKey=password \
            --wait --timeout=300s

      - uses: actions/setup-go@v5
        with:
          go-version-file: benchmarks/apiserver/go.mod
          cache-dependency-path: benchmarks/apiserver/go.sum

      - name: Build benchmarks
        run: make build
        working-directory: benchmarks/apiserver

      - name: Benchmark at 100 objects
        run: ./apiserver-bench -objects 100 -output /tmp/results-postgres-100.json
        working-directory: benchmarks/apiserver

      - name: Check thresholds
        run: |
          pip install pyyaml -q
          ./scripts/calc-check-thresholds \
            ../../docs/specs/performance/performance-thresholds.yaml \
            postgresql-baseline-query-creation \
            /tmp/results-postgres-100.json
        working-directory: benchmarks/apiserver

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-benchmark-results
          path: /tmp/results-postgres-*.json

  # Results summary
  results-summary:
    needs: [etcd-baseline, postgres-baseline]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/results
          merge-multiple: true

      - name: Print results
        run: |
          for f in /tmp/results/results-*.json; do
            echo "=== $(basename $f) ==="
            python3 -m json.tool "$f"
          done
