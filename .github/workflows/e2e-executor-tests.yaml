name: E2E Executor Tests (Debug)

on:
  workflow_dispatch:
  push:
    branches:
      - test/openairesponses

permissions:
  contents: read
  packages: read

env:
  EXECUTOR_CHART_VERSION: '0.1.5'

jobs:
  e2e-executor-tests:
    runs-on: ubuntu-24.04
    env:
      HAS_OPENAI_KEY: ${{ secrets.CICD_OPENAI_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-e2e
        with:
          ark-image-tag: latest
          install-coverage: "false"
          ci-cache-registry: ghcr.io/mckinsey/agents-at-scale-ark
          ci-cache-registry-username: ${{ github.actor }}
          ci-cache-registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install executor test dependencies
        run: |
          pip install -r tests/pytest/cli-tests/requirements.txt

      - name: Login to GHCR for marketplace charts
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Verify secret configuration
        if: ${{ env.HAS_OPENAI_KEY == 'true' }}
        env:
          OPENAI_API_KEY: ${{ secrets.CICD_OPENAI_API_KEY }}
        run: |
          KEY_LENGTH=${#OPENAI_API_KEY}
          echo "Secret length: $KEY_LENGTH characters"
          if [ "$KEY_LENGTH" -lt 10 ]; then
            echo "::error::CICD_OPENAI_API_KEY appears to be invalid (too short: $KEY_LENGTH chars)"
            exit 1
          fi
          echo "Secret first 4 chars: ${OPENAI_API_KEY:0:4}..."
          echo "Secret looks valid"

      - name: Create OpenAI credentials secret
        if: ${{ env.HAS_OPENAI_KEY == 'true' }}
        env:
          OPENAI_API_KEY: ${{ secrets.CICD_OPENAI_API_KEY }}
        run: |
          kubectl create secret generic openai-credentials \
            --from-literal=OPENAI_API_KEY="$OPENAI_API_KEY" \
            --from-literal=OPENAI_BASE_URL='https://api.openai.com/v1' \
            --namespace default \
            --dry-run=client -o yaml | kubectl apply -f -
          echo "Verifying secret was created correctly..."
          KEY_IN_SECRET=$(kubectl get secret openai-credentials -n default -o jsonpath='{.data.OPENAI_API_KEY}' | base64 -d | wc -c)
          echo "Secret stored length: $KEY_IN_SECRET bytes"

      - name: Deploy executor-openai-responses
        if: ${{ env.HAS_OPENAI_KEY == 'true' }}
        run: |
          helm upgrade --install executor-openai-responses \
            oci://ghcr.io/mckinsey/agents-at-scale-marketplace/charts/executor-openai-responses \
            --version ${{ env.EXECUTOR_CHART_VERSION }} \
            --namespace default \
            --set app.image.pullPolicy=Always \
            --wait \
            --timeout=5m

          kubectl set env deployment/executor-openai-responses -n default --from=secret/openai-credentials --overwrite

          echo "=== Verifying deployment env spec ==="
          DEPLOYED_KEY_LENGTH=$(kubectl get deployment executor-openai-responses -n default -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="OPENAI_API_KEY")].value}' | wc -c)
          echo "OPENAI_API_KEY length in deployment spec: $DEPLOYED_KEY_LENGTH chars"

          kubectl rollout status deployment/executor-openai-responses \
            -n default --timeout=2m

      - name: Diagnose executor pod environment
        if: ${{ env.HAS_OPENAI_KEY == 'true' }}
        run: |
          echo "=== Executor pod env vars ==="
          kubectl exec -n default deployment/executor-openai-responses -- env | grep -E "OPENAI|HOST|PORT" || true

          echo "=== Checking actual OPENAI_API_KEY length inside pod ==="
          kubectl exec -n default deployment/executor-openai-responses -- python3 -c "
          import os
          key = os.environ.get('OPENAI_API_KEY', '')
          print(f'OPENAI_API_KEY length: {len(key)} chars')
          print(f'First 4 chars: {key[:4]}...')
          " || echo "Pod env check failed"

          echo "=== Pod details ==="
          kubectl get pod -n default -l app=executor-openai-responses -o wide

          echo "=== Executor pod logs ==="
          kubectl logs -n default deployment/executor-openai-responses --tail=50 || true

      - name: Network connectivity diagnostics
        if: ${{ env.HAS_OPENAI_KEY == 'true' }}
        run: |
          echo "=== Testing network from runner host ==="
          curl -sI https://api.openai.com/v1/models | head -5 || echo "Host curl failed"

          echo ""
          echo "=== Testing DNS resolution from pod ==="
          kubectl exec -n default deployment/executor-openai-responses -- python3 -c "
          import socket
          try:
              ip = socket.gethostbyname('api.openai.com')
              print(f'DNS resolved api.openai.com -> {ip}')
          except Exception as e:
              print(f'DNS resolution failed: {e}')
          " || echo "DNS test failed"

          echo ""
          echo "=== Testing HTTPS connectivity from pod ==="
          kubectl exec -n default deployment/executor-openai-responses -- python3 -c "
          import urllib.request
          import ssl
          try:
              ctx = ssl.create_default_context()
              req = urllib.request.Request('https://api.openai.com/v1/models', method='HEAD')
              with urllib.request.urlopen(req, timeout=10, context=ctx) as resp:
                  print(f'HTTPS connection successful: {resp.status}')
          except Exception as e:
              print(f'HTTPS connection failed: {type(e).__name__}: {e}')
          " || echo "HTTPS test script failed"

          echo ""
          echo "=== Testing with httpx (OpenAI SDK dependency) ==="
          kubectl exec -n default deployment/executor-openai-responses -- python3 -c "
          import httpx
          try:
              resp = httpx.head('https://api.openai.com/v1/models', timeout=10)
              print(f'httpx connection successful: {resp.status_code}')
          except Exception as e:
              print(f'httpx connection failed: {type(e).__name__}: {e}')
          " || echo "httpx test failed"

          echo ""
          echo "=== CoreDNS logs ==="
          kubectl logs -n kube-system -l k8s-app=kube-dns --tail=20 || true

      - name: Port-forward executor service
        if: ${{ env.HAS_OPENAI_KEY == 'true' }}
        run: |
          kubectl port-forward -n default svc/executor-openai-responses 18080:8000 &
          sleep 3
          echo "=== Health check ==="
          curl -s http://localhost:18080/health

      - name: Debug test env vars
        if: ${{ env.HAS_OPENAI_KEY == 'true' }}
        env:
          CICD_OPENAI_API_KEY: ${{ secrets.CICD_OPENAI_API_KEY }}
          CICD_OPENAI_BASE_URL: ${{ secrets.CICD_OPENAI_BASE_URL || 'https://api.openai.com/v1' }}
        run: |
          echo "=== Verifying test env vars ==="
          echo "CICD_OPENAI_API_KEY length in shell: ${#CICD_OPENAI_API_KEY}"
          echo "CICD_OPENAI_API_KEY first 4 chars: ${CICD_OPENAI_API_KEY:0:4}..."

          echo ""
          echo "=== Verifying Python can read the env var ==="
          python3 -c "
          import os
          key = os.environ.get('CICD_OPENAI_API_KEY', '')
          print(f'CICD_OPENAI_API_KEY length in Python: {len(key)}')
          print(f'First 4 chars: {key[:4]}...')
          print(f'Actual value starts with sk-: {key.startswith(\"sk-\")}')
          "

      - name: Run executor E2E tests
        if: ${{ env.HAS_OPENAI_KEY == 'true' }}
        env:
          PYTHONPATH: ${{ github.workspace }}/tests/pytest/cli-tests
          EXECUTOR_URL: http://localhost:18080/execute
          CICD_OPENAI_API_KEY: ${{ secrets.CICD_OPENAI_API_KEY }}
          CICD_OPENAI_BASE_URL: ${{ secrets.CICD_OPENAI_BASE_URL || 'https://api.openai.com/v1' }}
        run: |
          cd tests/pytest/cli-tests/tests
          pytest test_responses.py::TestOpenAIResponsesExecutor::test_t01_basic_happy_path_sdk_0159_fix -v --tb=long --log-cli-level=DEBUG

      - name: Post-test executor logs
        if: always()
        run: |
          echo "=== Post-test executor pod logs ==="
          kubectl logs -n default deployment/executor-openai-responses --tail=100 || true

      - name: Upload executor test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: executor-test-logs-${{ github.sha }}
          path: tests/pytest/cli-tests/tests/*.log
          retention-days: 7

      - name: Collect cluster logs
        if: always()
        run: kubectl cluster-info dump --all-namespaces --output-directory=/tmp/cluster-logs-executor

      - name: Upload cluster logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cluster-logs-executor-${{ github.sha }}
          path: /tmp/cluster-logs-executor
          retention-days: 7

