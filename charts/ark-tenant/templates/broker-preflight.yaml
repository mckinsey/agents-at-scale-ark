{{/*
Refuse a fresh install with no broker Service in the namespace: a Memory
created for a broker that does not exist makes queries fail rather than
degrade (ark/executors/completions/memory_http.go). Only .Release.IsInstall
is checked, so an upgrade of an already-provisioned tenant is never blocked.

`lookup` cannot reach the API server during `helm install --dry-run` (client-
side) or `helm template`, and returns empty for every call in that mode.
Probe a namespace-scoped object that always exists — the "default"
ServiceAccount Kubernetes creates in every namespace — rather than a
cluster-scoped one, so this degrades gracefully for an operator whose RBAC
is confined to the tenant namespace itself, not just for a dry run.
*/}}
{{- if and .Release.IsInstall (.Values.memory).requireBroker }}
{{- if lookup "v1" "ServiceAccount" .Release.Namespace "default" }}
{{- $broker := lookup "v1" "Service" .Release.Namespace (.Values.memory).brokerService }}
{{- if not $broker }}
{{- fail (printf "no broker Service %q found in namespace %q: install ark-broker in this namespace first (e.g. 'ark install ark-broker'), or pass --set memory.requireBroker=false to provision this tenant without one" (.Values.memory).brokerService .Release.Namespace) }}
{{- end }}
{{- end }}
{{- end }}
