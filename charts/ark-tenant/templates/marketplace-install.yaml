{{- $mi := .Values.marketplaceInstall | default dict }}
{{- if $mi.enabled }}
{{- if not (or $mi.assumeAdmissionPolicyApi (.Capabilities.APIVersions.Has "admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy")) }}
{{- fail "marketplaceInstall.enabled needs the admissionregistration.k8s.io/v1 ValidatingAdmissionPolicy API (Kubernetes 1.31+). For offline renders pass --api-versions admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy or set marketplaceInstall.assumeAdmissionPolicyApi=true" }}
{{- end }}
{{ include "ark-tenant.marketplaceInstall.policy" (dict "root" . "suffix" "") }}
---
{{ include "ark-tenant.marketplaceInstall.policy" (dict "root" . "suffix" "-bootstrap" "policyAnnotations" (dict "helm.sh/hook" "pre-install" "helm.sh/hook-weight" "-10") "bindingAnnotations" (dict "helm.sh/hook" "pre-install" "helm.sh/hook-weight" "-9")) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ark-tenant.marketplaceInstaller.serviceAccount" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ark-tenant.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ark-tenant.fullname" . }}-marketplace-installer-admin
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ark-tenant.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "ark-tenant.marketplaceInstaller.serviceAccount" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ark-tenant.fullname" . }}-marketplace-installer-extra
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ark-tenant.labels" . | nindent 4 }}
rules:
- apiGroups: [ark.mckinsey.com]
  resources: ["*"]
  verbs: ["*"]
- apiGroups: [""]
  resources: [events]
  verbs: [create, patch]
{{- with $mi.extraRules }}
{{ toYaml . }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ark-tenant.fullname" . }}-marketplace-installer-extra
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ark-tenant.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "ark-tenant.marketplaceInstaller.serviceAccount" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ark-tenant.fullname" . }}-marketplace-installer-extra
{{- end }}
