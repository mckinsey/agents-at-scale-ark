# DevSpace configuration for local ARK services development
version: v2beta1
name: ark-stack

# Dependencies - include other DevSpace configurations
dependencies:
  localhost-gateway:
    path: ./services/localhost-gateway
  ark-controller:
    path: ./ark
  ark-broker:
    path: ./services/ark-broker
  ark-api:
    path: ./services/ark-api
  ark-dashboard:
    path: ./services/ark-dashboard
#  kubernetes-mcp-server:
#    path: ./services/kubernetes-mcp-server
#  argo-workflows:
#    path: ./services/argo-workflows
#  ark-api-a2a:
#    path: ./services/ark-api-a2a
#  ark-mcp:
#    path: ./services/ark-mcp
# Observability services. Uncomment to enable locally. Only phoenix or langfuse is needed
# phoenix service for observability. phoenix has a hook to restart ark-controller to pick up its url
# phoenix:
#   git: https://github.com/mckinsey/agents-at-scale-marketplace
#   tag: phoenix-v0.1.5
#   subPath: services/phoenix
# langfuse service for observability. langfuse has a hook to restart ark-controller to pick up its url
# langfuse:
#   git: https://github.com/mckinsey/agents-at-scale-marketplace
#   tag: langfuse-v0.1.4
#   subPath: services/langfuse

# Vars - To disable, set environment variables before the devspace commands
#        For example: ENABLE_CERT_MANAGER=false devspace dev
#        For PostgreSQL controller backend: STORAGE_BACKEND=postgresql devspace dev
#        For Postgres message backend: BROKER_MESSAGE_BACKEND=postgres devspace dev
#        For SSO with a local Dex and two hardcoded users: ENABLE_SSO=true devspace dev
vars:
  STORAGE_BACKEND:
    source: env
    default: "etcd"
  BROKER_MESSAGE_BACKEND:
    source: env
    default: "memory"
  ENABLE_CERT_MANAGER:
    source: env
    default: true
  ENABLE_GATEWAY_API_CRDS:
    source: env
    default: true
  ENABLE_ARK_TENANT:
    source: env
    default: true
  ENABLE_ARGO:
    source: env
    default: false
  ENABLE_SSO:
    source: env
    default: false
  # Dex host and port. The issuer URL is composed from these as
  # http://$SSO_DEX_HOST:$SSO_DEX_PORT/dex and must be identical here, in
  # services/ark-api/devspace.yaml and in services/ark-dashboard/devspace.yaml:
  # the browser and the pods both resolve that one URL, by different routes.
  SSO_DEX_HOST:
    source: env
    default: "dex.default.svc.cluster.local"
  SSO_DEX_PORT:
    source: env
    default: "5556"

commands:
  routes:
    ./services/localhost-gateway/scripts/show-routes.sh
  routes-forward: |-
    kill $(lsof -ti :8080) 2>/dev/null || true
    echo "Starting port-forward on localhost:8080..."
    nohup kubectl port-forward -n ark-system service/localhost-gateway-nginx 8080:80 > /dev/null 2>&1 &
    sleep 1
    PID=$(lsof -ti :8080)
    if [ -n "$PID" ]; then
      echo "Port-forward running in background (PID: $PID)"
    else
      echo "Failed to start port-forward. Is the gateway deployed?"
    fi
  sso-forward: |-
    kill $(lsof -ti :${SSO_DEX_PORT}) 2>/dev/null || true
    echo "Starting Dex port-forward on localhost:${SSO_DEX_PORT}..."
    nohup kubectl port-forward service/dex ${SSO_DEX_PORT}:${SSO_DEX_PORT} > /dev/null 2>&1 &
    sleep 1
    PID=$(lsof -ti :${SSO_DEX_PORT})
    if [ -n "$PID" ]; then
      echo "Port-forward running in background (PID: $PID)"
    else
      echo "Failed to start port-forward. Is Dex deployed (ENABLE_SSO=true)?"
    fi

profiles:
  - name: enable-cert-manager
    activation:
    - vars:
        ENABLE_CERT_MANAGER: true
    patches:
    - op: add
      path: deployments
      value:
        cert-manager:
          namespace: cert-manager
          helm:
            chart:
              name: cert-manager
              repo: https://charts.jetstack.io
            releaseName: cert-manager
            upgradeArgs: [ "--install" ]
            values:
              installCRDs: true
              # Disable the post-install Job that probes the cert-manager webhook.
              # The probe runs before the webhook TLS is stable, causing it to hang.
              startupapicheck:
                enabled: false
  - name: enable-gateway-api
    activation:
      - vars:
          ENABLE_GATEWAY_API_CRDS: true
    patches:
      - op: add
        path: deployments
        value:
          gateway-api:
            namespace: default
            kubectl:
              manifests:
                - "https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.3.0/standard-install.yaml"
  - name: enable-ark-tenant
    activation:
      - vars:
          ENABLE_ARK_TENANT: true
    patches:
      - op: add
        path: deployments
        value:
          ark-tenant:
            namespace: default
            helm:
              chart:
                path: ./charts/ark-tenant
              releaseName: ark-tenant
              upgradeArgs: [ "--install" ]
  - name: enable-argo
    activation:
      - vars:
          ENABLE_ARGO: true
    patches:
      - op: add
        path: dependencies
        value:
          argo-workflows:
            path: ./services/argo-workflows
  - name: enable-sso
    activation:
      - vars:
          ENABLE_SSO: true
    patches:
      - op: add
        path: deployments
        value:
          ark-dex-dev:
            namespace: default
            helm:
              chart:
                path: ./charts/ark-dex-dev
              # Release name fixes the Deployment name the pipeline waits on.
              # The Service name is fixed by the chart, not by the release.
              releaseName: dex
              upgradeArgs: [ "--install" ]
              values:
                issuer: "http://${SSO_DEX_HOST}:${SSO_DEX_PORT}/dex"

functions:
  # Probe the cert-manager admission webhook end-to-end before deploying any
  # charts that create cert-manager resources. A populated CABundle only means
  # cainjector patched the config — it does NOT mean the webhook pod is already
  # serving TLS that chains to that CA. Deploying into that gap is what caused
  # the first-deploy "x509: certificate signed by unknown authority" failures. A
  # server-side dry-run exercises the real admission path, so once it succeeds
  # the subsequent chart deploys are safe. Cheap when cert-manager is already up
  # (passes on the first try), so it runs unconditionally.
  ensure_cert_manager_webhook: |-
    # The webhook must be running before any cert-manager resources (Issuer,
    # Certificate) can be created, or Helm gets x509 errors on its TLS endpoint.
    kubectl rollout status deployment/cert-manager-webhook -n cert-manager --timeout=120s
    kubectl rollout status deployment/cert-manager-cainjector -n cert-manager --timeout=120s
    echo "Waiting for cert-manager webhook to accept admission requests..."
    webhook_ready=false
    probe='apiVersion: cert-manager.io/v1\nkind: Issuer\nmetadata:\n  name: webhook-readiness-probe\n  namespace: cert-manager\nspec:\n  selfSigned: {}\n'
    for i in $(seq 1 60); do
      if printf "${probe}" | kubectl apply --dry-run=server -f - > /dev/null 2>&1; then
        webhook_ready=true
        break
      fi
      sleep 2
    done
    if [ "${webhook_ready}" != "true" ]; then
      echo "cert-manager webhook did not become ready in time" >&2
      exit 1
    fi
  # apiservice Available only means the aggregation layer can reach the backend.
  # On a cold start the embedded apiserver restarts once (while it waits for
  # postgres), and during that flap the aggregated discovery omits the Tool kind,
  # so helm fails with "no matches for kind Tool ... ensure CRDs are installed
  # first". Probe the discovery document until Tool is actually served.
  ensure_tool_api: |-
    echo "Waiting for Tool API to be served by the embedded apiserver..."
    tool_served=false
    for i in $(seq 1 90); do
      if kubectl get --raw /apis/ark.mckinsey.com/v1alpha1 2>/dev/null | grep -q '"name":"tools"'; then
        tool_served=true
        break
      fi
      sleep 2
    done
    if [ "${tool_served}" != "true" ]; then
      echo "embedded apiserver did not serve the Tool API in time" >&2
      exit 1
    fi

pipelines:
  deploy: |-

    # Start gateway-api CRD installation in background so it runs in parallel
    # with cert-manager startup instead of sequentially after it.
    GATEWAY_PID=""
    if [ "${ENABLE_GATEWAY_API_CRDS}" == "true" ]; then
      if ! kubectl get crd gateways.gateway.networking.k8s.io > /dev/null 2>&1; then
        kubectl apply -f "https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.3.0/standard-install.yaml" &
        GATEWAY_PID=$!
      fi
    fi

    if [ "${ENABLE_CERT_MANAGER}" == "true" ]; then
      # Skip installation if cert-manager is already deployed (idempotent re-deploys).
      if ! helm status cert-manager -n cert-manager > /dev/null 2>&1; then
        create_deployments cert-manager
      fi
      ensure_cert_manager_webhook
    fi

    # Wait for background gateway-api install to finish before creating ark-controller,
    # which depends on gateway CRDs being established.
    if [ -n "${GATEWAY_PID}" ]; then wait ${GATEWAY_PID}; fi

    run_dependency_pipelines ark-controller --pipeline=deploy

    if [ "${ENABLE_CERT_MANAGER}" == "true" ]; then
      # Verify cert-manager can actually issue the webhook certificate end-to-end.
      # rollout status + CABundle checks above only confirm pods are running and the
      # webhook config is patched — they don't catch issuance failures (e.g. broken
      # RBAC, controller errors). Waiting for serving-cert to be Ready provides that
      # guarantee before dependent services try to call the webhook.
      kubectl wait --for=condition=Ready certificate/serving-cert -n ark-system --timeout=60s
    fi

    if [ "${ENABLE_ARK_TENANT}" == "true" ]; then
      echo "Waiting for Ark API to be available..."
      if [ "${STORAGE_BACKEND}" == "etcd" ]; then
        kubectl wait --for=condition=Established crd/tools.ark.mckinsey.com --timeout=60s
      else
        kubectl wait --for=condition=Available apiservice/v1alpha1.ark.mckinsey.com --timeout=300s
        ensure_tool_api
      fi
      create_deployments ark-tenant
    fi

    # Dex must be up before ark-api: with AUTH_MODE=sso the auth middleware builds
    # its token validator at startup. Deploying it here also keeps the login
    # available for the whole session, not only once the dependencies are done.
    if [ "${ENABLE_SSO}" == "true" ]; then
      if ! grep -q "${SSO_DEX_HOST}" /etc/hosts; then
        echo ""
        echo "ERROR: SSO mode needs ${SSO_DEX_HOST} to resolve on this machine."
        echo "The browser reaches Dex through a port-forward and the pods reach it"
        echo "through cluster DNS, so both must use the same URL. Add the entry with:"
        echo ""
        echo "  echo \"127.0.0.1  ${SSO_DEX_HOST}\" | sudo tee -a /etc/hosts"
        echo ""
        exit 1
      fi
      create_deployments ark-dex-dev
      kubectl rollout status deployment/dex -n "${DEVSPACE_NAMESPACE:-default}" --timeout=120s
      kill $(lsof -ti :${SSO_DEX_PORT}) 2>/dev/null || true
      nohup kubectl port-forward -n "${DEVSPACE_NAMESPACE:-default}" service/dex ${SSO_DEX_PORT}:${SSO_DEX_PORT} > /dev/null 2>&1 &
      echo "SSO enabled. Log in as admin@ark.local or viewer@ark.local, password arkdev123."
    fi

    if [ "${ENABLE_ARGO}" == "true" ]; then
      run_dependency_pipelines argo-workflows --pipeline=deploy
    fi
    run_dependency_pipelines --all --exclude ark-controller --exclude argo-workflows --pipeline=deploy

    echo ""
    echo "All services deployed. Waiting for pods to be ready..."
    # Wait for pods before streaming logs; kubectl logs -f fails immediately if a
    # pod is still in ContainerCreating state.
    kubectl wait pod -l app -n "${DEVSPACE_NAMESPACE}" --for=condition=Ready --timeout=120s 2>/dev/null || true
    echo "Streaming logs from namespace ${DEVSPACE_NAMESPACE} (Ctrl+C to stop)..."
    echo ""
    kubectl logs -f -n "${DEVSPACE_NAMESPACE}" --all-containers --prefix --max-log-requests=10 -l app
  dev: |-

    # Start gateway-api CRD installation in background so it runs in parallel
    # with cert-manager startup instead of sequentially after it.
    GATEWAY_PID=""
    if [ "${ENABLE_GATEWAY_API_CRDS}" == "true" ]; then
      if ! kubectl get crd gateways.gateway.networking.k8s.io > /dev/null 2>&1; then
        kubectl apply -f "https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.3.0/standard-install.yaml" &
        GATEWAY_PID=$!
      fi
    fi

    if [ "${ENABLE_CERT_MANAGER}" == "true" ]; then
      # Skip installation if cert-manager is already deployed (idempotent re-deploys).
      if ! helm status cert-manager -n cert-manager > /dev/null 2>&1; then
        create_deployments cert-manager
      fi
      ensure_cert_manager_webhook
    fi

    # Wait for background gateway-api install to finish before creating ark-controller,
    # which depends on gateway CRDs being established.
    if [ -n "${GATEWAY_PID}" ]; then wait ${GATEWAY_PID}; fi

    run_dependency_pipelines ark-controller --pipeline=dev

    if [ "${ENABLE_CERT_MANAGER}" == "true" ]; then
      # Verify cert-manager can actually issue the webhook certificate end-to-end.
      # rollout status + CABundle checks above only confirm pods are running and the
      # webhook config is patched — they don't catch issuance failures (e.g. broken
      # RBAC, controller errors). Waiting for serving-cert to be Ready provides that
      # guarantee before dependent services try to call the webhook.
      kubectl wait --for=condition=Ready certificate/serving-cert -n ark-system --timeout=60s
    fi

    if [ "${ENABLE_ARK_TENANT}" == "true" ]; then
      echo "Waiting for Ark API to be available..."
      if [ "${STORAGE_BACKEND}" == "etcd" ]; then
        kubectl wait --for=condition=Established crd/tools.ark.mckinsey.com --timeout=60s
      else
        kubectl wait --for=condition=Available apiservice/v1alpha1.ark.mckinsey.com --timeout=300s
        ensure_tool_api
      fi
      create_deployments ark-tenant
    fi

    # Dex must be up before ark-api: with AUTH_MODE=sso the auth middleware builds
    # its token validator at startup. Deploying it here also keeps the login
    # available for the whole session, not only once the dependencies are done.
    if [ "${ENABLE_SSO}" == "true" ]; then
      if ! grep -q "${SSO_DEX_HOST}" /etc/hosts; then
        echo ""
        echo "ERROR: SSO mode needs ${SSO_DEX_HOST} to resolve on this machine."
        echo "The browser reaches Dex through a port-forward and the pods reach it"
        echo "through cluster DNS, so both must use the same URL. Add the entry with:"
        echo ""
        echo "  echo \"127.0.0.1  ${SSO_DEX_HOST}\" | sudo tee -a /etc/hosts"
        echo ""
        exit 1
      fi
      create_deployments ark-dex-dev
      kubectl rollout status deployment/dex -n "${DEVSPACE_NAMESPACE:-default}" --timeout=120s
      kill $(lsof -ti :${SSO_DEX_PORT}) 2>/dev/null || true
      nohup kubectl port-forward -n "${DEVSPACE_NAMESPACE:-default}" service/dex ${SSO_DEX_PORT}:${SSO_DEX_PORT} > /dev/null 2>&1 &
      echo "SSO enabled. Log in as admin@ark.local or viewer@ark.local, password arkdev123."
    fi

    if [ "${ENABLE_ARGO}" == "true" ]; then
      run_dependency_pipelines argo-workflows --pipeline=dev
    fi
    run_dependency_pipelines --all --exclude ark-controller --exclude argo-workflows --pipeline=dev
