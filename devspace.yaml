# DevSpace configuration for local ARK services development
version: v2beta1

# Dependencies - include other DevSpace configurations
dependencies:
  ark-cluster-memory:
    path: ./services/ark-cluster-memory
  ark-api:
    path: ./services/ark-api
  ark-dashboard:
    path: ./services/ark-dashboard
  ark:
    path: ./ark
#   ark-mcp:
#     path: ./services/ark-mcp
#     pipeline: dev
#   postgres-memory:
#     path: ./services/postgres-memory

vars:
  ENABLE_CERT_MANAGER:
    source: input
    question: "Enable cert-manager? (Y/n)"
    default: "Y"
  ENABLE_GATEWAY_API_CRDS:
    source: input
    question: "Enable Gateway API CRD's? (Y/n)"
    default: "Y"

profiles:
  - name: enable-cert-manager
    activation:
    - vars:
        ENABLE_CERT_MANAGER: "Y"
    patches:
    - op: add
      path: dependencies
      value:
        cert-manager:
          path: ./services/cert-manager
  - name: enable-gateway-api
    activation:
      - vars:
          ENABLE_GATEWAY_API_CRDS: "Y"
    patches:
      - op: add
        path: dependencies
        value:
          gateway-api:
            path: ./services/gateway-api

pipelines:
  deploy: |-
    run_dependency_pipelines --all --pipeline=deploy
  dev: |-
    run_dependency_pipelines --all --pipeline=dev


