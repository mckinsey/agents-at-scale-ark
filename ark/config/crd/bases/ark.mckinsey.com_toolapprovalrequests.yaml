kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: toolapprovalrequests.ark.mckinsey.com
spec:
  group: ark.mckinsey.com
  names:
    kind: ToolApprovalRequest
    listKind: ToolApprovalRequestList
    plural: toolapprovalrequests
    shortNames:
    - tar
    singular: toolapprovalrequest
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.queryRef.name
      name: Query
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.toolCalls[*].name
      name: Tools
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ToolApprovalRequest represents a pending human approval for one
          or more tool calls.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ToolApprovalRequestSpec defines the desired state of ToolApprovalRequest.
            properties:
              approvers:
                description: Approvers specifies who can approve this request
                items:
                  description: ApproverRef specifies who can approve tool calls. At
                    least one field must be set.
                  properties:
                    group:
                      description: Group name - user must belong to this group
                      type: string
                    role:
                      description: Role name - user must be bound to a ClusterRole/Role
                        with this name
                      type: string
                    user:
                      description: User identity - must match the authenticated user's
                        identity
                      type: string
                  type: object
                type: array
              executionContext:
                description: ExecutionContext contains the state needed to resume
                  execution after approval
                properties:
                  agentName:
                    description: AgentName is the name of the agent being executed
                    type: string
                  agentNamespace:
                    description: AgentNamespace is the namespace of the agent
                    type: string
                  completedToolResults:
                    description: CompletedToolResults contains results of tools that
                      executed before the approval pause
                    items:
                      type: string
                    type: array
                  conversationHistory:
                    description: ConversationHistory is the base64-encoded message
                      array
                    type: string
                  pendingToolCallIndex:
                    description: PendingToolCallIndex is the index of the first tool
                      call awaiting approval
                    type: integer
                required:
                - agentName
                - agentNamespace
                - conversationHistory
                - pendingToolCallIndex
                type: object
              onTimeout:
                default: reject
                description: OnTimeout specifies what to do when approval times out
                enum:
                - reject
                - proceed
                type: string
              queryRef:
                description: QueryRef references the Query that triggered this approval
                  request
                properties:
                  name:
                    type: string
                  namespace:
                    type: string
                required:
                - name
                - namespace
                type: object
              reasonRequired:
                description: ReasonRequired specifies whether a reason must be provided
                  when rejecting
                type: boolean
              timeout:
                description: Timeout is the duration to wait for approval before taking
                  the onTimeout action
                type: string
              toolCalls:
                description: ToolCalls contains the tool calls pending approval
                items:
                  description: ToolCallInfo contains information about a tool call
                    pending approval.
                  properties:
                    agentReasoning:
                      description: AgentReasoning is the model's explanation for why
                        it's calling this tool
                      type: string
                    annotations:
                      description: Annotations contains tool hints (destructive, read-only,
                        etc.)
                      properties:
                        destructiveHint:
                          type: boolean
                        idempotentHint:
                          type: boolean
                        openWorldHint:
                          type: boolean
                        readOnlyHint:
                          type: boolean
                      type: object
                    arguments:
                      description: Arguments is the JSON-serialized arguments for
                        the tool call
                      type: string
                    description:
                      description: Description is the tool description to help approvers
                        understand what the tool does
                      type: string
                    id:
                      description: ID is the unique identifier for this tool call
                      type: string
                    name:
                      description: Name is the tool name
                      type: string
                    type:
                      description: Type is the tool type (http, mcp, agent, etc.)
                      type: string
                  required:
                  - arguments
                  - id
                  - name
                  - type
                  type: object
                minItems: 1
                type: array
            required:
            - executionContext
            - queryRef
            - toolCalls
            type: object
          status:
            description: ToolApprovalRequestStatus defines the observed state of ToolApprovalRequest.
            properties:
              approvalDuration:
                description: ApprovalDuration is the time between request and decision
                type: string
              conditions:
                description: Conditions represent the latest available observations
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              decision:
                description: Decision contains the approval decision details
                properties:
                  action:
                    enum:
                    - approved
                    - rejected
                    type: string
                  clientContext:
                    description: ClientContext contains information about the client
                      that submitted the decision.
                    properties:
                      ipAddress:
                        type: string
                      userAgent:
                        type: string
                    type: object
                  decidedAt:
                    format: date-time
                    type: string
                  decidedBy:
                    type: string
                  reason:
                    type: string
                required:
                - action
                - decidedAt
                - decidedBy
                type: object
              observedGeneration:
                description: ObservedGeneration is used for optimistic locking
                format: int64
                type: integer
              phase:
                default: pending
                enum:
                - pending
                - approved
                - rejected
                - expired
                type: string
              requestedAt:
                description: RequestedAt is when the approval request was created
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
