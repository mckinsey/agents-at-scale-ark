# The dedicated inline authoring permission, checked by SubjectAccessReview on
# every inline Tool create and spec update.
#
# `inlinetools` is a virtual resource: it has no CRD and nothing serves it. It
# exists only so the permission is separable from `tools` — a subject holding
# tool-editor-role can manage Tools without gaining the ability to store
# executable source. Nothing binds this role: granting it is an explicit
# administrator action, per namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: ark
    app.kubernetes.io/managed-by: kustomize
  name: inline-tool-author-role
rules:
- apiGroups:
  - ark.mckinsey.com
  resources:
  - inlinetools
  verbs:
  - use
