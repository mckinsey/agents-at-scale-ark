apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ark-apiserver:system:auth-delegator
  labels:
    {{- include "ark-apiserver.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccountName }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ark-apiserver:extension-apiserver-authentication-reader
  namespace: kube-system
  labels:
    {{- include "ark-apiserver.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccountName }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ark-apiserver-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ark-apiserver.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ark-apiserver-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ark-apiserver.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ark-apiserver-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccountName }}
    namespace: {{ .Release.Namespace }}
---
# ConfigMaps + Secrets read access is required cluster-wide because the apiserver
# resolves Query/Agent/Model parameter references via valueFrom.configMapKeyRef and
# valueFrom.secretKeyRef at admission time. Without this, parameter resolution
# blocks on a controller-runtime informer that can't sync, and POSTs time out.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ark-apiserver-parameter-resolution
  labels:
    {{- include "ark-apiserver.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ark-apiserver-parameter-resolution
  labels:
    {{- include "ark-apiserver.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ark-apiserver-parameter-resolution
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccountName }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.policy.enabled }}
---
# The ValidatingAdmissionPolicy admission plugin watches policy objects from the
# host kube-apiserver to enforce CEL policy on Ark resources in apiserver mode.
# Without this the plugin's informers cannot sync and policy enforcement is inert.
# Namespaces are needed so the plugin can evaluate a binding's namespaceSelector
# (and CEL that references namespaceObject); without it selector-scoped bindings
# silently never match.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ark-apiserver-admission-policy
  labels:
    {{- include "ark-apiserver.labels" . | nindent 4 }}
rules:
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingadmissionpolicies", "validatingadmissionpolicybindings"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  {{- /* paramKind policies need read access to the param resource or the informer never
    syncs and the policy silently never matches. ConfigMaps/Secrets are granted above. */}}
  {{- with .Values.policy.extraParamRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ark-apiserver-admission-policy
  labels:
    {{- include "ark-apiserver.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ark-apiserver-admission-policy
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccountName }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if .Values.policy.thirdPartyWebhooks }}
---
# The webhook admission plugins watch the webhook configurations from the host kube-apiserver to
# know which webhooks to call for a given resource. Without this the managers' informers cannot
# sync, and — as with the policy plugin — upstream does not degrade: every write stalls and is
# then rejected. Read-only: the apiserver never writes these objects.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ark-apiserver-admission-webhooks
  labels:
    {{- include "ark-apiserver.labels" . | nindent 4 }}
rules:
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations", "mutatingwebhookconfigurations"]
    verbs: ["get", "list", "watch"]
  # Webhook matching evaluates namespaceSelector, so the namespace informer is load-bearing here
  # too. Granted independently of the policy role: third-party webhooks can run with
  # policy.enabled=false, and then nothing else would grant it.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ark-apiserver-admission-webhooks
  labels:
    {{- include "ark-apiserver.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ark-apiserver-admission-webhooks
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccountName }}
    namespace: {{ .Release.Namespace }}
{{- end }}
