# [MANAGER]: Manager Deployment Configurations
controllerManager:
  replicas: 1
  container:
    image:
      repository: ghcr.io/mckinsey/agents-at-scale-ark/ark-controller
      # tag defaults to .Chart.AppVersion if not specified
      pullPolicy: IfNotPresent
    args:
      - "--leader-elect"
      - "--metrics-bind-address=:8443"
      - "--health-probe-bind-address=:8081"
    resources:
      limits:
        cpu: 500m
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 64Mi
    livenessProbe:
      initialDelaySeconds: 15
      periodSeconds: 20
      httpGet:
        path: /healthz
        port: 8081
    readinessProbe:
      initialDelaySeconds: 5
      periodSeconds: 10
      httpGet:
        path: /readyz
        port: 8081
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - "ALL"
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  terminationGracePeriodSeconds: 10
  serviceAccountName: ark-controller

# [RBAC]: To enable RBAC (Permissions) configurations
rbac:
  enable: true
  # Service account impersonation for multi-tenancy
  impersonation:
    # Default (development): Allow impersonation of ANY service account
    # This makes it easy to get started - just create namespaces and go!
    allowAll: true

    # Production: Restrict to specific service accounts
    # Must use full Kubernetes format: system:serviceaccount:namespace:name
    #
    # RECOMMENDED: Use a consistent naming convention like 'ark-tenant'
    # across all namespaces to simplify configuration:
    #
    # allowAll: false
    # serviceAccounts:
    #   - system:serviceaccount:default:default
    #   - system:serviceaccount:tenant-1:ark-tenant    # Same name pattern
    #   - system:serviceaccount:tenant-2:ark-tenant    # Same name pattern
    #   - system:serviceaccount:tenant-3:ark-tenant    # Same name pattern
    #   - system:serviceaccount:production:ark-tenant  # Same name pattern
    #
    # This approach:
    # - Makes it clear which namespaces are authorized
    # - Uses a consistent service account name for easy management
    # - Requires updating when adding new tenant namespaces
    #
    # Note: When allowAll is true, the serviceAccounts list is ignored

# [CRDs]: To enable the CRDs
crd:
  # This option determines whether the CRDs are included
  # in the installation process.
  enable: true

  # Enabling this option adds the "helm.sh/resource-policy": keep
  # annotation to the CRD, ensuring it remains installed even when
  # the Helm release is uninstalled.
  # NOTE: Removing the CRDs will also remove all cert-manager CR(s)
  # (Certificates, Issuers, ...) due to garbage collection.
  keep: true

# [METRICS]: Set to true to generate manifests for exporting metrics.
# To disable metrics export set false, and ensure that the
# ControllerManager argument "--metrics-bind-address=:8443" is removed.
metrics:
  enable: true

# [WEBHOOKS]: Webhooks configuration
# The following configuration is automatically generated from the manifests
# generated by controller-gen. To update run 'make manifests' and
# the edit command with the '--force' flag
webhook:
  enable: true

# [PROMETHEUS]: To enable a ServiceMonitor to export metrics to Prometheus set true
prometheus:
  enable: false

# [CERT-MANAGER]: To enable cert-manager injection to webhooks set true
certmanager:
  enable: true

# [NETWORK POLICIES]: To enable NetworkPolicies set true
networkPolicy:
  enable: false

# Container registry configuration
containerRegistry:
  enabled: false
  server: ""
  username: ""
  password: ""
  email: ""
