{{- if .Values.rbac.enable }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  name: ark-controller-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - services
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - list
  - patch
  - watch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - get
  - list
  - update
  - watch
{{- if .Values.rbac.impersonation.enabled }}
- apiGroups:
  - ""
  resources:
  - serviceaccounts
  verbs:
  - impersonate
{{- end }}
- apiGroups:
  - ark.mckinsey.com
  resources:
  - a2aservers
  - a2atasks
  - executionengines
  - mcpservers
  - memories
  - models
  - queries
  - teams
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ark.mckinsey.com
  resources:
  - a2aservers/finalizers
  - a2atasks/finalizers
  - agents/finalizers
  - executionengines/finalizers
  - mcpservers/finalizers
  - memories/finalizers
  - models/finalizers
  - queries/finalizers
  - teams/finalizers
  - tools/finalizers
  verbs:
  - update
- apiGroups:
  - ark.mckinsey.com
  resources:
  - a2aservers/status
  - a2atasks/status
  - agents/status
  - executionengines/status
  - mcpservers/status
  - memories/status
  - models/status
  - queries/status
  - teams/status
  - tools/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - ark.mckinsey.com
  resources:
  - agents
  - tools
  verbs:
  - create
  - delete
  - deletecollection
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ark.mckinsey.com
  resources:
  - arkconfigs
  verbs:
  - get
  - list
  - watch
# Needed by inline tool admission to evaluate the requesting subject's author
# permission. Creating a review is not a grant of that permission.
- apiGroups:
  - authorization.k8s.io
  resources:
  - subjectaccessreviews
  verbs:
  - create
# Inline tool runners. Granted unconditionally, not gated on
# inlineTools.enabled: disabling the feature is exactly when the controller has
# to scale surviving runners to zero and clean up children, so withdrawing the
# access with the flag would strand the pods and finalizers it must remove.
- apiGroups:
  - ""
  resources:
  - configmaps
  - serviceaccounts
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - replicasets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
{{- end -}}
