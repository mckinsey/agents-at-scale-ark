{{- if .Values.queue.deployPostgres }}
{{- $secret := lookup "v1" "Secret" .Release.Namespace (printf "%s-postgres" .Release.Name) }}
{{- $password := "" }}
{{- if $secret }}
  {{- $password = index $secret.data "password" | b64dec }}
{{- else }}
  {{- $password = .Values.queue.postgres.password | default (randAlphaNum 32) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
type: Opaque
stringData:
  username: {{ .Values.queue.postgres.username }}
  password: {{ $password }}
{{- end }}
