# Example values file for production multi-tenant Ark deployments
# This restricts impersonation to specific service accounts only

rbac:
  enable: true
  impersonation:
    # Disable allowAll for production security
    allowAll: false

    # Explicitly list allowed service accounts
    serviceAccounts:
      - default
      - ark-tenant-sa
      # Add your custom tenant service accounts below:
      - tenant-dev-sa
      - tenant-staging-sa
      - tenant-prod-sa