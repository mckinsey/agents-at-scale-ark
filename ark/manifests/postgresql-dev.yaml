apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  namespace: ark-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
      - name: postgresql
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: ark
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: arkdev123
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: ark-system
spec:
  selector:
    app: postgresql
  ports:
  - port: 5432
    targetPort: 5432
