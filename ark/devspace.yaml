# DevSpace configuration for ark service
version: v2beta1

vars:
  STORAGE_BACKEND:
    source: env
    default: "etcd"

images:
  ark-controller:
    image: ark-controller
    dockerfile: ./Dockerfile
    context: .

pipelines:
  deploy: |-
    build_images --all
    if [ "${STORAGE_BACKEND}" == "postgresql" ]; then
      create_deployments postgresql
    fi
    create_deployments ark-controller
  dev: |-
    if [ "${STORAGE_BACKEND}" == "postgresql" ]; then
      create_deployments postgresql
    fi
    create_deployments ark-controller
    start_dev --all

deployments:
  ark-controller:
    namespace: ark-system
    helm:
      chart:
        path: ./dist/chart
      values:
        controllerManager:
          container:
            image:
              repository: ${runtime.images.ark-controller.image}
              tag: ${runtime.images.ark-controller.tag}
            resources:
              limits:
                memory: "2048Mi"
                cpu: "2000m"
              requests:
                memory: "256Mi"
                cpu: "200m"
          securityContext:
            runAsNonRoot: false
        webhook:
          enable: true

dev:
  ark-controller:
    imageSelector: ark-controller
    devImage: golang:1.24.11-bookworm
    command:
      ["sh", "-c", "cd /app && while [ ! -f internal/apiserver/crds/ark.mckinsey.com_agents.yaml ]; do echo 'Waiting for CRD files...'; sleep 2; done && GOTOOLCHAIN=auto go run cmd/main.go --leader-elect=false"]
    namespace: ark-system
    logs:
      lastLines: 50
    sync:
      - path: .:/app
        startContainer: true
        disableDownload: true
        uploadExcludeFile: .dockerignore
        onUpload:
          restartContainer: true
    ssh:
      enabled: true

profiles:
  - name: storage-postgresql
    activation:
      - vars:
          STORAGE_BACKEND: "postgresql"
    patches:
      - op: add
        path: deployments.postgresql
        value:
          namespace: ark-system
          kubectl:
            manifests:
              - ./manifests/postgresql-dev.yaml
      - op: replace
        path: dev.ark-controller.command
        value:
          - "sh"
          - "-c"
          - |
            cd /app
            while [ ! -f internal/apiserver/crds/ark.mckinsey.com_agents.yaml ]; do echo 'Waiting for CRD files...'; sleep 2; done
            GOTOOLCHAIN=auto \
            ARK_STORAGE_BACKEND=postgresql \
            ARK_POSTGRES_HOST=postgresql.ark-system.svc.cluster.local \
            ARK_POSTGRES_PORT=5432 \
            ARK_POSTGRES_DATABASE=ark \
            ARK_POSTGRES_USER=postgres \
            ARK_POSTGRES_PASSWORD=arkdev123 \
            ARK_POSTGRES_SSL_MODE=disable \
            ARK_APISERVER_PORT=6443 \
            go run cmd/main.go --leader-elect=false

  - name: storage-sqlite
    activation:
      - vars:
          STORAGE_BACKEND: "sqlite"
    patches:
      - op: replace
        path: dev.ark-controller.command
        value:
          - "sh"
          - "-c"
          - |
            cd /app
            while [ ! -f internal/apiserver/crds/ark.mckinsey.com_agents.yaml ]; do echo 'Waiting for CRD files...'; sleep 2; done
            GOTOOLCHAIN=auto \
            ARK_STORAGE_BACKEND=sqlite \
            ARK_SQLITE_PATH=/tmp/ark.db \
            ARK_APISERVER_PORT=6443 \
            go run cmd/main.go --leader-elect=false
